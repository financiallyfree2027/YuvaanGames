<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Two Pieces, One Hero!</title>
<style>
/* ============================================================
   TWO PIECES, ONE HERO!  — 20-level logic quest for little heroes
   All art is CSS / SVG / emoji. No external requests.
   ============================================================ */
:root{
  --red:#E53935; --blue:#1E5AE8; --gold:#FFC93C; --green:#4CAF50;
  --teal:#3E6B8C; --purple:#6B5B95; --sky1:#87CEEB; --sky2:#FFE9A8;
}
*{ margin:0; padding:0; box-sizing:border-box;
   -webkit-user-select:none; user-select:none;
   -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
body{ touch-action:none; }
/* while the level map is open, let vertical pans reach #mapScroll */
body.mapOpen{ touch-action:pan-y; }
html,body{ width:100%; height:100%; overflow:hidden;
  font-family:'Comic Sans MS','Chalkboard SE','Marker Felt',sans-serif;
  background:#87CEEB; }
button{ font-family:inherit; }

/* ---------- game shell ---------- */
#game{ position:fixed; inset:0; overflow:hidden; display:none; }
#game.on{ display:block; }

/* ---------- scene (vignette) ---------- */
#scene{ position:absolute; left:0; top:0; right:0; bottom:196px;
  overflow:hidden; transition:opacity .55s ease, background 1s ease; }
#skyline{ position:absolute; left:0; right:0; bottom:0; height:55%;
  opacity:.45; pointer-events:none; }
#ground{ position:absolute; left:0; right:0; bottom:0; height:60px;
  background:linear-gradient(180deg,#F2D389,#DDb865);
  border-top:6px solid rgba(255,255,255,.55); }

/* generic obstacle vignette: a blocker in the middle + a friend in need */
.blockBox{ position:absolute; bottom:56px; left:44%; font-size:118px;
  line-height:1; z-index:4; filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));
  transition:opacity .8s ease, transform .8s ease; }
.blockBox.solved{ opacity:.3; transform:scale(.82); }
.goalBox{ position:absolute; bottom:62px; right:7%; font-size:100px;
  line-height:1; z-index:4; animation:floaty2 1.8s ease-in-out infinite;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.25)); transition:font-size .4s; }
.goalBox.cheer{ animation:cheerHop .5s ease-in-out infinite; }
@keyframes floaty2{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes cheerHop{ 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-22px) rotate(4deg)} }

/* placed result object (bridge, wheel, lantern...) */
#placedObj{ position:absolute; font-size:92px; line-height:1;
  transform:translate(-50%,-50%); pointer-events:none; z-index:5;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.25)); }

/* ---------- Web Buddy ---------- */
#buddy{ position:absolute; bottom:48px; left:8%; width:110px; height:150px;
  z-index:6; transition:left 1.9s linear; }
#buddy svg{ width:100%; height:100%; overflow:visible; }
#buddy .bod, #startBuddy .bod, #mapBuddy .bod{ animation:idle 1.2s ease-in-out infinite; transform-box:fill-box; }
@keyframes idle{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
.armL,.armR{ transform-box:fill-box; transform-origin:top center;
  transition:transform .3s ease; }
#buddy.scratch .armR{ animation:scratchA .5s ease-in-out 3; }
@keyframes scratchA{ 0%,100%{transform:rotate(0)} 50%{transform:rotate(-135deg)} }
#buddy.celebrate .armL, svg.celebrate .armL{ transform:rotate(160deg); }
#buddy.celebrate .armR, svg.celebrate .armR{ transform:rotate(-160deg); }
#buddy.celebrate .bod, svg.celebrate .bod{ animation:hopB .5s ease-in-out infinite; }
@keyframes hopB{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
#buddy.walk .bod{ animation:walkBob .35s ease-in-out infinite; }
@keyframes walkBob{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
#carry{ position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
  font-size:44px; pointer-events:none; }

/* ---------- mixing web circle ---------- */
#circle{ position:absolute; left:50%; top:35%; width:270px; height:270px;
  transform:translate(-50%,-50%); border-radius:50%; z-index:4;
  border:6px dashed rgba(255,255,255,.95);
  background:radial-gradient(circle,rgba(255,255,255,.42) 0%,rgba(255,255,255,.12) 70%);
  animation:circleGlow 2.4s ease-in-out infinite; pointer-events:none; }
@keyframes circleGlow{
  0%,100%{ box-shadow:0 0 24px 6px rgba(255,201,60,.45); }
  50%{ box-shadow:0 0 48px 16px rgba(255,201,60,.85); } }
#circle svg{ position:absolute; inset:14px; opacity:.35; }
#circle .lbl{ position:absolute; bottom:-46px; width:100%; text-align:center;
  font-size:28px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.35); }

/* ---------- tray ---------- */
#tray{ position:absolute; left:0; right:0; bottom:0; height:196px;
  background:linear-gradient(180deg,#FFF6DE,#FFE9A8);
  border-top:8px solid var(--gold); display:flex; align-items:center;
  justify-content:space-evenly; gap:1vw; z-index:3; padding:0 8px; }
.slotHome{ width:144px; height:144px; border-radius:26px;
  border:4px dashed rgba(107,91,149,.3); flex:0 0 auto; }

/* ---------- pieces ---------- */
.piece{ position:absolute; width:140px; height:140px; border-radius:26px;
  background:#fff; display:flex; align-items:center; justify-content:center;
  font-size:80px; line-height:1; z-index:20; cursor:pointer;
  border:5px solid #fff;
  box-shadow:0 6px 0 rgba(0,0,0,.12), 0 0 16px 5px var(--glow,rgba(255,255,255,.6));
  transition:left .45s cubic-bezier(.34,1.56,.64,1), top .45s cubic-bezier(.34,1.56,.64,1),
             transform .25s ease, box-shadow .25s ease, opacity .3s ease; }
.piece.drag{ transition:transform .15s ease; transform:scale(1.18) rotate(-3deg);
  z-index:40; box-shadow:0 22px 24px rgba(0,0,0,.3), 0 0 22px 8px var(--glow,#fff); }
.piece.wobble{ animation:wob .55s ease-in-out; }
@keyframes wob{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-12deg)}
  40%{transform:rotate(12deg)} 60%{transform:rotate(-9deg)} 80%{transform:rotate(9deg)} }
.piece.hint{ animation:hintPulse 1.3s ease-in-out infinite; }
@keyframes hintPulse{ 0%,100%{ transform:scale(1); box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 14px 4px var(--glow); }
  50%{ transform:scale(1.07); box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 32px 13px var(--glow); } }
.piece.merging{ transition:left .4s ease-in, top .4s ease-in, transform .4s ease-in, opacity .4s;
  transform:scale(.1) rotate(180deg); opacity:0; }

/* merged object shown in circle then flying out */
#mergeObj{ position:absolute; font-size:110px; line-height:1; z-index:45;
  transform:translate(-50%,-50%); pointer-events:none; display:none;
  filter:drop-shadow(0 0 18px rgba(255,201,60,.9));
  transition:left .65s cubic-bezier(.34,1.3,.64,1), top .65s cubic-bezier(.34,1.3,.64,1); }
#mergeObj.pop{ animation:popIn .5s cubic-bezier(.34,1.56,.64,1); }
#mergeObj.rocket{ transition:left 2.4s ease-in, top 2.4s ease-in; }
@keyframes popIn{ 0%{transform:translate(-50%,-50%) scale(0)} 100%{transform:translate(-50%,-50%) scale(1)} }

/* sparkles */
.spark{ position:absolute; font-size:30px; z-index:46; pointer-events:none;
  animation:sparkFly .85s ease-out forwards; }
@keyframes sparkFly{ 0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }

/* ---------- ghost hand (drag demo) ---------- */
#ghost{ position:fixed; z-index:75; font-size:78px; line-height:1; display:none;
  pointer-events:none; opacity:0;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
  transition:left 1.4s ease-in-out, top 1.4s ease-in-out, opacity .4s ease; }

/* ---------- HUD ---------- */
#muteBtn{ position:fixed; top:14px; left:14px; width:92px; height:92px;
  font-size:48px; border-radius:26px; border:5px solid #fff; z-index:120;
  background:rgba(30,90,232,.85); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.2); }
#homeBtn{ position:absolute; top:14px; right:14px; width:92px; height:92px;
  font-size:46px; border-radius:26px; border:5px solid #fff; z-index:60;
  background:rgba(107,91,149,.88); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.2); }
#lvlBadge{ position:absolute; top:24px; left:50%; transform:translateX(-50%);
  z-index:58; background:rgba(255,255,255,.75); color:var(--teal);
  border:4px solid var(--gold); border-radius:24px; padding:8px 26px;
  font-size:30px; pointer-events:none; }

#msg{ position:absolute; top:118px; left:50%; transform:translateX(-50%);
  z-index:55; background:rgba(255,255,255,.94); color:#333;
  border:5px solid var(--gold); border-radius:30px; padding:12px 34px;
  font-size:32px; white-space:nowrap; text-align:center; opacity:0;
  box-shadow:0 8px 18px rgba(0,0,0,.2); pointer-events:none; max-width:94vw; }
#msg.show{ animation:msgIn 2.6s ease forwards; }
@keyframes msgIn{ 0%{opacity:0; transform:translateX(-50%) translateY(-30px) scale(.7);}
  12%{opacity:1; transform:translateX(-50%) translateY(0) scale(1.05);}
  20%{transform:translateX(-50%) scale(1);} 80%{opacity:1;} 100%{opacity:0;} }

/* ---------- start screen ---------- */
#start{ position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2)); }
#start h1{ font-size:54px; color:var(--red); text-shadow:3px 3px 0 #fff; text-align:center; }
#start p{ font-size:30px; color:var(--teal); text-align:center; }
#playBtn{ width:220px; height:220px; border-radius:50%; border:10px solid #fff;
  background:radial-gradient(circle at 35% 30%,#FF7043,var(--red));
  color:#fff; font-size:96px; box-shadow:0 14px 0 rgba(0,0,0,.18);
  animation:playPulse 1.4s ease-in-out infinite; }
@keyframes playPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.09)} }
#startBuddy{ width:120px; height:164px; }

/* ---------- LEVEL MAP ---------- */
#map{ position:fixed; inset:0; z-index:80; display:none; flex-direction:column;
  background:linear-gradient(180deg,#7EC8F5 0%,#B8E0F8 30%,#FFE9A8 100%); }
#map.on{ display:flex; }
#mapHead{ flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  gap:20px; padding:14px 110px; background:rgba(255,255,255,.55);
  border-bottom:6px solid var(--gold); z-index:5; }
#mapHead h2{ font-size:34px; color:var(--teal); text-shadow:2px 2px 0 #fff; white-space:nowrap; }
#contBtn{ font-size:28px; padding:12px 30px; border-radius:30px; border:5px solid #fff;
  background:var(--green); color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.18);
  animation:playPulse 1.6s ease-in-out infinite; }
#mapScroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; position:relative; }
#mapScroll, #mapScroll *{ touch-action:pan-y; }
#mapInner{ position:relative; width:100%; }
#mapPath{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.decor{ position:absolute; font-size:64px; line-height:1; opacity:.55;
  pointer-events:none; transform:translate(-50%,-50%); }
.node{ position:absolute; width:96px; height:96px; border-radius:50%;
  transform:translate(-50%,-50%); border:6px solid #fff; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:38px; line-height:1; color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.15); }
.node .nStars{ font-size:15px; margin-top:2px; letter-spacing:-2px; }
.node.open{ background:radial-gradient(circle at 35% 30%,#FF7043,var(--red));
  animation:nodePulse 1.5s ease-in-out infinite; }
@keyframes nodePulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1);
    box-shadow:0 6px 0 rgba(0,0,0,.15),0 0 14px 5px rgba(255,201,60,.5); }
  50%{ transform:translate(-50%,-50%) scale(1.1);
    box-shadow:0 6px 0 rgba(0,0,0,.15),0 0 30px 12px rgba(255,201,60,.85); } }
.node.done{ background:radial-gradient(circle at 35% 30%,#8BC34A,var(--green)); }
.node.lock{ background:radial-gradient(circle at 40% 35%,#C8C8CE,#8D8D96);
  border-style:dashed; border-color:rgba(255,255,255,.75); font-size:34px; }
.node.wiggle{ animation:nodeWig .5s ease-in-out; }
@keyframes nodeWig{ 0%,100%{transform:translate(-50%,-50%) rotate(0)}
  25%{transform:translate(-50%,-50%) rotate(-10deg)} 50%{transform:translate(-50%,-50%) rotate(10deg)}
  75%{transform:translate(-50%,-50%) rotate(-7deg)} }
#mapBuddy{ position:absolute; width:78px; height:106px; z-index:4;
  transform:translate(-50%,-100%); pointer-events:none; }

/* ---------- toast ---------- */
#toast{ position:fixed; bottom:44px; left:50%; transform:translateX(-50%);
  z-index:130; background:rgba(60,50,90,.92); color:#fff;
  border:4px solid var(--gold); border-radius:26px; padding:12px 30px;
  font-size:28px; white-space:nowrap; opacity:0; pointer-events:none; }
#toast.show{ animation:toastIn 2.2s ease forwards; }
@keyframes toastIn{ 0%{opacity:0; transform:translateX(-50%) translateY(24px);}
  14%{opacity:1; transform:translateX(-50%) translateY(0);}
  80%{opacity:1;} 100%{opacity:0;} }

/* ---------- WIN OVERLAY ---------- */
#win{ position:fixed; inset:0; z-index:110; display:none; align-items:center;
  justify-content:center; background:rgba(40,30,70,.55); }
#win.show{ display:flex; }
#winCard{ background:linear-gradient(180deg,#FFF6DE,#FFE9A8); border:8px solid var(--gold);
  border-radius:40px; padding:28px 48px; text-align:center;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  animation:winPop .55s cubic-bezier(.34,1.56,.64,1); max-width:92vw; }
@keyframes winPop{ 0%{transform:scale(.4); opacity:0;} 100%{transform:scale(1); opacity:1;} }
#winCard h2{ font-size:44px; color:var(--red); text-shadow:2px 2px 0 #fff; }
#winStars{ font-size:0; margin:10px 0 4px; }
#winStars span{ font-size:78px; display:inline-block; margin:0 6px;
  filter:grayscale(1) opacity(.35); }
#winStars span.won{ filter:none; animation:starPop .6s cubic-bezier(.34,1.56,.64,1) backwards; }
@keyframes starPop{ 0%{transform:scale(0)} 60%{transform:scale(1.6) rotate(15deg)} 100%{transform:scale(1)} }
#winWord{ font-size:30px; color:var(--purple); margin-bottom:16px; }
#nextBtn{ display:block; width:100%; font-size:42px; padding:20px 40px; margin:8px 0;
  border-radius:36px; border:6px solid #fff; background:var(--green); color:#fff;
  box-shadow:0 8px 0 rgba(0,0,0,.18); animation:playPulse 1.5s ease-in-out infinite; }
#mapBtn{ display:block; width:100%; font-size:30px; padding:14px 36px; margin:8px 0;
  border-radius:30px; border:5px solid #fff; background:var(--blue); color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.18); }

/* ---------- finale parade & confetti ---------- */
#parade{ position:absolute; bottom:220px; left:0; right:0; height:110px; z-index:48;
  pointer-events:none; white-space:nowrap; font-size:70px; line-height:110px;
  display:none; }
#parade.go{ display:block; animation:pdMove 13s linear forwards; }
@keyframes pdMove{ 0%{transform:translateX(100vw)} 100%{transform:translateX(-110%)} }
#parade .pd{ display:inline-block; margin:0 12px; animation:pdHop 1s ease-in-out infinite; }
@keyframes pdHop{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
.conf{ position:fixed; top:-24px; width:16px; height:24px; z-index:105;
  animation:confFall linear forwards; pointer-events:none; }
@keyframes confFall{ 0%{ transform:translateY(0) rotate(0); }
  100%{ transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>

<!-- ================= START SCREEN ================= -->
<div id="start">
  <h1>🕸️ Two Pieces, One Hero! 🕸️</h1>
  <div id="startBuddy"></div>
  <p>Mix two pieces to help Web Buddy! 🦸<br>20 puzzles on the web path! ⭐</p>
  <button id="playBtn">▶</button>
</div>

<!-- ================= LEVEL MAP ================= -->
<div id="map">
  <div id="mapHead">
    <h2>🏙️ Web Path 🕸️</h2>
    <button id="contBtn">Continue ▶</button>
  </div>
  <div id="mapScroll"><div id="mapInner"></div></div>
</div>

<!-- ================= GAME ================= -->
<div id="game">
  <div id="scene">
    <svg id="skyline" viewBox="0 0 800 200" preserveAspectRatio="none">
      <rect x="20"  y="60"  width="90"  height="140" fill="#3E6B8C" rx="6"/>
      <rect x="130" y="30"  width="70"  height="170" fill="#6B5B95" rx="6"/>
      <rect x="220" y="90"  width="110" height="110" fill="#3E6B8C" rx="6"/>
      <rect x="360" y="50"  width="80"  height="150" fill="#6B5B95" rx="6"/>
      <rect x="470" y="100" width="100" height="100" fill="#3E6B8C" rx="6"/>
      <rect x="600" y="40"  width="75"  height="160" fill="#6B5B95" rx="6"/>
      <rect x="700" y="80"  width="90"  height="120" fill="#3E6B8C" rx="6"/>
      <g fill="#FFE9A8" opacity=".8">
        <rect x="45" y="80" width="14" height="14"/><rect x="150" y="55" width="14" height="14"/>
        <rect x="385" y="75" width="14" height="14"/><rect x="620" y="65" width="14" height="14"/>
        <rect x="720" y="100" width="14" height="14"/><rect x="250" y="110" width="14" height="14"/>
      </g>
    </svg>
    <div id="ground"></div>
    <div id="obstacle"></div>
    <div id="placedObj"></div>
    <div id="buddy"></div>
  </div>

  <div id="circle">
    <svg viewBox="0 0 100 100">
      <g stroke="#fff" stroke-width="1.5" fill="none">
        <circle cx="50" cy="50" r="14"/><circle cx="50" cy="50" r="28"/><circle cx="50" cy="50" r="42"/>
        <line x1="50" y1="8" x2="50" y2="92"/><line x1="8" y1="50" x2="92" y2="50"/>
        <line x1="20" y1="20" x2="80" y2="80"/><line x1="80" y1="20" x2="20" y2="80"/>
      </g>
    </svg>
    <div class="lbl">✨ Mixing Web ✨</div>
  </div>

  <div id="tray"></div>
  <div id="parade"></div>
  <div id="mergeObj"></div>
  <button id="homeBtn">🗺️</button>
  <div id="lvlBadge">Level 1</div>
  <div id="msg"></div>
</div>

<!-- ================= WIN OVERLAY ================= -->
<div id="win">
  <div id="winCard">
    <h2 id="winTitle">You did it! 🎉</h2>
    <div id="winStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p id="winWord">Web Buddy is so happy!</p>
    <button id="nextBtn">Next Level ▶</button>
    <button id="mapBtn">Map 🗺️</button>
  </div>
</div>

<div id="ghost">👆</div>
<div id="toast"></div>
<button id="muteBtn">🔊</button>

<script>
/* ============================================================
   TWO PIECES, ONE HERO!  — game logic (20-level quest)
   ============================================================ */
'use strict';

/* ---------- Web Buddy SVG (chibi hero, head ~45% of height) ---------- */
function buddySVG(){
  return '<svg viewBox="0 0 100 140">'
    + '<g class="bod">'
    + '<rect class="legs" x="38" y="96" width="10" height="28" rx="5" fill="#E53935"/>'
    + '<rect x="52" y="96" width="10" height="28" rx="5" fill="#E53935"/>'
    + '<ellipse cx="43" cy="126" rx="8" ry="5" fill="#B71C1C"/>'
    + '<ellipse cx="57" cy="126" rx="8" ry="5" fill="#B71C1C"/>'
    + '<rect x="33" y="60" width="34" height="40" rx="15" fill="#1E5AE8"/>'
    + '<path d="M42 72 L50 82 L58 72 L50 76 Z" fill="#E53935"/>'
    + '<g class="armL"><rect x="26" y="64" width="9" height="26" rx="4.5" fill="#E53935"/>'
    + '<circle cx="30.5" cy="91" r="5.5" fill="#E53935"/></g>'
    + '<g class="armR"><rect x="65" y="64" width="9" height="26" rx="4.5" fill="#E53935"/>'
    + '<circle cx="69.5" cy="91" r="5.5" fill="#E53935"/></g>'
    + '<circle cx="50" cy="34" r="31" fill="#E53935"/>'
    + '<g stroke="#FFF" stroke-width="2" fill="none" opacity="0.4">'
    + '<path d="M28 22 Q50 34 72 22"/><path d="M24 34 Q50 48 76 34"/><path d="M28 46 Q50 60 72 46"/>'
    + '<line x1="50" y1="4" x2="50" y2="30"/><line x1="26" y1="14" x2="42" y2="30"/>'
    + '<line x1="74" y1="14" x2="58" y2="30"/><line x1="19" y1="34" x2="40" y2="36"/>'
    + '</g>'
    + '<ellipse cx="39" cy="34" rx="10" ry="13" fill="#FFF" stroke="#333" stroke-width="2" transform="rotate(-8 39 34)"/>'
    + '<ellipse cx="61" cy="34" rx="10" ry="13" fill="#FFF" stroke="#333" stroke-width="2" transform="rotate(8 61 34)"/>'
    + '<circle cx="40" cy="36" r="3.4" fill="#333"/><circle cx="60" cy="36" r="3.4" fill="#333"/>'
    + '<path d="M44 55 Q50 59 56 55" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    + '</g></svg>';
}

/* ============================================================
   LEVEL DATA — 20 puzzles.
   good: the two correct pieces | bad: silly distractors
   result flies to block (if set) else to goal. goal → happy.
   ============================================================ */

/* ---------- persistence: localStorage with in-memory fallback ---------- */
const SAVE_KEY='yuvaan_logic';
let save = { unlocked:1, stars:new Array(20).fill(0) };
function loadSave(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(d && Array.isArray(d.stars) && d.stars.length===20){
      save.unlocked = Math.min(Math.max(1, d.unlocked|0), 20);
      save.stars = d.stars.map(n=>Math.max(0, Math.min(3, n|0)));
    }
  }catch(e){ /* keep in-memory save */ }
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){ /* memory only */ }
}
loadSave();

/* ============================================================
   AUDIO — Web Audio API only
   ============================================================ */
let AC=null, master=null, musicGain=null, musicTimer=null, muted=false, mStep=0;
const SCALE=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99];
const MEL =[0,2,4,7,4,2,5,4, 0,2,4,7,9,7,4,-1, 2,4,5,7,5,4,2,0, 4,7,9,8,7,4,2,-1];
const BASS=[130.8,-1,164.8,-1,196.0,-1,164.8,-1];

function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 1; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.15; musicGain.connect(master);
  startMusic();
}
function tone(freq, when, dur, type, gain, dest, glideTo){
  if(!AC || freq<=0) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq, when);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, when+dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(gain, when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest||master);
  o.start(when); o.stop(when+dur+0.05);
}
/* chiptune loop ~110 BPM: square pentatonic melody + triangle bass */
function startMusic(){
  if(musicTimer) return;
  const stepDur = 60/110/2;
  musicTimer = setInterval(()=>{
    if(!AC || AC.state!=='running') return;
    const t = AC.currentTime + 0.06;
    const m = MEL[mStep % MEL.length];
    if(m>=0) tone(SCALE[m], t, stepDur*0.9, 'square', 0.30, musicGain);
    const b = BASS[mStep % BASS.length];
    if(b>0) tone(b, t, stepDur*1.7, 'triangle', 0.55, musicGain);
    mStep++;
  }, stepDur*1000);
}
function sPlop(){ if(AC) tone(320, AC.currentTime, 0.14, 'sine', 0.35, master, 140); }
function sPop(){ if(!AC) return; const t=AC.currentTime;
  tone(520, t, 0.1, 'sine', 0.35, master, 260); tone(780, t+0.1, 0.16, 'sine', 0.28, master); }
function sGliss(){ if(!AC) return; const t=AC.currentTime;
  for(let i=0;i<8;i++) tone(SCALE[i], t+i*0.07, 0.22, 'triangle', 0.3, master);
  tone(SCALE[8], t+0.56, 0.5, 'triangle', 0.35, master); }
function sHmm(){ if(!AC) return; const t=AC.currentTime;
  tone(330, t, 0.22, 'triangle', 0.25, master, 300);
  tone(262, t+0.26, 0.3, 'triangle', 0.25, master, 240); }
function sBoing(){ if(!AC) return; const t=AC.currentTime;
  tone(140, t, 0.32, 'sine', 0.4, master, 520);
  tone(140, t+0.34, 0.26, 'sine', 0.3, master, 420); }
function sClick(){ if(!AC) return; const t=AC.currentTime;
  for(let i=0;i<4;i++) tone(880+i*120, t+i*0.09, 0.05, 'square', 0.2, master); }
function sTwinkle(){ if(!AC) return; const t=AC.currentTime;
  [784,988,1319,1568].forEach((f,i)=> tone(f, t+i*0.09, 0.3, 'sine', 0.25, master)); }
function sFanfare(){ if(!AC) return; const t=AC.currentTime;
  const seq=[[262,330,392],[349,440,523],[392,494,587],[523,659,784]];
  seq.forEach((ch,i)=> ch.forEach(f=>{
    tone(f, t+i*0.28, i===3?0.9:0.24, 'square', 0.16, master);
    tone(f/2, t+i*0.28, i===3?0.9:0.24, 'triangle', 0.2, master); }));
  for(let i=0;i<6;i++) tone(1046+i*120, t+1.2+i*0.08, 0.25, 'sine', 0.15, master); }
function objSfx(name){
  if(name==='boing') sBoing();
  else if(name==='click') sClick();
  else if(name==='pop') sPop();
  else sTwinkle();
}

/* ============================================================
   HELPERS
   ============================================================ */
function say(text){
  msg.textContent = text;
  msg.classList.remove('show'); void msg.offsetWidth; msg.classList.add('show');
}
function toast(text){
  toastEl.textContent = text;
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
}
function circleCenter(){
  const r = circle.getBoundingClientRect();
  return { x:r.left+r.width/2, y:r.top+r.height/2 };
}
function slotPos(i){
  const c = circleCenter();
  return { x: c.x + (i===0?-62:62), y: c.y };
}
function sparkleBurst(x,y,n){
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='spark'; s.textContent = i%3===0?'⭐':'✨';
    const a=Math.random()*Math.PI*2, d=60+Math.random()*110;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx', Math.cos(a)*d+'px');
    s.style.setProperty('--dy', Math.sin(a)*d+'px');
    game.appendChild(s); setTimeout(()=>s.remove(), 900);
  }
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============================================================
   ASSISTS — gentle pulse at 8s idle, ghost-hand demo at 15s
   ============================================================ */
function hideGhost(){ ghost.style.opacity='0'; ghost.style.display='none'; }
function clearAssist(){
  clearTimeout(idleT1); clearTimeout(idleT2);
  clearInterval(ghostLoop); ghostLoop=null;
  hideGhost();
  pieces.forEach(p=>p.el.classList.remove('hint'));
}
function armAssist(){
  clearAssist();
  if(locked || !game.classList.contains('on')) return;
  idleT1 = setTimeout(()=>{
    pieces.forEach(p=>{ if(p.ok && p.slot<0) p.el.classList.add('hint'); });
  }, 8000);
  idleT2 = setTimeout(()=>{
    ghostDemo();
    ghostLoop = setInterval(ghostDemo, 4200);
  }, 15000);
}
function ghostDemo(){
  const p = pieces.find(q=>q.ok && q.slot<0);
  if(!p){ hideGhost(); return; }
  const r=p.el.getBoundingClientRect(), c=circleCenter();
  ghost.style.transition='none'; ghost.style.opacity='0';
  ghost.style.left=(r.left+r.width/2-24)+'px';
  ghost.style.top =(r.top +r.height/2-14)+'px';
  ghost.style.display='block';
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    ghost.style.transition='left 1.4s ease-in-out, top 1.4s ease-in-out, opacity .4s ease';
    ghost.style.opacity='1';
    ghost.style.left=(c.x-24)+'px'; ghost.style.top=(c.y-14)+'px';
    setTimeout(()=>{ ghost.style.opacity='0'; }, 1600);
    setTimeout(()=>{ ghost.style.display='none'; }, 2050);
  });});
}
game.addEventListener('pointerdown', ()=>{ if(!locked) armAssist(); });

/* ============================================================
   PIECES — drag with pointer capture + tap-tap alternative
   ============================================================ */
function makePiece(emoji, ok, glow){
  const el=document.createElement('div');
  el.className='piece'; el.textContent=emoji;
  el.style.setProperty('--glow', ok?glow:'rgba(160,160,160,.5)');
  const p={ el, emoji, ok, home:{x:0,y:0}, slot:-1 };
  let sx=0, sy=0, px=0, py=0, moving=false, downT=0;

  el.addEventListener('pointerdown', ev=>{
    if(locked) return;
    ev.preventDefault();
    el.setPointerCapture(ev.pointerId);
    sx=ev.clientX; sy=ev.clientY; downT=Date.now(); moving=false;
    px=parseFloat(el.style.left); py=parseFloat(el.style.top);
    sPlop();
  });
  el.addEventListener('pointermove', ev=>{
    if(locked || !el.hasPointerCapture(ev.pointerId)) return;
    const dx=ev.clientX-sx, dy=ev.clientY-sy;
    if(!moving && Math.hypot(dx,dy)>12){
      moving=true; el.classList.add('drag'); freeSlotOf(p);
    }
    if(moving){ el.style.left=(px+dx)+'px'; el.style.top=(py+dy)+'px'; }
  });
  el.addEventListener('pointerup', ev=>{
    if(locked) return;
    el.classList.remove('drag');
    if(!moving && Date.now()-downT<600){          // ---- TAP ----
      if(p.slot>=0){ freeSlotOf(p); flyHome(p); } // tap piece in circle → back
      else sendToCircle(p);                        // tap in tray → fly to circle
      return;
    }
    // ---- DRAG RELEASE ----
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2, c=circleCenter();
    if(Math.hypot(cx-c.x, cy-c.y) < 125) sendToCircle(p);
    else flyHome(p);
  });
  el.addEventListener('pointercancel', ()=>{ el.classList.remove('drag'); flyHome(p); });
  return p;
}
function freeSlotOf(p){
  if(p.slot>=0){ slots[p.slot]=null; p.slot=-1; clearTimeout(evalTimer); }
}
function flyHome(p){
  freeSlotOf(p);
  p.el.style.left=p.home.x+'px'; p.el.style.top=p.home.y+'px';
}
function sendToCircle(p){
  freeSlotOf(p);
  const i = slots[0]===null?0 : slots[1]===null?1 : -1;
  if(i<0){ p.el.classList.add('wobble'); setTimeout(()=>p.el.classList.remove('wobble'),600); flyHome(p); return; }
  slots[i]=p; p.slot=i;
  const s=slotPos(i);
  p.el.style.left=(s.x-70)+'px'; p.el.style.top=(s.y-70)+'px';
  setTimeout(sPlop, 380);
  if(slots[0] && slots[1]){ clearTimeout(evalTimer); evalTimer=setTimeout(evaluatePair, 650); }
}

/* ============================================================
   PUZZLE BUILD / LAYOUT
   ============================================================ */
function buildPuzzle(i){
  cur=i; wrongTries=0; slots=[null,null]; locked=false;
  const L=LEVELS[i];
  $('lvlBadge').textContent = 'Level '+(i+1)+' 🕸️';
  scene.style.background = L.bg;
  obstacleBox.innerHTML =
    (L.block ? '<div class="blockBox"><span id="blockEm">'+L.block+'</span></div>' : '')
    + '<div class="goalBox"><span id="goalEm">'+L.goal+'</span></div>';
  placedObj.textContent=''; mergeObj.style.display='none'; mergeObj.classList.remove('rocket');
  parade.classList.remove('go'); parade.innerHTML='';
  buddy.style.transition='none'; buddy.style.left='8%';
  requestAnimationFrame(()=>{ buddy.style.transition='left 1.9s linear'; });
  buddy.className=''; const c=$('carry'); if(c) c.remove();

  pieces.forEach(p=>p.el.remove()); pieces=[];
  const defs = shuffle(L.good.map(e=>({e,ok:true})).concat(L.bad.map(e=>({e,ok:false}))));
  tray.innerHTML='';
  defs.forEach(()=>{ const h=document.createElement('div'); h.className='slotHome'; tray.appendChild(h); });
  defs.forEach(d=>{ const p=makePiece(d.e, d.ok, L.glow); game.appendChild(p.el); pieces.push(p); });
  layoutPieces();
  say(L.prompt+' Mix two pieces!');
  armAssist();
}
function layoutPieces(){
  const homes = tray.querySelectorAll('.slotHome');
  pieces.forEach((p,i)=>{
    if(!homes[i]) return;
    const r=homes[i].getBoundingClientRect();
    p.home={x:r.left+(r.width-140)/2, y:r.top+(r.height-140)/2};
    if(p.slot<0){ p.el.style.transition='none'; p.el.style.left=p.home.x+'px'; p.el.style.top=p.home.y+'px';
      requestAnimationFrame(()=>{ p.el.style.transition=''; }); }
  });
}
window.addEventListener('resize', ()=>setTimeout(layoutPieces,150));

/* ============================================================
   EVALUATE PAIR
   ============================================================ */
function evaluatePair(){
  if(!slots[0] || !slots[1]) return;
  locked=true; clearAssist();
  if(slots[0].ok && slots[1].ok) doSuccess(); else doFail();
}

function doFail(){
  sHmm();
  say('Almost! Try another. 🤔');
  buddy.classList.add('scratch');
  slots.forEach(p=>{ if(p) p.el.classList.add('wobble'); });
  setTimeout(()=>{
    slots.forEach(p=>{ if(p){ p.el.classList.remove('wobble'); flyHome(p); } });
    buddy.classList.remove('scratch');
    wrongTries++;
    locked=false;
    armAssist();
  }, 750);
}

function doSuccess(){
  const L=LEVELS[cur];
  const c=circleCenter();
  sGliss();
  pieces.forEach(p=>p.el.classList.remove('hint'));
  // pieces spiral into the middle and vanish
  slots.forEach(p=>{
    p.el.classList.add('merging');
    p.el.style.left=(c.x-70)+'px'; p.el.style.top=(c.y-70)+'px';
  });
  setTimeout(()=>{
    slots.forEach(p=>{ p.el.remove(); });
    sparkleBurst(c.x, c.y, 16);
    mergeObj.textContent=L.result;
    mergeObj.style.transition='none';
    mergeObj.style.left=c.x+'px'; mergeObj.style.top=c.y+'px';
    mergeObj.style.display='block';
    mergeObj.classList.remove('pop'); void mergeObj.offsetWidth; mergeObj.classList.add('pop');
    objSfx(L.sfx);
    say(L.resultName);
  }, 500);
  if(cur===19){ setTimeout(finaleSeq, 1600); return; }   // L20: rocket launch!
  // fly the new object to where it is needed
  setTimeout(()=>{
    mergeObj.style.transition='';
    const t = targetPoint(L);
    mergeObj.style.left=t.x+'px'; mergeObj.style.top=t.y+'px';
  }, 1500);
  setTimeout(()=>{ deliverObject(L); }, 2200);
}

function targetPoint(L){
  const blockEm=$('blockEm'), goalEm=$('goalEm');
  const el = blockEm || goalEm;
  const r = el.getBoundingClientRect();
  return { x:r.left+r.width/2, y:r.top+r.height*0.15 };
}

function deliverObject(L){
  mergeObj.style.display='none';
  const t=targetPoint(L);
  sparkleBurst(t.x, t.y, 10);
  const sr=scene.getBoundingClientRect();
  placedObj.textContent=L.result;
  placedObj.style.left=(t.x-sr.left)+'px'; placedObj.style.top=(t.y-sr.top)+'px';
  const blockEm=$('blockEm');
  if(blockEm) blockEm.parentElement.classList.add('solved');
  const goalEm=$('goalEm');
  goalEm.textContent=L.happy;
  goalEm.parentElement.classList.add('cheer');
  buddy.classList.add('celebrate');
  objSfx(L.sfx);
  setTimeout(()=>{ crossObstacle(L); }, 800);
}

function crossObstacle(L){
  buddy.classList.remove('celebrate');
  buddy.classList.add('walk');
  buddy.style.left='72%';
  setTimeout(()=>{
    buddy.classList.remove('walk');
    buddy.classList.add('celebrate');
    completeLevel();
  }, 2000);
}

/* ============================================================
   LEVEL COMPLETE → stars + save + win overlay
   ============================================================ */
function completeLevel(){
  const earned = wrongTries===0 ? 3 : (wrongTries<=2 ? 2 : 1);
  save.stars[cur] = Math.max(save.stars[cur], earned);
  if(cur+1 < 20) save.unlocked = Math.max(save.unlocked, cur+2);
  persist();
  showWin(earned);
}
function showWin(earned){
  const winEl=$('win');
  $('winTitle').textContent = cur===19 ? 'ALL 20 DONE! 🏆' : 'You did it! 🎉';
  $('winWord').textContent = cur===19
    ? 'You are a SUPER hero, Web Buddy! 🚀'
    : (earned===3 ? 'First try! Amazing! 🌟' : earned===2 ? 'Great mixing! 💪' : 'You never gave up! 💖');
  const stars=$('winStars').children;
  for(let i=0;i<3;i++){ stars[i].classList.remove('won'); stars[i].style.animationDelay=''; }
  $('nextBtn').style.display = cur<19 ? 'block' : 'none';
  winEl.classList.add('show');
  for(let i=0;i<earned;i++){
    setTimeout(()=>{ stars[i].classList.add('won'); sTwinkle(); }, 350+i*450);
  }
  if(cur===19) sFanfare();
}
$('nextBtn').addEventListener('pointerdown', ()=>{
  $('win').classList.remove('show');
  if(cur+1<20) startLevel(cur+1); else showMap();
});
$('mapBtn').addEventListener('pointerdown', ()=>{
  $('win').classList.remove('show');
  showMap();
});
$('homeBtn').addEventListener('pointerdown', e=>{
  e.stopPropagation();
  if(locked) return;
  clearAssist();
  showMap();
});

/* ============================================================
   FINALE (Level 20) — rocket, fireworks, parade of 19 objects
   ============================================================ */
function finaleSeq(){
  say('TO THE STARS! 🚀');
  scene.style.background='linear-gradient(180deg,#0B1035,#2A2450 60%,#6B5B95)';
  mergeObj.classList.add('rocket');
  mergeObj.style.left='50vw'; mergeObj.style.top='-120px';
  sBoing();
  // fireworks
  for(let i=0;i<12;i++){
    setTimeout(()=>{
      const x=window.innerWidth*(0.15+Math.random()*0.7);
      const y=window.innerHeight*(0.1+Math.random()*0.4);
      sparkleBurst(x,y,14); sTwinkle();
    }, 600+i*420);
  }
  sFanfare(); setTimeout(sFanfare, 2600);
  confettiRain();
  // parade of all 19 previous hero objects
  setTimeout(()=>{
    parade.innerHTML = LEVELS.slice(0,19).map((l,i)=>
      '<span class="pd" style="animation-delay:'+(i*0.12)+'s">'+l.result+'</span>').join('');
    parade.classList.add('go');
    say('The hero parade! 🎉');
  }, 1800);
  setTimeout(()=>{ completeLevel(); }, 6500);
}
function confettiRain(){
  const colors=['#E53935','#1E5AE8','#FFC93C','#4CAF50','#FF6FA5','#6B5B95'];
  for(let i=0;i<60;i++){
    const d=document.createElement('div');
    d.className='conf';
    d.style.left=Math.random()*100+'vw';
    d.style.background=colors[i%colors.length];
    d.style.animationDuration=(2.2+Math.random()*2.5)+'s';
    d.style.animationDelay=(Math.random()*1.6)+'s';
    d.style.borderRadius=Math.random()>0.5?'50%':'3px';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 7000);
  }
}

/* ============================================================
   LEVEL MAP — vertical scrollable web path, storybook city
   ============================================================ */
const NODE_XS=[22,50,78,50];                     // zig-zag pattern (percent)
const NODE_GAP=170, NODE_TOP=110;
const DECOR=['🏠','🌳','🏫','☁️','🎪','⛲','🏰','🌲','🎡','🏪','☁️','🌷','🏛️','🎠','🌳','🏘️','☁️','🌻','🏯','🌟'];

function nodeXY(i){
  return { x:NODE_XS[i%4], y:NODE_TOP + i*NODE_GAP };
}
function buildMap(){
  const inner=$('mapInner');
  inner.innerHTML='';
  const H = NODE_TOP + 19*NODE_GAP + 160;
  inner.style.height=H+'px';
  const w = $('mapScroll').clientWidth || window.innerWidth;
  // web path connecting nodes
  let pts='';
  for(let i=0;i<20;i++){ const p=nodeXY(i); pts += (w*p.x/100)+','+p.y+' '; }
  inner.innerHTML =
    '<svg id="mapPath" viewBox="0 0 '+w+' '+H+'" preserveAspectRatio="none">'
    + '<polyline points="'+pts.trim()+'" fill="none" stroke="rgba(255,255,255,.85)"'
    + ' stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16"/></svg>';
  // storybook city decorations, opposite side of each node
  for(let i=0;i<20;i++){
    const p=nodeXY(i);
    const d=document.createElement('span');
    d.className='decor'; d.textContent=DECOR[i];
    d.style.left=(p.x<50 ? p.x+48 : p.x-48)+'%';
    d.style.top=(p.y+40)+'px';
    inner.appendChild(d);
  }
  // nodes
  for(let i=0;i<20;i++){
    const p=nodeXY(i);
    const n=document.createElement('button');
    n.className='node';
    n.style.left=p.x+'%'; n.style.top=p.y+'px';
    const st=save.stars[i], unlocked=(i < save.unlocked);
    if(st>0){
      n.classList.add('done');
      n.innerHTML='<span>'+LEVELS[i].result+'</span><span class="nStars">'+'⭐'.repeat(st)+'</span>';
      n.style.fontSize='30px';
    }else if(unlocked){
      n.classList.add('open');
      n.innerHTML='<span>'+(i+1)+'</span><span class="nStars">✨</span>';
    }else{
      n.classList.add('lock');
      n.innerHTML='<span>🕸️</span><span class="nStars">🔒</span>';
    }
    n.addEventListener('click', ()=>{
      if(i >= save.unlocked && save.stars[i]===0){
        n.classList.remove('wiggle'); void n.offsetWidth; n.classList.add('wiggle');
        toast('Locked! 🔒 Finish the level before!');
        sHmm();
        return;
      }
      sTwinkle();
      startLevel(i);
    });
    inner.appendChild(n);
  }
  // Web Buddy marker at next level to play
  const nxt=nextUnbeaten();
  const bp=nodeXY(nxt);
  const mb=document.createElement('div');
  mb.id='mapBuddy'; mb.innerHTML=buddySVG();
  mb.style.left=(bp.x + (bp.x<60?11:-11))+'%'; mb.style.top=(bp.y-6)+'px';
  inner.appendChild(mb);
}
function nextUnbeaten(){
  let t = save.stars.findIndex(s=>s===0);
  if(t<0) t=19;
  return Math.min(t, save.unlocked-1);
}
function showMap(){
  game.classList.remove('on');
  $('win').classList.remove('show');
  clearAssist();
  clearTimeout(evalTimer);            // a pending pair-check must not fire on the map
  slots=[null,null];
  buildMap();
  document.body.classList.add('mapOpen');
  $('map').classList.add('on');
  const sc=$('mapScroll');
  requestAnimationFrame(()=>{
    const y = nodeXY(nextUnbeaten()).y;
    sc.scrollTop = Math.max(0, y - sc.clientHeight/2);
  });
}
function startLevel(i){
  document.body.classList.remove('mapOpen');
  $('map').classList.remove('on');
  $('win').classList.remove('show');
  game.classList.add('on');
  buildPuzzle(i);
}
$('contBtn').addEventListener('pointerdown', ()=>{ sTwinkle(); startLevel(nextUnbeaten()); });

/* ============================================================
   START + iPad guards
   ============================================================ */
$('playBtn').addEventListener('pointerdown', ()=>{
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  sTwinkle();
  $('start').style.display='none';
  showMap();
});
document.addEventListener('pointerdown', ()=>{ if(AC && AC.state==='suspended') AC.resume(); }, true);
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{
  if(!(e.target.closest && e.target.closest('#mapScroll'))) e.preventDefault();
}, {passive:false});
</script>
