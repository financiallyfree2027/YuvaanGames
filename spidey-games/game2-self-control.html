<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spidey Says: Thwip! 🕷️ — 20 Level Adventure</title>
<style>
/* ============================================================
   SPIDEY SAYS: THWIP!  —  a red-light / green-light web game
   Teaches SELF-CONTROL to little heroes (age 4, iPad, touch)
   Now a 20-LEVEL adventure with a web-path level map!
   ============================================================ */
:root{
  --hero-red:#E53935;
  --hero-blue:#1E5AE8;
  --web-white:#FFFFFF;
  --sky-top:#87CEEB;
  --sky-bottom:#FFE9A8;
  --gold:#FFC93C;
  --green:#4CAF50;
}
*{ margin:0; padding:0; box-sizing:border-box;
   -webkit-user-select:none; user-select:none;
   -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
html,body{
  width:100%; height:100%; overflow:hidden;
  overscroll-behavior:none;
  font-family:'Comic Sans MS','Chalkboard SE','Marker Felt',sans-serif;
  background:linear-gradient(to bottom, var(--sky-top) 0%, #aadcf2 45%, var(--sky-bottom) 100%);
}
body{ touch-action:none; }
/* while the level map is open, let vertical pans reach #mapScroll */
body.mapOpen{ touch-action:pan-y; }
body.night{
  background:linear-gradient(to bottom, #0d1b45 0%, #263a6b 55%, #3c4a72 100%);
}
#stage{ position:fixed; inset:0; overflow:hidden; }

/* ---------- Park scenery (sun, clouds, hills, tree) ---------- */
#scenery{ position:absolute; inset:0; pointer-events:none; }
#scenery svg{ position:absolute; left:0; bottom:0; width:100%; height:100%; }
body.night #scenery svg{ filter:brightness(.5) saturate(.7); }
.cloud{ position:absolute; font-size:64px; opacity:.9; animation:cloudDrift 40s linear infinite; }
body.night .cloud{ opacity:.35; }
@keyframes cloudDrift{ from{ transform:translateX(-15vw);} to{ transform:translateX(115vw);} }
#nightStars{ position:absolute; inset:0; pointer-events:none; display:none; }
body.night #nightStars{ display:block; }
#nightStars span{ position:absolute; font-size:22px; animation:twinkle 2.2s ease-in-out infinite alternate; }
#nightStars span:nth-child(2n){ animation-delay:.7s; font-size:16px; }
#nightStars span:nth-child(3n){ animation-delay:1.3s; }
@keyframes twinkle{ from{ opacity:.25; transform:scale(.8);} to{ opacity:1; transform:scale(1.15);} }
#moon{ position:absolute; top:6%; left:6%; font-size:72px; display:none; pointer-events:none; }
body.night #moon{ display:block; }

/* ---------- Traffic-signal panel (top centre) ---------- */
#signal{
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  z-index:40; display:flex; align-items:center; gap:16px;
  background:#fffdf5; border:6px solid #33475b; border-radius:32px;
  padding:12px 26px; min-height:120px;
  box-shadow:0 8px 0 rgba(0,0,0,.15);
  transition:box-shadow .5s ease, border-color .5s ease;
  pointer-events:none; max-width:92vw;
}
#sigLight{
  width:78px; height:78px; border-radius:50%; flex:0 0 auto;
  background:#bbb; transition:background .5s ease, box-shadow .5s ease;
}
#signal.go #sigLight{ background:var(--green); box-shadow:0 0 34px 12px rgba(76,175,80,.75); }
#signal.wait #sigLight{ background:var(--hero-red); box-shadow:0 0 34px 12px rgba(229,57,53,.75); }
#signal.warn #sigLight{ animation:warnPulse .5s ease-in-out infinite alternate; }
@keyframes warnPulse{
  from{ background:var(--gold); box-shadow:0 0 40px 16px rgba(255,201,60,.9); }
  to  { background:#ffe58a;    box-shadow:0 0 18px 6px  rgba(255,201,60,.5); }
}
#sigFace{ width:84px; height:84px; flex:0 0 auto; }
#sigText{ font-size:34px; font-weight:bold; color:#33475b; white-space:nowrap; }
#signal.go #sigText{ color:#2e7d32; }
#signal.wait #sigText{ color:#c62828; }

/* ---------- Mute button (top-left, giant) ---------- */
#muteBtn{
  position:absolute; top:14px; left:14px; z-index:95;
  width:96px; height:96px; border-radius:28px; border:5px solid #33475b;
  background:#fffdf5; font-size:48px; line-height:1;
  box-shadow:0 6px 0 rgba(0,0,0,.15); cursor:pointer;
  font-family:inherit;
}
#muteBtn:active{ transform:scale(.92); }

/* ---------- HUD (top-right): level, kittens, live stars ---------- */
#hud{
  position:absolute; top:14px; right:14px; z-index:40;
  display:flex; align-items:center; gap:14px;
  background:rgba(255,253,245,.92);
  border:5px solid #33475b; border-radius:24px; padding:10px 18px;
  pointer-events:none; font-weight:bold; color:#33475b;
}
#hudLevel{ font-size:30px; background:var(--hero-blue); color:#fff;
           border-radius:16px; padding:4px 14px; }
#hudCats{ font-size:34px; white-space:nowrap; }
#hudStars{ font-size:30px; letter-spacing:2px; white-space:nowrap; }
#hudStars .dim{ filter:grayscale(1) opacity(.3); }

/* ---------- Balloons ---------- */
.balloon{
  position:absolute; left:0; top:0; width:150px; height:236px;
  z-index:10; will-change:transform; cursor:pointer;
}
.balloon .bob{
  width:100%; height:100%;
  animation:bob 2.6s ease-in-out infinite alternate;
  transition:transform .18s ease, opacity .18s ease;
}
.balloon:nth-child(odd) .bob{ animation-duration:3.1s; }
@keyframes bob{ from{ transform:translateX(-7px) rotate(-3deg);} to{ transform:translateX(7px) rotate(3deg);} }
.balloon.popped .bob{ transform:scale(1.35); opacity:0; }
.balloon.enter{ animation:balloonIn .6s ease-out; }
@keyframes balloonIn{ from{ opacity:0; transform:scale(.5);} to{ opacity:1; transform:scale(1);} }
.balloon.nope .bob{ animation:nopeShake .5s ease-in-out; }
@keyframes nopeShake{
  0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-9deg);}
  50%{ transform:rotate(9deg);} 75%{ transform:rotate(-6deg);}
}
.balloon .bcat{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  font-size:46px; line-height:1;
}
body.night .balloon{ filter:drop-shadow(0 0 16px rgba(255,250,190,.85)); }

/* ---------- Web layer (lines + splats) ---------- */
#webLayer{ position:absolute; inset:0; width:100%; height:100%; z-index:20; pointer-events:none; }

/* ---------- Parachuting kittens ---------- */
.chute{ position:absolute; left:0; top:0; width:110px; height:130px; z-index:15;
        will-change:transform; pointer-events:none; }
.chute .pcat{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); font-size:46px; }

/* ---------- Saved kittens on the grass ---------- */
.savedCat{ position:absolute; z-index:14; font-size:48px; pointer-events:none;
           animation:landBounce .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes landBounce{ 0%{transform:translateY(-30px) scale(.6);} 60%{transform:translateY(4px) scale(1.1);} 100%{transform:translateY(0) scale(1);} }
.savedCat.dance{ animation:catDance .5s ease-in-out infinite alternate; }
@keyframes catDance{ from{ transform:translateY(0) rotate(-10deg);} to{ transform:translateY(-22px) rotate(10deg);} }

/* ---------- Web Buddy (bottom centre) ---------- */
#buddy{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
        width:150px; height:170px; z-index:16; pointer-events:none; }
#buddy svg{ width:100%; height:100%; overflow:visible; animation:idleBounce 1.2s ease-in-out infinite alternate; }
@keyframes idleBounce{ from{ transform:translateY(0);} to{ transform:translateY(6px);} }
#buddy .arm{ transform-box:fill-box; transform-origin:50% 12%; transition:transform .35s ease; }
#buddy.handsUp #armL{ transform:rotate(150deg); }
#buddy.handsUp #armR{ transform:rotate(-150deg); }
#buddy.shoot #armR{ transform:rotate(-165deg); transition:transform .1s ease; }
#buddy.wag #armR{ animation:wagWag .7s ease-in-out; }
@keyframes wagWag{
  0%{transform:rotate(-150deg);} 25%{transform:rotate(-120deg);}
  50%{transform:rotate(-165deg);} 75%{transform:rotate(-120deg);}
  100%{transform:rotate(-150deg);}
}

/* ---------- Sliding banner messages ---------- */
#banner{
  position:absolute; top:150px; left:50%; transform:translate(-50%,-260%);
  z-index:50; background:var(--web-white); border:6px solid var(--gold);
  border-radius:26px; padding:14px 34px; font-size:38px; font-weight:bold;
  color:#33475b; box-shadow:0 8px 0 rgba(0,0,0,.15); white-space:nowrap;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1); pointer-events:none;
  max-width:94vw; overflow:hidden; text-overflow:ellipsis;
}
#banner.show{ transform:translate(-50%,0); }

/* ---------- Sparkles for great waiting + fireworks ---------- */
.spark{ position:absolute; z-index:45; font-size:40px; pointer-events:none;
        animation:sparkFly 1s ease-out forwards; }
@keyframes sparkFly{
  0%{ transform:translate(0,0) scale(.4); opacity:1; }
  100%{ transform:translate(var(--dx),var(--dy)) scale(1.3); opacity:0; }
}
.fw{ position:absolute; z-index:8; font-size:30px; pointer-events:none;
     animation:fwFly 1.2s ease-out forwards; }
@keyframes fwFly{
  0%{ transform:translate(0,0) scale(.3); opacity:1; }
  70%{ opacity:1; }
  100%{ transform:translate(var(--dx),var(--dy)) scale(1.4); opacity:0; }
}

/* ---------- Confetti ---------- */
#confetti{ position:absolute; inset:0; z-index:70; pointer-events:none; overflow:hidden; }
.confet{ position:absolute; top:-24px; width:14px; height:22px; border-radius:3px;
         animation:confFall linear forwards; }
@keyframes confFall{
  0%{ transform:translateY(-4vh) rotate(0deg); opacity:1; }
  100%{ transform:translateY(110vh) rotate(720deg); opacity:.85; }
}

/* ---------- Screens (start / map / win) ---------- */
.screen{
  position:absolute; inset:0; z-index:80; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; text-align:center;
  background:linear-gradient(to bottom, rgba(135,206,235,.97), rgba(255,233,168,.97));
  padding:20px;
}
.screen h1{ font-size:clamp(38px,6.4vw,62px); color:var(--hero-red);
            text-shadow:3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,.12); }
.screen p{ font-size:clamp(26px,3.4vw,36px); color:#33475b; }
#playBtn{
  width:200px; height:200px; border-radius:50%;
  border:10px solid #fff; background:var(--green);
  font-size:92px; color:#fff; cursor:pointer;
  box-shadow:0 12px 0 rgba(0,0,0,.18), 0 0 0 12px rgba(76,175,80,.35);
  animation:playPulse 1.2s ease-in-out infinite alternate; font-family:inherit;
}
@keyframes playPulse{ from{ transform:scale(1);} to{ transform:scale(1.08);} }
#playBtn:active{ transform:scale(.94); }
.bigBtn{
  border:8px solid #fff; background:var(--hero-blue); color:#fff;
  font-size:38px; padding:18px 42px; border-radius:32px; cursor:pointer;
  box-shadow:0 10px 0 rgba(0,0,0,.18); font-family:inherit; font-weight:bold;
}
.bigBtn:active{ transform:scale(.94); }
.bigBtn.greenBtn{ background:var(--green); }
.hidden{ display:none !important; }

/* ---------- Level map screen ---------- */
#mapScreen{ justify-content:flex-start; gap:0; padding:0;
  background:linear-gradient(to bottom, #6EC6F0 0%, #9fd9f2 30%, #cfeaa9 75%, #8FD07B 100%); }
#mapHeader{
  width:100%; z-index:5; display:flex; align-items:center; justify-content:center;
  gap:18px; padding:16px 12px 12px; flex:0 0 auto;
  background:rgba(255,253,245,.94); border-bottom:6px solid #33475b;
}
#mapHeader h2{ font-size:clamp(28px,4.6vw,44px); color:var(--hero-red);
  text-shadow:2px 2px 0 #fff; white-space:nowrap; }
#continueBtn{ font-size:30px; padding:12px 26px; }
#mapScroll{
  flex:1 1 auto; width:100%; overflow-y:auto; overflow-x:hidden;
  touch-action:pan-y; -webkit-overflow-scrolling:touch;
}
#mapTrack{ position:relative; width:100%; }
#mapPathSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.mapNode{
  position:absolute; width:96px; height:96px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:6px solid #33475b; cursor:pointer; z-index:3;
  font-weight:bold; box-shadow:0 6px 0 rgba(0,0,0,.18);
}
.mapNode .num{ font-size:36px; line-height:1; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.25); }
.mapNode .sub{ font-size:20px; line-height:1.1; }
.mapNode.done{ background:var(--gold); }
.mapNode.done .num{ color:#7a4d00; text-shadow:none; }
.mapNode.open{ background:var(--green); animation:nodePulse 1.1s ease-in-out infinite alternate; }
@keyframes nodePulse{
  from{ transform:scale(1);   box-shadow:0 6px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(76,175,80,.5); }
  to  { transform:scale(1.1); box-shadow:0 6px 0 rgba(0,0,0,.18), 0 0 0 14px rgba(76,175,80,.25); }
}
.mapNode.locked{ background:#b9c0c9; cursor:default; }
.mapNode.locked .num{ font-size:20px; color:#5c6670; text-shadow:none; }
.mapNode.locked .sub{ font-size:30px; }
.mapNode.wiggle{ animation:lockWiggle .5s ease-in-out; }
@keyframes lockWiggle{
  0%,100%{ transform:rotate(0);} 20%{ transform:rotate(-10deg);}
  40%{ transform:rotate(10deg);} 60%{ transform:rotate(-7deg);} 80%{ transform:rotate(7deg);}
}
.nodeStars{ position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
  font-size:22px; white-space:nowrap; text-shadow:0 2px 0 rgba(0,0,0,.2); pointer-events:none; }
.nodeTag{ position:absolute; top:-34px; left:50%; transform:translateX(-50%);
  font-size:26px; pointer-events:none; }
#mapToast{
  position:absolute; left:50%; bottom:26px; transform:translate(-50%,200%);
  z-index:9; background:#fffdf5; border:5px solid var(--hero-red); border-radius:22px;
  padding:12px 28px; font-size:30px; font-weight:bold; color:#c62828;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1); pointer-events:none; white-space:nowrap;
}
#mapToast.show{ transform:translate(-50%,0); }

/* ---------- Win overlay ---------- */
#winOverlay{ background:rgba(255,249,219,.95); z-index:85; }
#winStars{ font-size:80px; letter-spacing:10px; min-height:96px; }
#winStars span{ display:inline-block; opacity:0; transform:scale(0); }
#winStars span.pop{ opacity:1; transform:scale(1); animation:starPop .55s cubic-bezier(.34,1.56,.64,1); }
#winStars span.dud{ opacity:.25; transform:scale(.8); filter:grayscale(1); }
@keyframes starPop{ 0%{transform:scale(0);} 60%{transform:scale(1.35);} 100%{transform:scale(1);} }
#winCats{ font-size:58px; letter-spacing:5px; }
#winCats span{ display:inline-block; animation:catDance .45s ease-in-out infinite alternate; }
#winCats span:nth-child(2n){ animation-delay:.2s; }
#winCats span:nth-child(3n){ animation-delay:.35s; }
#nextBtn{ font-size:46px; padding:22px 54px; }
#medal{ font-size:110px; display:none; animation:medalPop 1s cubic-bezier(.34,1.56,.64,1); }
@keyframes medalPop{ 0%{ transform:scale(0) rotate(-360deg);} 70%{ transform:scale(1.3);} 100%{ transform:scale(1) rotate(0);} }
#paradeWrap{ display:none; width:100%; overflow:hidden; }
#paradeRow{ font-size:54px; white-space:nowrap; animation:paradeMove 7s linear infinite; }
@keyframes paradeMove{ from{ transform:translateX(100vw);} to{ transform:translateX(-100%);} }
</style>
</head>
<body oncontextmenu="return false">
<div id="stage">

  <!-- ======== Scenery: sun, clouds, hills, tree ======== -->
  <div id="scenery">
    <div class="cloud" style="top:16%; animation-delay:-8s;">☁️</div>
    <div class="cloud" style="top:28%; animation-delay:-24s; font-size:48px;">☁️</div>
    <div id="moon">🌙</div>
    <div id="nightStars"></div>
    <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <!-- sun -->
      <circle cx="80" cy="80" r="52" fill="#FFC93C" opacity="0.95"/>
      <circle cx="80" cy="80" r="70" fill="#FFC93C" opacity="0.25"/>
      <!-- rolling hills -->
      <path d="M0 470 Q 250 380 500 460 T 1000 440 L1000 600 L0 600 Z" fill="#7BC96F"/>
      <path d="M0 520 Q 300 440 600 515 T 1000 505 L1000 600 L0 600 Z" fill="#5DB761"/>
      <!-- one big friendly tree -->
      <rect x="800" y="380" width="34" height="120" rx="14" fill="#8B5A2B"/>
      <circle cx="817" cy="330" r="82" fill="#4CAF50"/>
      <circle cx="762" cy="368" r="52" fill="#5DBB63"/>
      <circle cx="874" cy="366" r="52" fill="#5DBB63"/>
      <circle cx="790" cy="300" r="16" fill="#E53935"/>
      <circle cx="850" cy="330" r="14" fill="#E53935"/>
      <!-- little flowers -->
      <text x="140" y="560" font-size="34">🌼</text>
      <text x="330" y="585" font-size="34">🌷</text>
      <text x="600" y="570" font-size="34">🌼</text>
      <text x="930" y="580" font-size="34">🌸</text>
    </svg>
  </div>

  <!-- ======== Traffic-signal panel with Web Buddy's face ======== -->
  <div id="signal" class="go">
    <div id="sigLight"></div>
    <svg id="sigFace" viewBox="0 0 100 100" aria-hidden="true">
      <defs><clipPath id="faceClip"><circle cx="50" cy="50" r="44"/></clipPath></defs>
      <circle cx="50" cy="50" r="44" fill="#E53935" stroke="#B71C1C" stroke-width="3"/>
      <g clip-path="url(#faceClip)" stroke="#FFF" stroke-width="2" opacity="0.4" fill="none">
        <circle cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="28"/><circle cx="50" cy="50" r="41"/>
        <line x1="50" y1="4" x2="50" y2="96"/><line x1="4" y1="50" x2="96" y2="50"/>
        <line x1="18" y1="18" x2="82" y2="82"/><line x1="82" y1="18" x2="18" y2="82"/>
      </g>
      <ellipse cx="33" cy="52" rx="15" ry="20" fill="#FFF" stroke="#000" stroke-width="3" transform="rotate(-8 33 52)"/>
      <ellipse cx="67" cy="52" rx="15" ry="20" fill="#FFF" stroke="#000" stroke-width="3" transform="rotate(8 67 52)"/>
    </svg>
    <div id="sigText">Web Buddy says THWIP! 🟢</div>
  </div>

  <!-- ======== Mute + HUD ======== -->
  <button id="muteBtn" aria-label="sound">🔊</button>
  <div id="hud">
    <span id="hudLevel">L1</span>
    <span id="hudCats">🐱 0/2</span>
    <span id="hudStars"><span>⭐</span><span>⭐</span><span>⭐</span></span>
  </div>

  <!-- ======== Play field layers ======== -->
  <div id="balloonLayer"></div>
  <svg id="webLayer"></svg>
  <div id="kittenLayer"></div>

  <!-- ======== Web Buddy character (chibi spidey) ======== -->
  <div id="buddy">
    <svg viewBox="0 0 200 220" aria-hidden="true">
      <defs><clipPath id="headClip"><circle cx="100" cy="60" r="48"/></clipPath></defs>
      <!-- legs: red capsules with mitten stubs -->
      <rect x="76" y="156" width="20" height="48" rx="10" fill="#E53935"/>
      <rect x="104" y="156" width="20" height="48" rx="10" fill="#E53935"/>
      <circle cx="86" cy="206" r="11" fill="#E53935"/>
      <circle cx="114" cy="206" r="11" fill="#E53935"/>
      <!-- torso: blue rounded -->
      <rect x="68" y="102" width="64" height="64" rx="26" fill="#1E5AE8"/>
      <!-- arms: red capsules (rotatable groups) -->
      <g id="armL" class="arm">
        <rect x="56" y="108" width="20" height="52" rx="10" fill="#E53935"/>
        <circle cx="66" cy="160" r="11" fill="#E53935"/>
      </g>
      <g id="armR" class="arm">
        <rect x="124" y="108" width="20" height="52" rx="10" fill="#E53935"/>
        <circle cx="134" cy="160" r="11" fill="#E53935"/>
      </g>
      <!-- head: red circle, web arcs, radial lines, big friendly eyes -->
      <circle cx="100" cy="60" r="48" fill="#E53935" stroke="#B71C1C" stroke-width="3"/>
      <g clip-path="url(#headClip)" stroke="#FFF" stroke-width="2" opacity="0.4" fill="none">
        <circle cx="100" cy="60" r="16"/><circle cx="100" cy="60" r="30"/><circle cx="100" cy="60" r="44"/>
        <line x1="100" y1="10" x2="100" y2="110"/><line x1="50" y1="60" x2="150" y2="60"/>
        <line x1="66" y1="26" x2="134" y2="94"/><line x1="134" y1="26" x2="66" y2="94"/>
      </g>
      <ellipse cx="81" cy="62" rx="17" ry="23" fill="#FFF" stroke="#000" stroke-width="3" transform="rotate(-8 81 62)"/>
      <ellipse cx="119" cy="62" rx="17" ry="23" fill="#FFF" stroke="#000" stroke-width="3" transform="rotate(8 119 62)"/>
    </svg>
  </div>

  <!-- ======== Banner / Confetti ======== -->
  <div id="banner">Hi hero! 👋</div>
  <div id="confetti"></div>

  <!-- ======== Start screen ======== -->
  <div id="startScreen" class="screen">
    <h1>🕷️ Spidey Says: Thwip! 🕸️</h1>
    <p>20 levels of kitten rescue! 🐱🎈</p>
    <p>Tap balloons on <b style="color:#2e7d32">GREEN</b> 🟢 &nbsp;•&nbsp; <b style="color:#c62828">WAIT</b> on red 🔴✋</p>
    <button id="playBtn" aria-label="play">▶</button>
    <p style="font-size:26px;">Tap the big green button to start!</p>
  </div>

  <!-- ======== Level map screen ======== -->
  <div id="mapScreen" class="screen hidden">
    <div id="mapHeader">
      <h2>🕸️ Web Path 🗺️</h2>
      <button id="continueBtn" class="bigBtn greenBtn">Continue ▶</button>
    </div>
    <div id="mapScroll"><div id="mapTrack">
      <svg id="mapPathSvg" preserveAspectRatio="none"></svg>
    </div></div>
    <div id="mapToast">Finish level 1 first! 🔒</div>
  </div>

  <!-- ======== Win overlay ======== -->
  <div id="winOverlay" class="screen hidden">
    <h1 id="winTitle">Level done! 🎉</h1>
    <div id="medal">🏅</div>
    <div id="winStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div id="winCats"></div>
    <p id="winMsg">Amazing waiting, little hero! 🌟✋</p>
    <div id="paradeWrap"><div id="paradeRow"></div></div>
    <button id="nextBtn" class="bigBtn greenBtn">Next Level ▶</button>
    <button id="mapBtn" class="bigBtn">Map 🗺️</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==================== helpers & DOM ==================== */
var $ = function(id){ return document.getElementById(id); };
var stage = $('stage'), signal = $('signal'), sigText = $('sigText');
var balloonLayer = $('balloonLayer'), webLayer = $('webLayer'), kittenLayer = $('kittenLayer');
var buddy = $('buddy'), bannerEl = $('banner'), confettiEl = $('confetti');
var W = window.innerWidth, H = window.innerHeight;
window.addEventListener('resize', function(){ W = window.innerWidth; H = window.innerHeight; });
function rand(a,b){ return a + Math.random()*(b-a); }
var SVGNS = 'http://www.w3.org/2000/svg';

/* ==================== LEVEL LADDER (20 levels) ====================
   k     = kittens to rescue
   go    = GO seconds
   w     = WAIT range seconds [min,max]
   rise  = balloon rise speed in screen-heights per second
   groups= simultaneous balloon groups
   gsize = balloons per group (1 single, 2 pair, 3 trio, 0 = mixed)
   warn  = yellow warning seconds before signal change
   plus twist flags per level. */
var LEVELS = [
  {k:2,  go:6.0, w:[1.5,2], rise:0.05, groups:1, gsize:1, warn:1.5, firstGo:10},          // L1 GO stays green almost whole level
  {k:3,  go:5.0, w:[2,3],   rise:0.05, groups:1, gsize:1, warn:1.5},                       // L2
  {k:3,  go:5.0, w:[2,3],   rise:0.06, groups:1, gsize:1, warn:1.5},                       // L3
  {k:4,  go:4.5, w:[2,4],   rise:0.06, groups:2, gsize:1, warn:1.5},                       // L4
  {k:4,  go:4.0, w:[3,4],   rise:0.07, groups:2, gsize:1, warn:1.5, longWait:true},        // L5 first LONG WAIT (5s)
  {k:5,  go:4.0, w:[3,5],   rise:0.07, groups:2, gsize:1, warn:1.5},                       // L6
  {k:5,  go:3.5, w:[3,5],   rise:0.08, groups:2, gsize:1, warn:1.5},                       // L7
  {k:5,  go:3.5, w:[3,5],   rise:0.08, groups:2, gsize:1, warn:1.5, drift:0.08},           // L8 sideways drift
  {k:6,  go:3.5, w:[4,6],   rise:0.08, groups:3, gsize:1, warn:1.5},                       // L9
  {k:6,  go:3.0, w:[4,6],   rise:0.09, groups:3, gsize:1, warn:1.5, party:true},           // L10 halfway confetti party
  {k:6,  go:3.0, w:[4,6],   rise:0.09, groups:3, gsize:1, warn:1.5, drift:0.10},           // L11
  {k:7,  go:3.0, w:[4,7],   rise:0.09, groups:3, gsize:1, warn:1.0},                       // L12 warning 1.5s -> 1.0s
  {k:7,  go:2.8, w:[4,7],   rise:0.10, groups:3, gsize:1, warn:1.0},                       // L13
  {k:7,  go:2.8, w:[5,7],   rise:0.10, groups:3, gsize:1, warn:1.0, fakeout:true},         // L14 fake-out flicker
  {k:8,  go:2.5, w:[5,8],   rise:0.10, groups:3, gsize:1, warn:0.8},                       // L15 warning 0.8s
  {k:8,  go:2.5, w:[5,8],   rise:0.10, groups:2, gsize:2, warn:0.8, kittenOnly:true},      // L16 pairs, pumpkin rule
  {k:8,  go:2.5, w:[5,8],   rise:0.11, groups:2, gsize:2, warn:0.8, kittenOnly:true, drift:0.10}, // L17
  {k:9,  go:2.2, w:[6,9],   rise:0.11, groups:2, gsize:2, warn:0.8, kittenOnly:true, night:true}, // L18 night sky
  {k:9,  go:2.2, w:[6,9],   rise:0.12, groups:2, gsize:3, warn:0.8, kittenOnly:true},      // L19 trios
  {k:10, go:2.5, w:[3,9],   rise:0.10, groups:3, gsize:0, warn:1.0, kittenOnly:true, drift:0.08, fakeout:true, finale:true} // L20 FINALE
];

/* ==================== PERSISTENCE ==================== */
var SAVE_KEY = 'yuvaan_signal';
var save = loadSave();
function loadSave(){
  var d = { unlocked:1, stars:[] };
  for(var i=0;i<20;i++) d.stars.push(0);
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && typeof p.unlocked === 'number') d.unlocked = Math.max(1, Math.min(20, p.unlocked));
      if(p && Object.prototype.toString.call(p.stars) === '[object Array]'){
        for(var j=0;j<20;j++){
          var s = Number(p.stars[j]);
          if(s >= 0 && s <= 3) d.stars[j] = Math.floor(s);
        }
      }
    }
  }catch(e){ /* private mode etc — in-memory fallback */ }
  return d;
}
function saveSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  catch(e){ /* keep playing with in-memory save */ }
}

/* ==================== game state ==================== */
var S = {
  running:false, won:false,
  levelIdx:0, cfg:LEVELS[0],
  phase:'go',            // 'go' | 'wait'
  phaseEnd:0, warnMs:1500, warned:false,
  firstGoDone:false,
  tappedThisWait:false, isFakeout:false, isLongWait:false,
  fakeoutDone:false, fakeoutAt:0,
  longWaitDone:false, partyDone:false,
  rescued:0,
  redTaps:0,             // total red-light taps this level (stars)
  redStreak:0,           // consecutive WAITs with a tap (rubber-band)
  waitScale:1, warnBonus:0,
  cleanWaits:0,
  balloons:[], chutes:[], savedCats:[],
  lastSpawn:0, lastFirework:0
};

/* ==================== AUDIO (Web Audio only) ==================== */
var AC=null, master=null, musicGain=null, musicFilter=null, muted=false;
var seqTimer=null, nextNoteTime=0, step=0;
var EIGHTH = 60/110/2; // ~110 BPM eighth-notes
// C-major pentatonic melody pattern (0 = rest)
var MELODY = [523.25,0,659.25,0, 783.99,0,880.00,783.99, 659.25,0,587.33,659.25, 523.25,0,783.99,0];
var BASS   = [130.81,196.00,164.81,196.00]; // per half-bar, triangle

function initAudio(){
  if(AC) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 1; master.connect(AC.destination);
  musicFilter = AC.createBiquadFilter(); musicFilter.type='lowpass'; musicFilter.frequency.value=5000;
  musicGain = AC.createGain(); musicGain.gain.value = 0.15;
  musicGain.connect(musicFilter); musicFilter.connect(master);
  nextNoteTime = AC.currentTime + 0.1; step = 0;
  seqTimer = setInterval(scheduleMusic, 60);
}
function tone(freq, when, dur, type, gain, dest){
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(gain, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(dest || master);
  o.start(when); o.stop(when + dur + 0.05);
}
function scheduleMusic(){
  if(!AC) return;
  while(nextNoteTime < AC.currentTime + 0.18){
    var m = MELODY[step % 16];
    if(m) tone(m, nextNoteTime, EIGHTH*0.9, 'square', 0.22, musicGain);
    if(step % 4 === 0){
      var b = BASS[(step/4) % 4];
      tone(b, nextNoteTime, EIGHTH*3.5, 'triangle', 0.35, musicGain);
    }
    nextNoteTime += EIGHTH; step++;
  }
}
// Musical stillness cue: music goes soft & muffled on WAIT, bright on GO
function musicMood(mode){
  if(!AC) return;
  var t = AC.currentTime;
  if(mode === 'wait'){
    musicFilter.frequency.cancelScheduledValues(t);
    musicFilter.frequency.linearRampToValueAtTime(420, t + 0.5);
    musicGain.gain.linearRampToValueAtTime(0.06, t + 0.5);
  } else {
    musicFilter.frequency.cancelScheduledValues(t);
    musicFilter.frequency.linearRampToValueAtTime(5200, t + 0.4);
    musicGain.gain.linearRampToValueAtTime(0.15, t + 0.4);
  }
}
function sfxThwip(){ // white-noise burst through sweeping bandpass
  if(!AC) return;
  var dur = 0.18, buf = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  var src = AC.createBufferSource(); src.buffer = buf;
  var f = AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
  var t = AC.currentTime;
  f.frequency.setValueAtTime(3200, t);
  f.frequency.exponentialRampToValueAtTime(700, t+dur);
  var g = AC.createGain(); g.gain.value = 0.5;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
}
function sfxPop(){ if(!AC) return; var t=AC.currentTime;
  tone(300, t, 0.1, 'square', 0.25); tone(150, t+0.04, 0.12, 'sine', 0.3); }
function sfxMeow(){ // two quick cute sine chirps ~800→1200 Hz
  if(!AC) return; var t = AC.currentTime;
  [0, 0.22].forEach(function(off){
    var o = AC.createOscillator(), g = AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(800, t+off);
    o.frequency.linearRampToValueAtTime(1200, t+off+0.09);
    o.frequency.linearRampToValueAtTime(900, t+off+0.16);
    g.gain.setValueAtTime(0.0001, t+off);
    g.gain.linearRampToValueAtTime(0.3, t+off+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+off+0.18);
    o.connect(g); g.connect(master); o.start(t+off); o.stop(t+off+0.2);
  });
}
function sfxChime(){ // twinkly chime for great waiting
  if(!AC) return; var t = AC.currentTime;
  [1046.5, 1318.5, 1568, 2093].forEach(function(f,i){
    tone(f, t + i*0.09, 0.35, 'sine', 0.22);
  });
}
function sfxOops(){ // soft two-note descending
  if(!AC) return; var t = AC.currentTime;
  tone(440, t, 0.2, 'sine', 0.22); tone(330, t+0.18, 0.28, 'sine', 0.22);
}
function sfxBoing(){ // gentle pumpkin boing
  if(!AC) return; var t = AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(240, t);
  o.frequency.linearRampToValueAtTime(420, t+0.08);
  o.frequency.linearRampToValueAtTime(200, t+0.22);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.3, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.3);
}
function sfxFanfare(){
  if(!AC) return; var t = AC.currentTime;
  var seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
  seq.forEach(function(f,i){ tone(f, t + i*0.14, 0.3, 'square', 0.2);
                             tone(f/2, t + i*0.14, 0.3, 'triangle', 0.2); });
  tone(1568, t + seq.length*0.14, 0.7, 'sine', 0.25);
}
function sfxFirework(){
  if(!AC) return;
  var dur = 0.4, buf = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2);
  var src = AC.createBufferSource(); src.buffer = buf;
  var f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800;
  var g = AC.createGain(); g.gain.value = 0.25;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(AC.currentTime);
  tone(1568, AC.currentTime+0.05, 0.5, 'sine', 0.12);
}

/* ==================== mute toggle ==================== */
$('muteBtn').addEventListener('pointerdown', function(e){
  e.stopPropagation(); e.preventDefault();
  muted = !muted;
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  if(AC && master) master.gain.setValueAtTime(muted ? 0 : 1, AC.currentTime);
});

/* ==================== banner messages ==================== */
var bannerTimer = null;
function banner(msg, ms){
  bannerEl.textContent = msg;
  bannerEl.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function(){ bannerEl.classList.remove('show'); }, ms || 1700);
}

/* ==================== HUD ==================== */
function starsForTaps(taps){ return taps === 0 ? 3 : (taps <= 2 ? 2 : 1); }
function refreshHud(){
  $('hudLevel').textContent = 'L' + (S.levelIdx + 1);
  $('hudCats').textContent = '🐱 ' + Math.min(S.rescued, S.cfg.k) + '/' + S.cfg.k;
  var live = starsForTaps(S.redTaps);
  var slots = $('hudStars').children;
  for(var i=0;i<3;i++){
    if(i < live) slots[i].classList.remove('dim');
    else slots[i].classList.add('dim');
  }
}

/* ==================== traffic-signal phases ==================== */
function goDuration(){
  var cfg = S.cfg;
  if(cfg.firstGo && !S.firstGoDone){ S.firstGoDone = true; return cfg.firstGo * 1000; }
  return cfg.go * 1000;
}
function waitDuration(){
  var cfg = S.cfg, w;
  // L5 twist: one extra-long 5s wait mid-level, big praise for holding
  if(cfg.longWait && !S.longWaitDone && S.rescued >= Math.ceil(cfg.k/2)){
    S.longWaitDone = true; S.isLongWait = true;
    w = 5000;
  } else {
    S.isLongWait = false;
    w = rand(cfg.w[0], cfg.w[1]) * 1000;
  }
  // Rubber-band: after 2 tapped waits in a row, next wait 30% shorter
  if(S.waitScale < 1){ w *= S.waitScale; S.waitScale = 1; }
  return w;
}
function warnDuration(){
  return Math.min(2500, (S.cfg.warn || 1.5) * 1000 + S.warnBonus * 1000);
}
function setPhase(phase, now){
  S.phase = phase; S.warned = false; S.isFakeout = false;
  signal.classList.remove('go','wait','warn');
  S.warnMs = warnDuration();
  if(phase === 'go'){
    var g = goDuration();
    S.phaseEnd = now + g;
    signal.classList.add('go');
    sigText.textContent = 'Web Buddy says THWIP! 🟢';
    buddy.classList.remove('handsUp');
    musicMood('go');
    // L14/L20 twist: schedule one sneaky fake-out flicker during a GO
    if(S.cfg.fakeout && !S.fakeoutDone && S.rescued >= 2){
      S.fakeoutAt = now + Math.min(g * 0.5, 2200);
    } else S.fakeoutAt = 0;
  } else {
    S.phaseEnd = now + waitDuration();
    S.tappedThisWait = false;
    S.fakeoutAt = 0;
    signal.classList.add('wait');
    sigText.textContent = S.isLongWait ? 'Loooong wait! 🔴✋💪' : 'Waaait... 🔴✋';
    buddy.classList.add('handsUp');
    musicMood('wait');
    if(S.isLongWait) banner('Big hero wait! Hold on! ✋💪', 1800);
    ensureTemptingBalloon(); // a juicy balloon sits centre-screen during WAIT
  }
}
// L14 fake-out: signal flickers yellow then RED for a moment, then green again.
// Not tapping earns a bonus star sparkle!
function startFakeout(now){
  S.fakeoutDone = true; S.fakeoutAt = 0;
  S.phase = 'wait'; S.isFakeout = true;
  S.tappedThisWait = false; S.warned = true;
  S.phaseEnd = now + 1100;
  signal.classList.remove('go');
  signal.classList.add('warn');       // yellow flicker...
  setTimeout(function(){
    if(!S.isFakeout) return;
    signal.classList.remove('warn');
    signal.classList.add('wait');     // ...then red!
  }, 350);
  sigText.textContent = 'Waaait... 🔴✋';
  buddy.classList.add('handsUp');
  musicMood('wait');
}
function endOfWait(){
  // rubber-band bookkeeping + celebration
  if(S.tappedThisWait){
    S.redStreak++;
    if(S.redStreak >= 2){
      S.waitScale = 0.7;      // next WAIT 30% shorter
      S.warnBonus = 0.5;      // warning 0.5s longer
    }
  } else {
    S.redStreak = 0; S.warnBonus = 0;
    if(S.isFakeout){
      // didn't fall for the trick — bonus star sparkle!
      sfxChime();
      banner('You didn’t fall for it! 🌟✨', 1800);
      sparkleBurst(14);
    } else if(S.isLongWait){
      sfxChime(); sfxFanfare();
      banner('WOW! You waited SO long! 🏆✋', 2200);
      sparkleBurst(16);
      S.cleanWaits++;
    } else {
      celebrateCleanWait();
    }
  }
}
function updatePhase(now){
  if(S.won) return;
  if(S.phase === 'go' && S.fakeoutAt && now >= S.fakeoutAt){
    startFakeout(now);
    return;
  }
  if(now >= S.phaseEnd){
    if(S.phase === 'wait'){
      endOfWait();
      setPhase('go', now);
    } else {
      setPhase('wait', now);
    }
  } else if(!S.warned && !S.isFakeout && now >= S.phaseEnd - S.warnMs){
    S.warned = true;
    signal.classList.add('warn'); // yellow pulse = "change is coming"
  }
}

/* ==================== clean-wait celebration ==================== */
function sparkleBurst(n){
  var r = signal.getBoundingClientRect();
  for(var i=0;i<n;i++){
    var s = document.createElement('div');
    s.className = 'spark';
    s.textContent = (i%2) ? '✨' : '🌟';
    s.style.left = (r.left + r.width/2) + 'px';
    s.style.top  = (r.bottom) + 'px';
    s.style.setProperty('--dx', rand(-180,180) + 'px');
    s.style.setProperty('--dy', rand(20,160) + 'px');
    stage.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 1100); })(s);
  }
}
function celebrateCleanWait(){
  S.cleanWaits++;
  sfxChime();
  var msgs = ['Great waiting! 🌟','Super patience! ✋✨','What a calm hero! 🦸','You waited — amazing! 💛'];
  banner(msgs[S.cleanWaits % msgs.length]);
  sparkleBurst(8);
}

/* ==================== balloons ==================== */
var BALLOON_COLORS = ['#E53935', '#1E5AE8', '#FFC93C', '#4CAF50', '#AB47BC', '#FF8A65'];
function balloonSVG(color){
  return '<svg viewBox="0 0 150 236" width="150" height="236">' +
    '<ellipse cx="75" cy="72" rx="62" ry="70" fill="'+color+'" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>' +
    '<ellipse cx="52" cy="46" rx="16" ry="24" fill="#FFF" opacity="0.5"/>' +
    '<polygon points="66,140 84,140 75,156" fill="'+color+'"/>' +
    '<path d="M68 156 Q 62 172 70 188" stroke="#FFF" stroke-width="3" fill="none" stroke-dasharray="6 5"/>' +
    '<path d="M82 156 Q 88 172 80 188" stroke="#FFF" stroke-width="3" fill="none" stroke-dasharray="6 5"/>' +
    '</svg>';
}
function riseSpeed(){ return S.cfg.rise * H; } // screen-heights/sec → px/sec
function spawnBalloon(opts){
  opts = opts || {};
  var el = document.createElement('div');
  el.className = 'balloon enter';
  var color = BALLOON_COLORS[Math.floor(Math.random()*BALLOON_COLORS.length)];
  var passenger = opts.passenger || '🐱';
  el.innerHTML = '<div class="bob">' + balloonSVG(color) + '<div class="bcat">' + passenger + '</div></div>';
  var b = {
    el: el,
    x: (opts.x !== undefined) ? opts.x : rand(0.12, 0.88) * W - 75,
    y: (opts.y !== undefined) ? opts.y : H + 40,
    speed: (opts.speed !== undefined) ? opts.speed : riseSpeed() * rand(0.85, 1.15),
    passenger: passenger,
    driftPhase: rand(0, Math.PI*2),
    alive: true
  };
  b.baseX = b.x;
  el.addEventListener('pointerdown', function(e){
    e.stopPropagation(); e.preventDefault();
    onBalloonTap(b, e.clientX, e.clientY);
  });
  balloonLayer.appendChild(el);
  S.balloons.push(b);
  setTimeout(function(){ el.classList.remove('enter'); }, 700);
  return b;
}
// Spawn a group: single, pair, or trio. With kittenOnly rule, exactly ONE
// balloon carries the kitten — the others hold a smiling pumpkin 🎃.
function spawnGroup(){
  var cfg = S.cfg;
  var size = cfg.gsize;
  if(size === 0) size = 1 + Math.floor(Math.random()*3); // L20 mixed modes
  if(size === 1){
    spawnBalloon();
    return;
  }
  var spacing = 185;
  var span = (size - 1) * spacing;
  var minC = 0.05 * W + span/2 + 75, maxC = 0.95 * W - span/2 - 75;
  if(maxC < minC){ minC = W/2; maxC = W/2; }
  var cx = rand(minC, maxC);
  var y = H + 40 + rand(0, 60);
  var speed = riseSpeed() * rand(0.9, 1.1);
  var kittenAt = cfg.kittenOnly ? Math.floor(Math.random()*size) : -1;
  for(var i=0;i<size;i++){
    var passenger = (kittenAt === -1 || i === kittenAt) ? '🐱' : '🎃';
    spawnBalloon({ x: cx - span/2 + i*spacing - 75, y: y, speed: speed, passenger: passenger });
  }
}
// During WAIT a tempting balloon floats right in the middle of the screen
function ensureTemptingBalloon(){
  var mid = S.balloons.some(function(b){
    return b.alive && b.y > H*0.25 && b.y < H*0.6 && b.x > W*0.25 && b.x < W*0.65;
  });
  if(!mid) spawnBalloon({ x: W/2 - 75, y: H*0.42, speed: 8, passenger:'🐱' });
}
function removeBalloon(b){
  b.alive = false;
  var i = S.balloons.indexOf(b);
  if(i >= 0) S.balloons.splice(i,1);
  b.el.remove();
}
function countBalloons(){ return S.balloons.length; }

/* ==================== web shooting ==================== */
function buddyMouth(){ // where webs come from (Web Buddy's wrist-ish spot)
  var r = buddy.getBoundingClientRect();
  return { x: r.left + r.width*0.72, y: r.top + r.height*0.28 };
}
function starPoints(cx, cy, outer, inner){ // 8-point splat star
  var pts = [];
  for(var i=0;i<16;i++){
    var ang = (Math.PI/8)*i - Math.PI/2;
    var rad = (i%2===0) ? outer : inner;
    pts.push((cx + Math.cos(ang)*rad).toFixed(1) + ',' + (cy + Math.sin(ang)*rad).toFixed(1));
  }
  return pts.join(' ');
}
// Animated dashed web line; fizzle=true droops & fades halfway (WAIT taps)
function shootWeb(tx, ty, fizzle, onHit){
  var from = buddyMouth();
  var line = document.createElementNS(SVGNS, 'line');
  line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
  line.setAttribute('x2', from.x); line.setAttribute('y2', from.y);
  line.setAttribute('stroke', '#FFF'); line.setAttribute('stroke-width', '5');
  line.setAttribute('stroke-linecap', 'round'); line.setAttribute('stroke-dasharray', '10 8');
  webLayer.appendChild(line);
  var t0 = performance.now(), flyMs = fizzle ? 160 : 130;
  var maxP = fizzle ? 0.55 : 1;
  function fly(now){
    var p = Math.min(1, (now - t0)/flyMs) * maxP;
    var ex = from.x + (tx - from.x)*p, ey = from.y + (ty - from.y)*p;
    line.setAttribute('x2', ex); line.setAttribute('y2', ey);
    if((now - t0) < flyMs){ requestAnimationFrame(fly); return; }
    if(fizzle){ // droop sadly and dissolve — totally harmless
      var f0 = now;
      (function droop(n2){
        var q = Math.min(1, (n2 - f0)/350);
        line.setAttribute('y2', ey + q*70);
        line.setAttribute('opacity', String(1-q));
        if(q < 1) requestAnimationFrame(droop); else line.remove();
      })(now);
    } else {
      // splat! 8-point web star at the tip
      var splat = document.createElementNS(SVGNS, 'polygon');
      splat.setAttribute('points', starPoints(tx, ty, 34, 14));
      splat.setAttribute('fill', '#FFF'); splat.setAttribute('opacity', '0.95');
      webLayer.appendChild(splat);
      if(onHit) onHit();
      setTimeout(function(){ line.remove(); splat.remove(); }, 260);
    }
  }
  requestAnimationFrame(fly);
}

/* ==================== tap handling ==================== */
function onBalloonTap(b, px, py){
  if(!S.running || S.won || !b.alive) return;
  var cx = b.x + 75, cy = b.y + 72; // balloon centre
  if(S.phase === 'go'){
    if(b.passenger === '🎃'){
      // KITTEN-ONLY RULE: pumpkins are friendly, no penalty, just a giggle
      sfxBoing();
      b.el.classList.add('nope');
      setTimeout(function(){ b.el.classList.remove('nope'); }, 550);
      banner('Oops, that’s a pumpkin! 🎃😄', 1300);
      return;
    }
    b.alive = false; // lock so it can't be tapped twice
    buddy.classList.add('shoot');
    setTimeout(function(){ buddy.classList.remove('shoot'); }, 300);
    sfxThwip();
    shootWeb(cx, cy, false, function(){ popBalloon(b, cx, cy); });
  } else {
    fizzleTap(px || cx, py || cy);
  }
}
function fizzleTap(px, py){ // any tap during WAIT — gentle, no meanness
  if(!S.tappedThisWait){ S.redTaps++; refreshHud(); }
  S.tappedThisWait = true;
  sfxThwip(); sfxOops();
  shootWeb(px, py, true, null);
  buddy.classList.add('wag');
  setTimeout(function(){ buddy.classList.remove('wag'); }, 750);
  banner('Oops! Wait for green! 🙈', 1400);
}
// Taps on empty sky: only matter during WAIT (they fizzle)
stage.addEventListener('pointerdown', function(e){
  if(!S.running || S.won) return;
  if(S.phase === 'wait') fizzleTap(e.clientX, e.clientY);
});
// Block double-tap zoom / scroll / long-press (but allow map scrolling)
function inMapScroll(t){
  while(t && t !== document.body){
    if(t.id === 'mapScroll' || t.id === 'mapTrack') return true;
    if(t.classList && t.classList.contains('mapNode')) return true;
    t = t.parentNode;
  }
  return false;
}
document.addEventListener('touchstart', function(e){ if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', function(e){
  if(!inMapScroll(e.target)) e.preventDefault();
}, {passive:false});
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if(now - lastTouchEnd < 350 && !inMapScroll(e.target)) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

/* ==================== pop → parachute → land ==================== */
function popBalloon(b, cx, cy){
  sfxPop();
  b.el.classList.add('popped');
  setTimeout(function(){ removeBalloon(b); }, 200);
  spawnChute(cx, cy);
}
function chuteSVG(){
  return '<svg viewBox="0 0 110 130" width="110" height="130">' +
    '<path d="M8 46 Q 55 -12 102 46 Q 78 34 55 40 Q 32 34 8 46 Z" fill="#FFF" stroke="#DDD" stroke-width="2" opacity="0.95"/>' +
    '<line x1="12" y1="46" x2="45" y2="92" stroke="#FFF" stroke-width="3" stroke-dasharray="5 4"/>' +
    '<line x1="55" y1="42" x2="55" y2="90" stroke="#FFF" stroke-width="3" stroke-dasharray="5 4"/>' +
    '<line x1="98" y1="46" x2="65" y2="92" stroke="#FFF" stroke-width="3" stroke-dasharray="5 4"/>' +
    '</svg>';
}
function spawnChute(cx, cy){
  var el = document.createElement('div');
  el.className = 'chute';
  el.innerHTML = chuteSVG() + '<div class="pcat">🐱</div>';
  kittenLayer.appendChild(el);
  S.chutes.push({ el: el, x: cx - 55, y: cy - 40, born: performance.now() });
}
function groundY(){ return H - 96; }
function landKitten(x){
  var cat = document.createElement('div');
  cat.className = 'savedCat';
  cat.textContent = '🐱';
  // kittens gather in a cosy pile beside Web Buddy
  var slot = S.savedCats.length;
  var px = W/2 + 110 + (slot % 4) * 54 - Math.floor(slot/4)*26;
  px = Math.min(px, W - 70);
  cat.style.left = px + 'px';
  cat.style.top = (groundY() + 26 - Math.floor(slot/4)*30) + 'px';
  kittenLayer.appendChild(cat);
  S.savedCats.push(cat);
  sfxMeow();
  S.rescued++;
  refreshHud();
  banner('Kitten saved! 🐱💛 ' + Math.min(S.rescued, S.cfg.k) + '/' + S.cfg.k, 1400);
  // L10 twist: halfway confetti party!
  if(S.cfg.party && !S.partyDone && S.rescued >= Math.ceil(S.cfg.k/2)){
    S.partyDone = true;
    confettiBurst();
    sfxFanfare();
    setTimeout(function(){ banner('Halfway party! 🎉🎊', 1800); }, 600);
  }
  if(S.rescued >= S.cfg.k) setTimeout(winLevel, 900);
}

/* ==================== confetti & fireworks ==================== */
function confettiBurst(){
  var colors = ['#E53935','#1E5AE8','#FFC93C','#4CAF50','#FFF','#FF8A65'];
  for(var i=0;i<60;i++){
    var c = document.createElement('div');
    c.className = 'confet';
    c.style.left = rand(0,100) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = rand(1.6, 3.2) + 's';
    c.style.animationDelay = rand(0, 0.7) + 's';
    confettiEl.appendChild(c);
  }
  setTimeout(function(){ confettiEl.innerHTML = ''; }, 4500);
}
// L20 FINALE twist: fireworks — but they only launch while the light is GREEN!
var FW_EMOJI = ['✨','🎇','💥','🌟'];
function fireworkBurst(x, y){
  sfxFirework();
  for(var i=0;i<10;i++){
    var s = document.createElement('div');
    s.className = 'fw';
    s.textContent = FW_EMOJI[i % FW_EMOJI.length];
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    var ang = rand(0, Math.PI*2), dist = rand(60, 170);
    s.style.setProperty('--dx', (Math.cos(ang)*dist) + 'px');
    s.style.setProperty('--dy', (Math.sin(ang)*dist) + 'px');
    stage.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 1300); })(s);
  }
}

/* ==================== win a level ==================== */
function winLevel(){
  if(S.won) return;
  S.won = true;
  S.running = false;
  var earned = starsForTaps(S.redTaps);
  // save best result + unlock next level
  var idx = S.levelIdx;
  if(earned > save.stars[idx]) save.stars[idx] = earned;
  if(idx + 1 < 20) save.unlocked = Math.max(save.unlocked, idx + 2);
  saveSave();
  sfxFanfare();
  confettiBurst();
  S.savedCats.forEach(function(c){ c.classList.add('dance'); });
  banner('ALL kittens safe! 🎉', 2200);
  var finale = !!S.cfg.finale;
  setTimeout(function(){ showWinOverlay(earned, finale); }, 1800);
}
function showWinOverlay(earned, finale){
  var wc = $('winCats'); wc.innerHTML = '';
  for(var i=0;i<S.cfg.k;i++){
    var sp = document.createElement('span'); sp.textContent = '🐱'; wc.appendChild(sp);
  }
  // star pops
  var slots = $('winStars').children;
  for(var j=0;j<3;j++){
    slots[j].classList.remove('pop','dud');
    if(j < earned){
      (function(el, delay){ setTimeout(function(){ el.classList.add('pop'); sfxChime(); }, delay); })(slots[j], 400 + j*450);
    } else slots[j].classList.add('dud');
  }
  if(finale){
    $('winTitle').textContent = 'You beat ALL 20 levels! 🏆';
    $('winMsg').textContent = 'The Mayor gives you a medal, super waiter! 🏅🎖️';
    $('medal').style.display = 'block';
    $('paradeWrap').style.display = 'block';
    var row = '';
    for(var p=0;p<12;p++) row += (p%3===2 ? '🎈' : '🐱') + ' ';
    $('paradeRow').textContent = '🎺 ' + row + '🎺';
    $('nextBtn').textContent = 'Play again! 🔄';
    // celebration fireworks on the overlay
    var fwCount = 0;
    var fwTimer = setInterval(function(){
      if($('winOverlay').classList.contains('hidden') || fwCount++ > 8){ clearInterval(fwTimer); return; }
      fireworkBurst(rand(0.15,0.85)*W, rand(0.12,0.4)*H);
    }, 900);
    confettiBurst();
  } else {
    $('winTitle').textContent = 'Level ' + (S.levelIdx+1) + ' done! 🎉';
    $('winMsg').textContent = (earned === 3) ? 'PERFECT waiting! Zero red taps! 🌟✋'
                      : (earned === 2) ? 'Great job! Almost perfect waiting! 💛'
                      : 'You did it! Let’s practice waiting more! 💪';
    $('medal').style.display = 'none';
    $('paradeWrap').style.display = 'none';
    $('nextBtn').textContent = 'Next Level ▶';
  }
  $('winOverlay').classList.remove('hidden');
}

/* ==================== main loop ==================== */
var lastT = 0;
function frame(t){
  requestAnimationFrame(frame);
  if(!S.running) { lastT = t; return; }
  var dt = Math.min(50, t - lastT) / 1000; lastT = t;
  var cfg = S.cfg;
  if(!S.won){
    updatePhase(t);
    // keep the sky populated
    var maxBalloons = cfg.groups * (cfg.gsize === 0 ? 2 : cfg.gsize);
    if(countBalloons() < maxBalloons && t - S.lastSpawn > 1500){
      S.lastSpawn = t;
      spawnGroup();
    }
    // L20: fireworks only launch on GREEN
    if(cfg.finale && S.phase === 'go' && t - S.lastFirework > 2400){
      S.lastFirework = t;
      fireworkBurst(rand(0.15,0.85)*W, rand(0.1,0.35)*H);
    }
  }
  // balloons drift gently upward (plus sideways sway on drift levels)
  var driftAmp = (cfg.drift || 0) * W;
  for(var i = S.balloons.length - 1; i >= 0; i--){
    var b = S.balloons[i];
    b.y -= b.speed * dt;
    if(driftAmp > 0){
      // sine sway at 0.3 Hz
      b.x = b.baseX + Math.sin(2*Math.PI*0.3*(t/1000) + b.driftPhase) * driftAmp;
    }
    b.el.style.transform = 'translate3d(' + b.x + 'px,' + b.y + 'px,0)';
    if(b.y < -260) removeBalloon(b); // floats away — kitten is still fine!
  }
  // parachutes sway down
  for(var j = S.chutes.length - 1; j >= 0; j--){
    var ch = S.chutes[j];
    ch.y += 85 * dt;
    var age = (t - ch.born) / 1000;
    var sway = Math.sin(age * 3.2) * 22;
    var tilt = Math.sin(age * 3.2) * 8;
    ch.el.style.transform = 'translate3d(' + (ch.x + sway) + 'px,' + ch.y + 'px,0) rotate(' + tilt + 'deg)';
    if(ch.y + 130 >= groundY() + 60){
      var lx = ch.x + sway + 30;
      ch.el.remove();
      S.chutes.splice(j,1);
      landKitten(lx);
    }
  }
}
requestAnimationFrame(frame);

/* ==================== level map ==================== */
var NODE_GAP = 150, MAP_PAD = 120;
var mapBuilt = false;
function mapTotalH(){ return 20 * NODE_GAP + MAP_PAD * 2; }
function nodeXPct(i){ return (i % 2 === 0) ? 32 : 68; } // zigzag web path
function nodeYPx(i){ return mapTotalH() - MAP_PAD - NODE_GAP/2 - i * NODE_GAP; } // level 1 at bottom
function buildMap(){
  var track = $('mapTrack');
  var totalH = mapTotalH();
  track.style.height = totalH + 'px';
  var svg = $('mapPathSvg');
  svg.setAttribute('viewBox', '0 0 400 ' + totalH);
  // dashed web path connecting all 20 nodes
  var pts = [];
  for(var i=0;i<20;i++) pts.push((nodeXPct(i)*4) + ',' + nodeYPx(i));
  svg.innerHTML = '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#FFF" ' +
    'stroke-width="8" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.85"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#33475b" ' +
    'stroke-width="2" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.25"/>';
  for(var n=0;n<20;n++){
    var node = document.createElement('div');
    node.className = 'mapNode';
    node.id = 'node' + n;
    node.style.left = 'calc(' + nodeXPct(n) + '% - 48px)';
    node.style.top = (nodeYPx(n) - 48) + 'px';
    (function(idx, el){
      el.addEventListener('pointerdown', function(e){
        e.stopPropagation();
        onNodeTap(idx, el);
      });
    })(n, node);
    track.appendChild(node);
  }
  mapBuilt = true;
}
function refreshMap(){
  if(!mapBuilt) buildMap();
  for(var i=0;i<20;i++){
    var el = $('node' + i);
    el.classList.remove('locked','open','done');
    var stars = save.stars[i];
    var unlocked = i < save.unlocked;
    if(stars > 0){
      el.classList.add('done');
      var starTxt = '';
      for(var s=0;s<3;s++) starTxt += (s < stars) ? '⭐' : '☆';
      el.innerHTML = '<span class="num">' + (i+1) + '</span>' +
        '<span class="nodeStars">' + starTxt + '</span>';
    } else if(unlocked){
      el.classList.add('open');
      el.innerHTML = '<span class="nodeTag">🕷️</span><span class="num">' + (i+1) + '</span><span class="sub" style="color:#fff;">GO!</span>';
    } else {
      el.classList.add('locked');
      el.innerHTML = '<span class="sub">🔒</span><span class="num">' + (i+1) + '</span>';
    }
  }
}
var toastTimer = null;
function mapToast(msg){
  var tEl = $('mapToast');
  tEl.textContent = msg;
  tEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ tEl.classList.remove('show'); }, 1800);
}
function onNodeTap(idx, el){
  if(idx >= save.unlocked){
    // locked: wiggle the grey cocoon + toast
    el.classList.remove('wiggle');
    void el.offsetWidth; // restart animation
    el.classList.add('wiggle');
    sfxOops();
    mapToast('Finish level ' + save.unlocked + ' first! 🔒');
    return;
  }
  sfxThwip();
  $('mapScreen').classList.add('hidden');
  startLevel(idx);
}
function nextUnbeatenIdx(){
  for(var i=0;i<save.unlocked && i<20;i++){
    if(save.stars[i] === 0) return i;
  }
  return Math.min(save.unlocked, 20) - 1; // all beaten so far → latest level
}
function scrollToNode(idx, smooth){
  var scroller = $('mapScroll');
  var target = nodeYPx(idx) - scroller.clientHeight/2;
  target = Math.max(0, Math.min(target, mapTotalH() - scroller.clientHeight));
  if(smooth && scroller.scrollTo){
    try{ scroller.scrollTo({ top: target, behavior:'smooth' }); }
    catch(e){ scroller.scrollTop = target; }
  } else scroller.scrollTop = target;
}
function showMap(smoothScroll){
  document.body.classList.remove('night');
  clearField();
  S.running = false;
  refreshMap();
  $('winOverlay').classList.add('hidden');
  $('startScreen').classList.add('hidden');
  document.body.classList.add('mapOpen');
  $('mapScreen').classList.remove('hidden');
  musicMood('go');
  setTimeout(function(){ scrollToNode(nextUnbeatenIdx(), !!smoothScroll); }, 60);
}
$('continueBtn').addEventListener('pointerdown', function(e){
  e.stopPropagation(); e.preventDefault();
  scrollToNode(nextUnbeatenIdx(), true);
});

/* ==================== start / reset a level ==================== */
function clearField(){
  S.balloons.slice().forEach(removeBalloon);
  S.chutes.forEach(function(c){ c.el.remove(); });
  S.savedCats.forEach(function(c){ c.remove(); });
  S.balloons = []; S.chutes = []; S.savedCats = [];
  webLayer.innerHTML = '';
}
function startLevel(idx){
  document.body.classList.remove('mapOpen');
  clearField();
  S.levelIdx = idx;
  S.cfg = LEVELS[idx];
  S.rescued = 0; S.redTaps = 0; S.redStreak = 0;
  S.waitScale = 1; S.warnBonus = 0;
  S.cleanWaits = 0; S.won = false;
  S.firstGoDone = false; S.fakeoutDone = false; S.fakeoutAt = 0;
  S.longWaitDone = false; S.partyDone = false;
  S.lastSpawn = 0; S.lastFirework = 0;
  document.body.classList.toggle('night', !!S.cfg.night);
  if(S.cfg.night && !$('nightStars').children.length){
    for(var i=0;i<18;i++){
      var st = document.createElement('span');
      st.textContent = (i%3===0) ? '⭐' : '✨';
      st.style.left = rand(2,95) + '%';
      st.style.top = rand(2,55) + '%';
      $('nightStars').appendChild(st);
    }
  }
  refreshHud();
  S.running = true;
  setPhase('go', performance.now());
  // a couple of starter balloons already floating
  if(S.cfg.gsize <= 1){
    spawnBalloon({ x: W*0.30 - 75, y: H*0.55 });
    spawnBalloon({ x: W*0.65 - 75, y: H*0.72 });
  } else {
    spawnGroup();
  }
  var intro = 'Level ' + (idx+1) + '! Save ' + S.cfg.k + ' kittens! 🐱';
  if(S.cfg.kittenOnly) intro = 'Level ' + (idx+1) + '! Only tap KITTEN balloons! 🐱 not 🎃';
  if(S.cfg.night) intro = 'Level ' + (idx+1) + '! Night rescue! 🌙 Kittens only! 🐱';
  if(S.cfg.finale) intro = 'FINAL LEVEL! Save ' + S.cfg.k + ' kittens! 🏆🐱';
  banner(intro, 2300);
}

/* ==================== buttons & flow ==================== */
$('playBtn').addEventListener('pointerdown', function(e){
  e.stopPropagation(); e.preventDefault();
  initAudio();
  if(AC && AC.state === 'suspended') AC.resume();
  showMap(false);
});
$('nextBtn').addEventListener('pointerdown', function(e){
  e.stopPropagation(); e.preventDefault();
  $('winOverlay').classList.add('hidden');
  if(S.cfg.finale){
    showMap(true); // finale finished → back to map to replay favourites
  } else {
    var next = S.levelIdx + 1;
    if(next < 20 && next < save.unlocked) startLevel(next);
    else showMap(true);
  }
});
$('mapBtn').addEventListener('pointerdown', function(e){
  e.stopPropagation(); e.preventDefault();
  showMap(true);
});
})();
</script>
