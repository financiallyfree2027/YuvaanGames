/* getting hit costs TIME and nothing else — no health, no arm un-ties */
function hitByOck(what){
  if(S.phase!=='boss') return;
  sndOops();
  floatText(hero.x,hero.y-150,'💫',56);
  /* the Boing sound and the cloud say it better than words */
  S.phase='falling';
  S.vy=40;
  const last=roofs[roofs.length-1];
  S.fallX=last.x+last.w+120;
  cloudEl.style.left=(S.fallX-165)+'px'; cloudEl.style.top=(CLOUD_TOP-15)+'px';
}

/* ================================================================
   LANDING / FALLING / BOUNCING — never a loss, only Boing
   ================================================================ */
function doLand(lx,g){
  whistleStop();
  hero.x=lx; hero.y=g.b.y; hero.rot=0;
  sndYay();
  floatText(lx,g.b.y-160,pick(['🌟','🎉','💚','⭐']),60);
  tween(0.3,k=>{ const s=Math.sin(k*Math.PI); hero.sy=1-0.28*s; hero.sx=1+0.28*s; },()=>{
    hero.sx=hero.sy=1;
    S.roof++; S.missesOnGap=0;
    if(S.roof===roofs.length-1){
      if(LV.arms>0) beginBoss();
      else levelComplete();
    } else {
      S.phase='idle'; setIdle(true); positionCloudHome();
    }
  });
}
function startFall(){
  whistleStop(); sndOops();
  S.missesOnGap++;
  S.phase='falling'; S.vy=60;
}
function doBounce(){
  S.phase='bouncing';
  sndBoing();
  floatText(S.fallX,CLOUD_TOP-120,'☁️',58);
  cloudEl.classList.add('squish');
  setTimeout(()=>cloudEl.classList.remove('squish'),220);
  tween(0.7,k=>{
    const s=Math.sin(k*Math.PI);
    hero.y=CLOUD_TOP-150*s;
    hero.rot=Math.sin(k*Math.PI*3)*12;
    hero.sy=1+0.18*s; hero.sx=1-0.12*s;
  },()=>{ hero.rot=0; hero.sx=hero.sy=1; doReturn(); });
}
function doReturn(){
  S.phase='returning';
  const sx0=hero.x, sy0=hero.y;
  const tx=heroHomeX(S.roof), ty=roofYof(S.roof);
  tween(0.7,k=>{
    const e=easeInOut(k);
    hero.x=sx0+(tx-sx0)*e;
    hero.y=sy0+(ty-sy0)*e-180*Math.sin(Math.PI*k);
  },()=>{
    hero.x=tx; hero.y=ty;
    if(S.onBossRoof && OCK.live){ S.phase='boss'; setIdle(true); }
    else { S.phase='idle'; setIdle(true); }
  });
}
function positionCloudHome(){
  if(S.onBossRoof){
    const last=roofs[roofs.length-1];
    cloudEl.style.left=(last.x+last.w+120-165)+'px';
    cloudEl.style.top=(CLOUD_TOP-15)+'px';
    return;
  }
  if(S.roof<roofs.length-1){
    const g=gapInfo();
    cloudEl.style.left=((g.a.x+g.a.w+g.b.x)/2-165)+'px';
    cloudEl.style.top=(CLOUD_TOP-15)+'px';
  }
}

/* ================================================================
   LEVEL COMPLETE
   ================================================================ */
function levelComplete(){
  if(S.phase==='win'||S.phase==='walking') return;
  const par=levelPar();
  const earned=starsForTries(S.tries,par);
  const idx=S.level-1;
  const prevBest=save.best[idx];
  if(earned>save.stars[idx]) save.stars[idx]=earned;
  /* honest scorekeeping: the record only moves when the run is genuinely better */
  if(prevBest===0 || S.tries<prevBest) save.best[idx]=S.tries;
  save.blocks=(save.blocks|0)+S.blocks;
  if(S.level<NLV) save.unlocked=Math.max(save.unlocked,S.level+1);
  persist();

  $('bossHud').classList.remove('show');
  $('blockBtn').classList.remove('on','held','empty');
  $('staminaWrap').classList.remove('on');
  shieldDown(true);
  S.frameOck=false;                    // camera goes back to Yuvaan for his own celebration

  if(S.level===NLV) walkToTruck(earned,prevBest);
  else {
    S.phase='win';
    heroEl.classList.add('celebrate');
    sndFanfare(); confetti(40);
    cue('🎉');
    tween(0.9,k=>{ hero.y=roofYof(roofs.length-1)-150*Math.sin(Math.PI*k); hero.rot=360*k; },
      ()=>{ hero.rot=0; });
    setTimeout(()=>showWinScreen(earned,prevBest),1300);
  }
}
function walkToTruck(earned,prevBest){
  S.phase='walking';
  cue('🍦');
  const sx0=hero.x, tx=truckX-110, ry=roofYof(roofs.length-1);
  tween(1.1,k=>{ hero.x=sx0+(tx-sx0)*k; hero.y=ry-Math.abs(Math.sin(k*Math.PI*3))*24; },
    ()=>winParty(earned,prevBest));
}
function winParty(earned,prevBest){
  S.phase='win';
  const ry=roofYof(roofs.length-1);
  hero.y=ry; heroEl.classList.add('celebrate');
  sndFanfare(); confetti(90);
  banner('🍨 '+NLV+' 🌟');
  floatText(truckX+100,ry-240,'🍨🍦🍧',74);
  tween(0.9,k=>{ hero.y=ry-170*Math.sin(Math.PI*k); hero.rot=360*k; },()=>{ hero.rot=0; });
  setTimeout(()=>sndFanfare(),1000);
  setTimeout(()=>{ confetti(60); showWinScreen(earned,prevBest); },2200);
}
function showWinScreen(earned,prevBest){
  $('winTitle').textContent = S.level===NLV ? '🍨🍦🍧' : '🎉 '+S.level+' 🎉';
  const ws=$('winStars'); ws.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span'); s.textContent='⭐';
    s.style.animationDelay=(i*0.25)+'s';
    if(i>=earned) s.style.filter='grayscale(1) opacity(.35)';
    ws.appendChild(s);
  }
  let line='🔁 '+S.tries;
  if(S.throws>0) line += '   🥎 '+S.throws;
  if(S.blocks>0) line += '   🛡️ '+S.blocks;
  $('winTries').textContent=line;
  /* honest scorekeeping, stated warmly */
  /* honest scorekeeping, wordlessly: your best ever, and a medal if beaten */
  const h=$('winHonest');
  h.textContent = prevBest>0 ? (S.tries<prevBest ? '🏅 '+S.tries : '🏆 '+prevBest) : '';
  $('nextBtn').style.display = S.level<NLV ? '' : 'none';
  $('winScreen').style.display='flex';
  [0,1,2].forEach(i=>{ if(i<earned) setTimeout(sndSparkle,300+i*300); });
  confetti(30);
}

/* ================================================================
   POWERS I KNOW
   ================================================================ */
/* wordless power cards: the icons ARE the label */
const POWERS=[
  {k:'swing', i:'🕸️', t:'👇 ✋ → 🕸️'},
  {k:'throw', i:'🥎', t:'👆 → 🥎'},
  {k:'block', i:'🛡️', t:'👇 ✋ → 🛡️'},
  {k:'sky',   i:'🚀', t:'🕸️ + 🥎 → 🚀'},
  {k:'anchor',i:'🤩', t:'🥎 + 🧱 → 🕸️'},
];
function buildPowers(){
  const box=$('powersList'); box.innerHTML='';
  POWERS.forEach(p=>{
    const got=!!save.powers[p.k];
    const d=document.createElement('div');
    d.className='powCard'+(got?'':' locked');
    d.innerHTML=`<div class="pi">${got?p.i:'🔒'}</div>
      <div><div class="pt">${got?p.t:'🔒'}</div></div>`;
    box.appendChild(d);
  });
  const tot=document.createElement('div');
  tot.className='powCard';
  tot.innerHTML=`<div class="pi">🏅</div><div><div class="pt">`+
    `🥎 ${save.throws} &nbsp; 🟣 ${save.pops} &nbsp; 🛡️ ${save.blocks}</div></div>`;
  box.appendChild(tot);
}
$('powersBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault();
  buildPowers(); $('powersScreen').style.display='block'; sndPop(); });
$('powersClose').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault();
  $('powersScreen').style.display='none'; });

/* ================================================================
   LEVEL MAP
   ================================================================ */
const NODE_SPACING=175, MAP_PAD_TOP=150, MAP_PAD_BOT=170;
function nodePos(i,w,H){
  const xf=[0.28,0.5,0.72,0.5][i%4];
  return {x:w*xf, y:H-MAP_PAD_BOT-i*NODE_SPACING};
}
function buildMap(){
  const wrap=$('mapPath'), scroll=$('mapScroll');
  const w=scroll.clientWidth||window.innerWidth;
  const H=MAP_PAD_TOP+MAP_PAD_BOT+(NLV-1)*NODE_SPACING+120;
  wrap.style.height=H+'px';
  const pts=[];
  for(let i=0;i<NLV;i++){ const p=nodePos(i,w,H); pts.push(p.x+','+p.y); }
  let html=`<svg id="mapSvg" width="${w}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <polyline points="${pts.join(' ')}" fill="none" stroke="rgba(255,255,255,.9)"
      stroke-width="7" stroke-dasharray="4 18" stroke-linecap="round"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="rgba(30,90,232,.25)"
      stroke-width="16" stroke-linecap="round"/></svg>`;
  const decos=['🏙️','🏢','🌆','☁️','⛅','☁️','🌤️','☁️','🕸️','☁️'];
  for(let i=0;i<NLV;i+=2){
    const p=nodePos(i,w,H); const side=(i%4===0)?0.9:0.08;
    html+=`<div class="mapDeco" style="left:${w*side-30}px;top:${p.y-90}px">${decos[(i/2)%decos.length]}</div>`;
  }
  for(let i=0;i<NLV;i++){
    const lvl=i+1, p=nodePos(i,w,H);
    const done=save.stars[i]>0, unlocked=lvl<=save.unlocked;
    const hasBoss=LEVELS[i].arms>0;
    const cls=(!unlocked?'locked':(done?'done':'play'))+(hasBoss?' boss':'');
    const inner=!unlocked?'🔒':lvl;
    let starsHtml='';
    if(done){
      starsHtml='<div class="nodeStars">';
      for(let s=0;s<3;s++) starsHtml+=`<span class="${s<save.stars[i]?'':'off'}">⭐</span>`;
      starsHtml+='</div>';
    }
    const ockTag = hasBoss&&unlocked ? '<div class="nodeOck">🐙</div>' : '';
    html+=`<button class="mapNode ${cls}" id="node${lvl}" data-lvl="${lvl}"
      style="left:${p.x}px;top:${p.y}px">${inner}${starsHtml}${ockTag}</button>`;
  }
  wrap.innerHTML=html;
  wrap.querySelectorAll('.mapNode').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lvl=parseInt(btn.dataset.lvl,10);
      if(lvl<=save.unlocked){ sndPop(); startLevel(lvl); }
      else {
        btn.classList.remove('wiggle'); void btn.offsetWidth; btn.classList.add('wiggle');
        sndOops(); showToast('🔒 '+(lvl-1));
      }
    });
  });
  $('continueBtn').textContent='▶️ '+nextUnbeaten();
}
function nextUnbeaten(){
  for(let i=0;i<NLV;i++) if(i+1<=save.unlocked && save.stars[i]===0) return i+1;
  return Math.min(NLV,save.unlocked);
}
function scrollToNode(lvl,smooth){
  const el=$('node'+lvl);
  if(el) el.scrollIntoView({block:'center',behavior:smooth?'smooth':'auto'});
}
function openMap(){
  clearTweens(); whistleStop(); clearTimers();
  S.phase='map';
  document.body.classList.remove('sunset');
  $('winScreen').style.display='none';
  $('powersScreen').style.display='none';
  $('banner').classList.remove('show');
  $('hud').style.display='none';
  $('bossHud').classList.remove('show');
  $('blockBtn').classList.remove('on','held','empty');
  $('staminaWrap').classList.remove('on');
  shieldDown(true);
  buildMap();
  document.body.classList.add('mapOpen');
  $('mapScreen').style.display='block';
  requestAnimationFrame(()=>scrollToNode(save.unlocked,false));
}
$('continueBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault();
  scrollToNode(nextUnbeaten(),true); });
$('hudMapBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault();
  if(S.phase==='start'||S.phase==='map') return; openMap(); });

/* ================================================================
   FLOW
   ================================================================ */
function startLevel(n){
  clearTweens(); whistleStop();
  S.level=n; S.tries=0; S.missesOnGap=0; S.power=0; S.throws=0; S.pops=0; S.blocks=0;
  S.lastFire=-99;
  document.body.classList.remove('mapOpen');
  $('mapScreen').style.display='none';
  $('winScreen').style.display='none';
  $('powersScreen').style.display='none';
  $('banner').classList.remove('show');
  $('blockBtn').classList.remove('on','held','empty');
  $('staminaWrap').classList.remove('on');
  $('zoneBot').classList.remove('off');
  $('zoneTop').classList.remove('off','cool');
  $('throwBtn').classList.remove('cool');
  buildLevel(n);
  heroInner.classList.remove('crouch','shoot');
  previewEl.style.display='none'; chargeLineEl.style.display='none';
  webLineEl.style.display='none'; splatEl.style.display='none';
  splatEl.classList.remove('pulse');
  /* must be an explicit value: the stylesheet has #hud{display:none},
     so clearing the inline style would leave the whole HUD hidden */
  $('hud').style.display='block';
  updateTryBadge();
  $('tryBadge').textContent='🕸️ '+n+'   🔁 0';
  S.phase='idle';
  setIdle(true);
  const prev=save.best[n-1];
  if(LEVEL_CUES[n]) cue(LEVEL_CUES[n]);
  if(n===1) attn($('blockBtn'),0), attn($('throwBtn'),0);   /* clear any leftovers */
  if(n===2) attn($('throwBtn'),4200);                        /* web-ball level */
  /* the previous-best record lives on the win screen, not on the playfield */
}
$('playBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); startGame(); });
$('startScreen').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); startGame(); });
function startGame(){
  if(S.phase!=='start') return;
  audioInit();
  $('startScreen').style.display='none';
  openMap();
}
$('nextBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault();
  if(S.level<NLV) startLevel(S.level+1); else openMap(); });
$('toMapBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); openMap(); });

/* ================================================================
   MAIN LOOP
   ================================================================ */
function resize(){
  S.scale=window.innerHeight/WORLD_H;
  S.viewW=window.innerWidth/S.scale;
  scaler.style.transform='scale('+S.scale+')';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();

const inLevel=()=>['idle','charging','swinging','falling','bouncing','returning','boss','walking','win'].includes(S.phase);

let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now; S.time+=dt;

  if(inLevel()){
    /* drifting anchors */
    for(let i=0;i<gapsMeta.length;i++){
      const m=gapsMeta[i];
      if(!m.moving) continue;
      m.ax=m.baseAx+m.amp*Math.sin(2*Math.PI*0.2*S.time);
    }
    /* blobs drift + bob so they read as alive */
    for(const b of blobs){
      if(!b.alive) continue;
      b.x=b.baseX+b.drift*Math.sin(S.time*0.55+b.ph);
      b.el.style.left=(b.x-(b.sky?44:37))+'px';
      b.ring.style.left=(b.x-(b.sky?75:60))+'px';
    }
    updateBalls(dt);
    if(S.onBossRoof) updateShield(dt);
    if(S.phase==='boss'||OCK.hurtT>0) updateBoss(dt);
  }

  /* charging: ping-pong power + live preview arc */
  if(S.phase==='charging'){
    S.power+=S.chargeDir*dt/1.4;
    if(S.power>=1){ S.power=1; S.chargeDir=-1; }
    if(S.power<=0){ S.power=0; S.chargeDir=1; }
    const g=gapInfo();
    const needs=g.m.needAnchor&&!g.m.anchorMade;
    const an=anchorNow(g.m);
    if(!needs){
      splatEl.setAttribute('transform',`translate(${an.x},${an.y})`);
      const hx=hero.x+4, hy=hero.y-92;
      chargeLineEl.setAttribute('x1',hx); chargeLineEl.setAttribute('y1',hy);
      chargeLineEl.setAttribute('x2',hx+(an.x-hx)*S.power);
      chargeLineEl.setAttribute('y2',hy+(an.y-hy)*S.power);
    }
    const lx=predictedLandX(g);
    const cpx=(hero.x+lx)/2;
    previewEl.setAttribute('d',
      `M ${hero.x+4} ${hero.y-92} Q ${cpx} ${BASE_ROOF_Y+90} ${lx} ${g.b.y-10}`);
  }

  /* falling to the trampoline cloud */
  if(S.phase==='falling'){
    S.vy+=1500*dt;
    hero.y+=S.vy*dt;
    hero.rot+=dt*60;
    if(hero.y>=CLOUD_TOP){ hero.y=CLOUD_TOP; doBounce(); }
  }

  /* tweens */
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    tw.t+=dt;
    const k=Math.min(1,tw.t/tw.dur);
    tw.fn(k);
    if(k>=1){ tweens.splice(i,1); if(tw.done) tw.done(); }
  }

  /* camera + parallax */
  if(inLevel()){
    let focus=hero.x;
    /* frame BOTH fighters for the whole boss sequence — including the
       tangle-up celebration, which is the funniest beat in the game and
       must not scroll off-screen just because he stopped being 'live'. */
    if(S.frameOck && OCK.el) focus=(hero.x+OCK.x+OCK_W/2)/2;
    const target=Math.min(Math.max(focus-S.viewW*0.42,0),Math.max(0,WORLD_W-S.viewW));
    S.camX+=(target-S.camX)*Math.min(1,dt*4);
    mainL.style.transform='translate3d('+(-S.camX)+'px,0,0)';
    midL.style.transform ='translate3d('+(-S.camX*0.5)+'px,0,0)';
    farL.style.transform ='translate3d('+(-S.camX*0.25)+'px,0,0)';
    heroEl.style.transform='translate('+(hero.x-45)+'px,'+(hero.y-110)+'px)'+
      ' rotate('+hero.rot+'deg) scale('+hero.sx+','+hero.sy+')';
  }
  requestAnimationFrame(loop);
}

/* start-screen cast */
$('startHero').innerHTML=heroSVG();
$('startOck').innerHTML=ockSVG(4);
buildLevel(1);
requestAnimationFrame(loop);
</script>
