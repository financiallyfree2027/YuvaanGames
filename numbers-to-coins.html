<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Yuvaan's Numbers to Coins</title>
<style>
  :root{
    --cream:#f6f2ea; --card:#ffffff; --line:#e4dfd3; --ink:#1c2420; --muted:#7b8580;
    --green:#2a9a68; --green-deep:#1f7d54; --green-pale:#e6f4ec; --green-border:#bfe3cf;
    --coral:#e56b62; --coral-pale:#fbe9e7;
    --gold:#f2b134; --gold-deep:#d4901c; --gold-pale:#fdf1d8; --gold-border:#f0dcae;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--cream);overflow:hidden;overscroll-behavior:none;
    font-family:var(--sans);color:var(--ink);touch-action:manipulation;}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;}

  /* Fixed 1000x640 board, scaled from the VISUAL viewport - on Android the address
     bar makes the layout viewport taller than what is actually on screen. */
  #board{position:fixed;left:50%;top:50%;width:1000px;height:640px;transform-origin:center center;}
  .screen{position:absolute;inset:0;display:none;}
  .screen.on{display:block;}

  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--green);}
  .pill{display:inline-block;border:1.5px solid var(--green-border);background:var(--green-pale);color:var(--green);
    border-radius:8px;padding:6px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
  .btn{border:none;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:22px;
    padding:13px 28px;box-shadow:0 5px 0 var(--green-deep);transition:transform .08s, opacity .3s;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-deep);}

  /* ---------------- MAP ---------------- */
  #map .head{position:absolute;left:0;right:0;top:26px;text-align:center;}
  #map h1{margin:6px 0 0;font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:-.01em;}
  #map .sub{color:var(--muted);font-size:16px;margin-top:6px;}
  #mapSvg{position:absolute;left:0;top:118px;width:1000px;height:440px;}
  .node{cursor:pointer;} .node.locked{cursor:default;}
  .node circle.base{fill:#fff;stroke:var(--green-border);stroke-width:4;transition:all .2s;}
  .node.done circle.base{fill:var(--gold);stroke:var(--gold-deep);}
  .node.cur circle.base{stroke:var(--coral);stroke-width:5;}
  .node.locked circle.base{fill:#f3f0e9;stroke:#e6e2d8;}
  .node text.n{font-size:26px;font-weight:700;fill:var(--green);text-anchor:middle;font-family:var(--sans);}
  .node.done text.n{fill:#fff;} .node.locked text.n{fill:#c9c4b8;}
  .node text.stars{font-size:15px;fill:var(--gold-deep);text-anchor:middle;letter-spacing:1px;}
  .node.cur circle.ring{fill:none;stroke:var(--coral);stroke-width:3;opacity:.6;animation:ring 1.6s ease-out infinite;}
  @keyframes ring{0%{r:36;opacity:.7}100%{r:54;opacity:0}}
  #mapFoot{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;}
  #resetBtn{position:absolute;right:22px;top:22px;background:none;border:none;color:#b7b1a5;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;}

  /* ---------------- PLAY ---------------- */
  #play .card{position:absolute;left:30px;top:22px;width:940px;height:596px;background:var(--card);
    border:1.5px solid var(--line);border-radius:22px;box-shadow:0 8px 30px rgba(60,50,30,.07);}
  #backBtn{position:absolute;left:48px;top:40px;background:none;border:none;color:var(--muted);font-size:15px;
    letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
  #stageLbl{position:absolute;left:0;right:0;top:40px;text-align:center;}
  #voiceBtn{position:absolute;right:48px;top:32px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    width:44px;height:36px;font-size:18px;color:var(--muted);}
  #voiceBtn.on{color:var(--green);border-color:var(--green-border);background:var(--green-pale);}

  #eq{position:absolute;left:0;right:0;top:76px;display:flex;justify-content:center;align-items:flex-start;gap:16px;}
  .slot{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .box{width:160px;height:160px;border:4px solid var(--green-border);border-radius:20px;background:#fff;
    box-shadow:0 6px 0 var(--green-pale);position:relative;
    transition:border-color .25s, box-shadow .25s;}
  .box .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:92px;font-weight:800;line-height:1;transition:opacity .3s, transform .3s;}
  .box .coins{position:absolute;inset:6px;opacity:0;transition:opacity .3s;}
  .box .coins svg{width:100%;height:100%;display:block;}
  .box.showcoins .num{opacity:0;transform:scale(.7);}
  .box.showcoins .coins{opacity:1;}
  .box.red{border-color:var(--coral);box-shadow:0 6px 0 var(--coral-pale);animation:shake .4s;}
  .box.red .num{color:var(--coral);}
  .box.green{border-color:var(--green);box-shadow:0 6px 0 var(--green-pale);animation:pop .4s;}
  .box.green .num{color:var(--green);}
  .box.gold{border-color:var(--gold-deep);box-shadow:0 6px 0 var(--gold-pale);}
  .box.gold .num{color:var(--gold-deep);}
  .cap{font-size:19px;font-weight:700;color:var(--gold-deep);height:24px;opacity:0;transition:opacity .3s;}
  .cap.show{opacity:1;}
  .op{font-size:64px;font-weight:700;color:var(--green);line-height:160px;width:44px;text-align:center;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}

  #msg{position:absolute;left:0;right:0;top:266px;text-align:center;font-family:var(--serif);font-size:29px;
    font-weight:600;min-height:38px;opacity:0;transform:translateY(6px);transition:opacity .3s, transform .3s;}
  #msg.show{opacity:1;transform:none;}
  #msg.good{color:var(--green);} #msg.bad{color:var(--coral);} #msg.plain{color:var(--ink);}

  #options{position:absolute;left:0;right:0;top:312px;display:flex;justify-content:center;gap:34px;
    transition:opacity .35s;}
  #options.hide{opacity:0;pointer-events:none;}
  .opt{width:150px;height:126px;border:4px solid var(--green-border);border-radius:20px;background:#fff;
    font-size:76px;font-weight:800;color:var(--ink);box-shadow:0 7px 0 var(--green-pale);padding:0;
    transition:transform .12s, box-shadow .12s;}
  .opt:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--green-pale);}
  .opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--green-pale);}
  .opt.empty{color:transparent;}

  #trayWrap{position:absolute;left:60px;right:60px;top:308px;height:172px;opacity:0;visibility:hidden;
    transition:opacity .4s;}
  #trayWrap.show{opacity:1;visibility:visible;}
  #trayWrap svg{width:100%;height:100%;display:block;overflow:visible;}
  #counter{position:absolute;left:0;right:0;top:486px;text-align:center;font-size:32px;font-weight:800;
    color:var(--gold-deep);opacity:0;transition:opacity .3s;}
  #counter.show{opacity:1;}

  #next{position:absolute;left:0;right:0;margin:0 auto;width:250px;top:530px;opacity:0;pointer-events:none;font-size:23px;}
  #next.show{opacity:1;pointer-events:auto;}

  #fly{position:absolute;inset:0;pointer-events:none;}
  .flyer{position:absolute;will-change:transform;transform-origin:center center;
    transition:transform .68s cubic-bezier(.45,0,.35,1), opacity .25s;}

  .conf{position:absolute;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}

  /* ---------------- FINISH ---------------- */
  #finish .card{position:absolute;left:150px;top:80px;width:700px;height:480px;background:#fff;
    border:1.5px solid var(--line);border-radius:26px;box-shadow:0 8px 30px rgba(60,50,30,.08);
    text-align:center;padding-top:54px;}
  #finish h1{font-family:var(--serif);font-size:46px;margin:8px 0 6px;font-weight:600;}
  #finish .big{font-size:64px;color:var(--gold);letter-spacing:6px;margin:4px 0 8px;}
  #finish p{color:var(--muted);font-size:18px;margin:0 0 28px;}
</style>
</head>
<body>
<div id="board">

  <div id="map" class="screen on">
    <div class="head">
      <div class="eyebrow">Numbers into coins &middot; 20 stages</div>
      <h1>Yuvaan's Numbers to Coins</h1>
      <div class="sub">Answer the sum, then watch each number turn into coins.</div>
    </div>
    <button id="resetBtn">Start over</button>
    <svg id="mapSvg" viewBox="0 0 1000 440"></svg>
    <div id="mapFoot"><button class="btn" id="playBtn">Play &#10141;</button></div>
  </div>

  <div id="play" class="screen">
    <div class="card"></div>
    <button id="backBtn">&lsaquo; Map</button>
    <div id="stageLbl"><span class="pill" id="stagePill">Stage 1 of 20</span></div>
    <button id="voiceBtn" title="Voice on or off">&#128266;</button>
    <div id="eq">
      <div class="slot"><div class="box" id="boxA"><span class="num" id="numA">1</span><div class="coins" id="coinsA"></div></div><div class="cap" id="capA"></div></div>
      <div class="op">+</div>
      <div class="slot"><div class="box" id="boxB"><span class="num" id="numB">1</span><div class="coins" id="coinsB"></div></div><div class="cap" id="capB"></div></div>
      <div class="op">=</div>
      <div class="slot"><div class="box" id="boxR"><span class="num" id="numR"></span><div class="coins" id="coinsR"></div></div><div class="cap" id="capR"></div></div>
    </div>
    <div id="msg"></div>
    <div id="options"></div>
    <div id="trayWrap"><svg viewBox="0 0 880 172" id="traySvg"></svg></div>
    <div id="counter"></div>
    <div id="fly"></div>
    <button class="btn" id="next">Next stage &#10141;</button>
  </div>

  <div id="finish" class="screen">
    <div class="card">
      <div class="eyebrow">All 20 stages</div>
      <h1>You did it, Yuvaan!</h1>
      <div class="big" id="finStars">&#9733;&#9733;&#9733;</div>
      <p id="finLine"></p>
      <button class="btn" id="finMap">Back to the map</button>
    </div>
  </div>
</div>

<script>
/* every number he adds is 1 to 5, so he can still check it on his fingers */
var STAGES = 20;
var PROBLEMS = [null,
  [1,1],[1,2],[2,1],[2,2],[3,1],
  [1,4],[2,3],[3,2],[4,2],[3,3],
  [5,1],[4,3],[5,2],[3,4],[4,4],
  [5,3],[3,5],[4,5],[5,4],[5,5]
];

var S = { stage:1, a:1, b:1, total:2, tries:0, lock:true, phase:0, stars:[], voice:true };
var SAVE_KEY = 'yuvaan-numbers-to-coins-v1';
function load(){ try{ var d=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
  S.stars = d.stars || []; S.voice = (d.v===1) ? !!d.voice : true; }catch(e){ S.stars=[]; } }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, stars:S.stars, voice:S.voice})); }catch(e){} }
function nextStage(){ for(var i=1;i<=STAGES;i++){ if(!S.stars[i]) return i; } return STAGES+1; }

var board = document.getElementById('board'), scale = 1;
function fit(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
  var ox = vv && vv.offsetLeft ? vv.offsetLeft : 0, oy = vv && vv.offsetTop ? vv.offsetTop : 0;
  scale = Math.min(w/1000, h/640) * 0.98;
  board.style.left = (ox + w/2) + 'px';
  board.style.top  = (oy + h/2) + 'px';
  board.style.transform = 'translate(-50%,-50%) scale('+scale+')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ fit(); setTimeout(fit,250); setTimeout(fit,600); });
if(window.visualViewport){ window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
fit();

function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function lockNow(){ S.phase++; S.lock=true; }
function unlockLater(ms){ var ph=S.phase; setTimeout(function(){ if(S.phase===ph) S.lock=false; }, ms); }
function show(id){ document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  document.getElementById(id).classList.add('on'); }
function centerOf(el){ var r=el.getBoundingClientRect(), b=board.getBoundingClientRect();
  return { x:(r.left+r.width/2-b.left)/scale, y:(r.top+r.height/2-b.top)/scale }; }
function confetti(x,y,n,spread){
  var c=['#2a9a68','#e56b62','#f2b134','#7cbf9d','#f3a8a1'];
  for(var i=0;i<n;i++){ var d=document.createElement('div'); d.className='conf';
    d.style.left=x+'px'; d.style.top=y+'px'; d.style.background=c[i%c.length];
    d.style.setProperty('--dx',(Math.random()*2-1)*spread+'px');
    d.style.setProperty('--dy',(150+Math.random()*260)+'px');
    d.style.animationDuration=(1+Math.random()*.9)+'s';
    board.appendChild(d); (function(el){ setTimeout(function(){ el.remove(); },2000); })(d); }
}
function setMsg(t,kind){ var m=document.getElementById('msg'); m.textContent=t; m.className = t ? ('show '+(kind||'plain')) : ''; }
function setCap(id, text){ var e=document.getElementById(id); e.textContent = text||''; e.className = text ? 'cap show' : 'cap'; }

/* ============ voice: recorded clips through Web Audio ============
   <audio> elements can stall at readyState 0 forever in some browsers with no
   error to catch, so playback goes through decodeAudioData instead. */

var CLIPS = { right:['cheer1','cheer2','cheer4'], wrong:['try3','try2'], done:['levelup'], all:['trophy'] };
var AC=null, BUF={}, node=null, FALLBACK={}, decodeTried=false;
function b64ToBytes(u){ var bin=atob(u.slice(u.indexOf(',')+1)), n=bin.length, a=new Uint8Array(n);
  for(var i=0;i<n;i++) a[i]=bin.charCodeAt(i); return a.buffer; }
function initAudio(){
  if(AC || decodeTried) return;
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C){ decodeTried=true; return; }
  try{ AC = new C(); }catch(e){ decodeTried=true; return; }
  decodeTried = true;
  Object.keys(SND).forEach(function(k){
    try{ AC.decodeAudioData(b64ToBytes(SND[k]), function(b){ BUF[k]=b; }, function(){}); }catch(e){}
  });
}
function unlockAudio(){ initAudio(); if(AC && AC.state!=='running' && AC.resume){ try{ AC.resume(); }catch(e){} } }
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('touchstart', unlockAudio, true);
document.addEventListener('mousedown', unlockAudio, true);
function playClip(kind){
  if(!S.voice) return;
  var list=CLIPS[kind]; if(!list||!list.length) return;
  var name=list[rnd(0,list.length-1)];
  unlockAudio();
  if(AC && BUF[name]){
    try{ if(node){ try{ node.stop(); }catch(e){} node=null; }
      var s=AC.createBufferSource(); s.buffer=BUF[name]; s.connect(AC.destination); s.start(0); node=s; return;
    }catch(e){}
  }
  try{ var a=FALLBACK[name]; if(!a){ a=new Audio(); a.src=SND[name]; FALLBACK[name]=a; }
    a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
}

/* ============ coins ============ */
function coin(cx, cy, r, id){
  return '<g class="coin"'+(id?' id="'+id+'"':'')+' transform="translate('+cx+','+cy+')">'
    + '<ellipse cx="0" cy="'+(r*0.16)+'" rx="'+r+'" ry="'+(r*0.94)+'" fill="#d4901c" opacity=".45"/>'
    + '<circle cx="0" cy="0" r="'+r+'" fill="#f2b134" stroke="#d4901c" stroke-width="'+(r*0.13)+'"/>'
    + '<circle cx="0" cy="0" r="'+(r*0.68)+'" fill="none" stroke="#ffd88a" stroke-width="'+(r*0.11)+'"/>'
    + '<text x="0" y="'+(r*0.34)+'" text-anchor="middle" font-size="'+(r*1.02)+'" font-weight="800"'
    + ' fill="#8a5a09" font-family="Arial,Helvetica,sans-serif">₹</text>'
    + '<ellipse cx="'+(-r*0.34)+'" cy="'+(-r*0.42)+'" rx="'+(r*0.28)+'" ry="'+(r*0.17)+'" fill="#fff" opacity=".5"'
    + ' transform="rotate(-32 '+(-r*0.34)+' '+(-r*0.42)+')"/>'
    + '</g>';
}
/* dice spots so 1-5 reads at a glance */
var SPOTS = {
  1:[[50,50]], 2:[[28,30],[72,70]], 3:[[22,24],[50,50],[78,76]],
  4:[[27,27],[73,27],[27,73],[73,73]], 5:[[24,24],[76,24],[50,50],[24,76],[76,76]]
};
function spotR(n){ return n<=2 ? 17 : (n===3 ? 15 : 13); }
/* `visible` lets the coins appear one at a time without the layout jumping */
function coinsSVG(n, idPrefix, visible){
  var vis = (visible === undefined) ? n : visible;
  var s = '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">';
  var pts = SPOTS[n] || SPOTS[5];
  for(var i=0;i<pts.length;i++){
    var g = coin(pts[i][0], pts[i][1], spotR(n), idPrefix ? idPrefix+i : null);
    if(i >= vis) g = g.replace('<g class="coin"', '<g class="coin" opacity="0"');
    s += g;
  }
  return s + '</svg>';
}

function nodePos(i){ var r=Math.floor((i-1)/5), c=(i-1)%5; if(r%2===1) c=4-c;

  for(var k=1;k<=STAGES;k++){
    var q=nodePos(k), st=S.stars[k], cls='node'+(st?' done':(k===cur?' cur':' locked'));
    s+='<g class="'+cls+'" data-stage="'+k+'" transform="translate('+q.x+','+q.y+')">';
    if(k===cur) s+='<circle class="ring" r="36"/>';
    s+='<circle class="base" r="32"/><text class="n" y="9">'+k+'</text>';
    if(st) s+='<text class="stars" y="56">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</text>';
    s+='</g>';
  }
  var svg=document.getElementById('mapSvg'); svg.innerHTML=s;
  svg.querySelectorAll('.node').forEach(function(n){
    n.onclick=function(){ var k=+n.getAttribute('data-stage'); if(S.stars[k]||k===cur) startStage(k); };
  });
  var pb=document.getElementById('playBtn');
  if(cur>STAGES){ pb.innerHTML='Play again ➝'; pb.onclick=function(){ startStage(1); }; }
  else { pb.innerHTML='Play stage '+cur+' ➝'; pb.onclick=function(){ startStage(cur); }; }
}
document.getElementById('resetBtn').onclick=function(){
  var b=this;
  if(b.dataset.arm==='1'){ S.stars=[]; save(); drawMap(); b.textContent='Start over'; b.dataset.arm='0'; }
  else { b.textContent='Tap again to erase stars'; b.dataset.arm='1';
         setTimeout(function(){ b.textContent='Start over'; b.dataset.arm='0'; },3000); }
};

/* ============ play ============ */
function optionsFor(t){
  var ok=function(v){ return v>=1 && v<=10 && v!==t; };
  var c=shuffle([t-1,t+1]).filter(ok).concat(shuffle([t-2,t+2]).filter(ok), shuffle([t-3,t+3]).filter(ok));
  return [t,c[0],c[1]].sort(function(x,y){ return x-y; });
}
function trayXY(i){ var col=i%5, row=Math.floor(i/5); return { x:120+col*160, y:54+row*66 }; }
function drawTray(filled, slots){
  var n = slots || 10;
  var s = '<rect x="50" y="6" width="780" height="160" rx="24" fill="#fdf1d8" stroke="#f0dcae" stroke-width="4"/>';
  for(var i=0;i<n;i++){ var p=trayXY(i);
    s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="26" fill="none" stroke="#f0dcae" stroke-width="3" stroke-dasharray="6 7"/>'; }
  for(var j=0;j<filled;j++){ var q=trayXY(j); s += coin(q.x, q.y, 26, 'trayCoin'+j); }
  document.getElementById('traySvg').innerHTML = s;
}
function startStage(k){
  S.stage=k; S.tries=0; lockNow();
  var n=PROBLEMS[k]||[1,1]; S.a=n[0]; S.b=n[1]; S.total=S.a+S.b;
  show('play');
  document.getElementById('stagePill').textContent='Stage '+k+' of '+STAGES;
  document.getElementById('numA').textContent=S.a;
  document.getElementById('numB').textContent=S.b;
  document.getElementById('numR').textContent='';
  ['A','B','R'].forEach(function(x){
    document.getElementById('box'+x).className='box';
    document.getElementById('coins'+x).innerHTML='';
    setCap('cap'+x, '');
  });
  document.getElementById('next').className='btn';
  document.getElementById('trayWrap').className='';
  document.getElementById('counter').className='';
  document.getElementById('counter').textContent='';
  drawTray(0, S.total);
  setMsg('');
  var o=document.getElementById('options'); o.className=''; o.innerHTML='';
  optionsFor(S.total).forEach(function(v){
    var b=document.createElement('button'); b.className='opt'; b.setAttribute('data-v', v);
    b.textContent=v; b.onclick=function(){ pick(v,b); }; o.appendChild(b);
  });
  unlockLater(450);
}
function pick(v, btn){
  if(S.lock) return; lockNow();
  var boxR=document.getElementById('boxR'), numR=document.getElementById('numR');
  numR.textContent=v;
  if(v===S.total){
    boxR.className='box green';
    setMsg('Nice work, Yuvaan!','good'); playClip('right');
    var c=centerOf(boxR); confetti(c.x, c.y-60, 26, 260);
    setTimeout(demo, 1150);
  } else {
    boxR.className='box red';
    btn.classList.add('empty');
    S.tries++;
    setMsg('Not quite right, Yuvaan. Try again!','bad'); playClip('wrong');
    setTimeout(function(){
      numR.textContent=''; boxR.className='box';
      btn.classList.remove('empty'); setMsg('');
      unlockLater(150);
    }, 1300);
  }
}
/* each number turns into that many coins, then the coins gather in the tray */
function demo(){
  document.getElementById('options').className='hide';
  var boxR=document.getElementById('boxR'), numR=document.getElementById('numR');
  numR.textContent=''; boxR.className='box';
  setMsg("Let's see what that means.", 'plain');

  /* reveal the coins inside one box, one coin at a time */
  function turnIntoCoins(letter, n, pfx, done){
    var box = document.getElementById('box'+letter), holder = document.getElementById('coins'+letter);
    holder.innerHTML = coinsSVG(n, pfx, 0);
    box.classList.add('showcoins');
    var shown = 0;
    (function step(){
      shown++;
      holder.innerHTML = coinsSVG(n, pfx, shown);
      setCap('cap'+letter, shown + (shown===1 ? ' coin' : ' coins'));
      if(shown < n) setTimeout(step, 300);
      else setTimeout(done, 480);
    })();
  }

  var landed = 0;
  function sendOne(srcId, done){
    var src = document.getElementById(srcId);
    var from = centerOf(src || document.getElementById('boxA'));
    if(src) src.setAttribute('opacity', '0');       /* it has left the box */
    drawTray(landed + 1, S.total);
    var target = document.getElementById('trayCoin' + landed);
    var to = centerOf(target);
    target.setAttribute('opacity', '0');
    var f = document.createElement('div');
    f.className = 'flyer';
    f.innerHTML = '<svg width="56" height="56" viewBox="0 0 100 100">' + coin(50,50,26) + '</svg>';
    document.getElementById('fly').appendChild(f);
    f.style.left = (from.x - 28) + 'px';
    f.style.top  = (from.y - 28) + 'px';
    f.style.transform = 'translate(0,0)';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      f.style.transform = 'translate(' + (to.x - from.x) + 'px,' + (to.y - from.y) + 'px)';
    });});
    setTimeout(function(){
      f.remove();
      target.setAttribute('opacity', '1');
      landed++;
      document.getElementById('counter').textContent = landed;
      done();
    }, 700);
  }
  function pour(pfx, i, n, after){
    if(i >= n){ after(); return; }
    sendOne(pfx + i, function(){ setTimeout(function(){ pour(pfx, i+1, n, after); }, 150); });
  }

  setTimeout(function(){
    turnIntoCoins('A', S.a, 'cA', function(){
      turnIntoCoins('B', S.b, 'cB', function(){
        setMsg('Now put them together.', 'plain');
        document.getElementById('trayWrap').className='show';
        document.getElementById('counter').className='show';
        document.getElementById('counter').textContent='0';
        drawTray(0, S.total);
        setTimeout(function(){
          pour('cA', 0, S.a, function(){
            setTimeout(function(){
              pour('cB', 0, S.b, function(){
                /* Put the coins back in both boxes, so the finished line reads whole:
                   [1 coin] + [1 coin] = 2, with the tray below proving the total. */
                document.getElementById('coinsA').innerHTML = coinsSVG(S.a, 'cA');
                document.getElementById('coinsB').innerHTML = coinsSVG(S.b, 'cB');
                numR.textContent = S.total;
                boxR.className = 'box gold';
                setCap('capR', S.total + (S.total===1 ? ' coin' : ' coins'));
                document.getElementById('counter').textContent = S.total + ' coins';
                setMsg(S.a + ' + ' + S.b + ' = ' + S.total + '  ·  Nice work, Yuvaan!', 'good');
                playClip('done');
                var cc = centerOf(document.getElementById('traySvg'));
                confetti(cc.x, cc.y - 30, 40, 420);
                var stars = S.tries===0 ? 3 : (S.tries===1 ? 2 : 1);
                if(!S.stars[S.stage] || S.stars[S.stage] < stars) S.stars[S.stage] = stars;
                save();
                document.getElementById('next').className = 'btn show';
                S.lock = false;
              });
            }, 380);
          });
        }, 500);
      });
    });
  }, 550);
}
document.getElementById('next').onclick=function(){
  if(S.lock) return;
  if(S.stage>=STAGES){ finish(); return; }
  startStage(S.stage+1);
};
document.getElementById('backBtn').onclick=function(){ drawMap(); show('map'); };
document.getElementById('voiceBtn').onclick=function(){
  S.voice=!S.voice; save();
  this.innerHTML = S.voice ? '🔊' : '🔇';
  this.className = S.voice ? 'on' : '';
  if(S.voice){ unlockAudio(); playClip('right'); } else if(node){ try{ node.stop(); }catch(e){} }
};
function finish(){
  var tot=0; for(var i=1;i<=STAGES;i++) tot+=(S.stars[i]||0);
  document.getElementById('finLine').textContent = tot+' of 60 stars collected. You never quit.';
  show('finish'); playClip('all');
  for(var k=0;k<3;k++) setTimeout(function(){ confetti(500,120,40,700); }, k*500);
}
document.getElementById('finMap').onclick=function(){ drawMap(); show('map'); };

load();
document.getElementById('voiceBtn').innerHTML = S.voice ? '🔊' : '🔇';
document.getElementById('voiceBtn').className = S.voice ? 'on' : '';
drawMap();
</script>
</body>
