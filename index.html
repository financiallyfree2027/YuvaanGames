<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yuvaan's Games</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#0d1428;color:#fff;overflow:hidden;
    font-family:'Comic Sans MS','Trebuchet MS',system-ui,sans-serif;}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:10px;}
  .screen.active{display:flex;}

  /* ---------- MENU ---------- */
  #menu{justify-content:center;gap:22px;background:radial-gradient(circle at 50% 25%,#1b2a55,#0d1428 70%);}
  #menuTitle{font-size:clamp(26px,7vw,44px);font-weight:bold;text-align:center;margin-bottom:4px;
    text-shadow:0 3px 0 rgba(0,0,0,.3);}
  #menuSub{color:#9fb4ff;font-size:clamp(13px,3.6vw,18px);margin-top:-14px;margin-bottom:8px;}
  #cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%;max-width:640px;}
  .card{width:min(42vw,260px);background:#141d3a;border-radius:26px;padding:16px;cursor:pointer;
    box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .08s;display:flex;flex-direction:column;
    align-items:center;gap:10px;border:3px solid rgba(255,255,255,.06);}
  .card:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.35);}
  .card svg{width:100%;height:auto;border-radius:18px;display:block;}
  .card .name{font-size:clamp(16px,4.4vw,24px);font-weight:bold;}
  .card .desc{font-size:clamp(11px,3vw,14px);color:#9db0d8;text-align:center;line-height:1.25;}

  /* ---------- shared game chrome ---------- */
  .ghead{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .homeBtn{background:#3b4a72;border:none;border-radius:14px;padding:10px 14px;color:#fff;font-family:inherit;
    font-weight:bold;font-size:clamp(15px,4vw,20px);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  .homeBtn:active,.muteBtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .muteBtn{background:#3b4a72;border:none;border-radius:14px;padding:10px 13px;color:#fff;font-size:20px;
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  .titleMid{text-align:center;flex:1;}
  .titleMid .t1{font-size:clamp(16px,4.4vw,24px);font-weight:bold;}
  .titleMid .t2{font-size:clamp(11px,3vw,15px);color:#9fb4ff;}
  button{font-family:inherit;}

  /* ---------- PHYSICS ---------- */
  #pDots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:520px;margin:8px 0 4px;}
  .pdot{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.16);font-size:11px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
  .pdot.done{background:#38b26b;}
  .pdot.cur{background:#ffd23f;color:#0d1428;box-shadow:0 0 8px #ffd23f;}
  #pStageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%;}
  #pcanvas{touch-action:none;background:linear-gradient(#1a2550,#0e1630);border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:100%;max-height:100%;}
  #pHint{text-align:center;color:#cbd5e1;font-size:clamp(13px,3.4vw,17px);padding:4px 16px;min-height:20px;}
  #pCtrl{display:flex;gap:10px;padding:6px 0 8px;justify-content:center;}
  #pCtrl button{font-weight:bold;border:none;border-radius:14px;padding:12px 20px;font-size:clamp(15px,4vw,20px);
    color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  #pCtrl button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  #pGo{background:#4ade80;color:#06331a;}
  #pClear{background:#64748b;}

  /* ---------- XO ---------- */
  #xDots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:520px;margin:8px 0 4px;}
  .xdot{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.16);font-size:9px;
    display:flex;align-items:center;justify-content:center;color:#0d1428;cursor:pointer;}
  .xdot.unlocked{background:#5b8cff;color:#fff;}
  .xdot.cur{background:#ffd23f;color:#0d1428;box-shadow:0 0 8px #ffd23f;}
  .xdot.locked{cursor:not-allowed;}
  #xTurn{font-size:clamp(14px,3.8vw,20px);margin:6px 0;min-height:24px;text-align:center;}
  #xboard{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:min(2.2vw,10px);width:min(88vw,46vh,400px);height:min(88vw,46vh,400px);margin:2px 0;}
  .cell{background:#1c2749;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:min(14vw,60px);font-weight:bold;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);
    transition:transform .05s;overflow:hidden;}
  .cell:active{transform:scale(.96);}
  .cell.x{color:#4dd0ff;} .cell.o{color:#ff7a7a;} .cell.win{background:#2f7d4f;}
  #xCtrl{display:flex;gap:10px;margin-top:12px;}
  #xNew{background:#64748b;border:none;border-radius:14px;padding:12px 20px;color:#fff;font-weight:bold;
    font-size:clamp(15px,4vw,20px);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  #xNew:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  #xTip{font-size:clamp(12px,3.2vw,15px);color:#8ea0c8;text-align:center;margin-top:10px;max-width:420px;}

  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(6,10,26,.8);z-index:20;}
  #card2{background:#fff;color:#1e293b;border-radius:24px;padding:24px;text-align:center;max-width:86%;
    box-shadow:0 12px 40px rgba(0,0,0,.5);}
  #card2 h1{margin:4px 0 6px;font-size:clamp(22px,6vw,36px);}
  #card2 p{margin:6px 0 16px;font-size:clamp(14px,3.8vw,19px);color:#475569;}
  #oEmoji{font-size:clamp(44px,13vw,72px);}
  #card2 button{background:#4ade80;color:#06331a;border:none;border-radius:14px;padding:12px 20px;
    font-weight:bold;font-size:clamp(15px,4vw,20px);cursor:pointer;margin:4px;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  #card2 button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .float{animation:bob 1.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<div id="menu" class="screen">
  <div id="menuTitle">🎮 Yuvaan's Games</div>
  <div id="menuSub">Pick a game to play!</div>
  <div id="cards">
    <div class="card" id="cardPhysics">
      <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#12b8a6"/><stop offset="1" stop-color="#0e6ad1"/></linearGradient></defs>
        <rect width="200" height="150" fill="url(#gp)"/>
        <path d="M20 40 Q90 60 150 110" stroke="#ffe08a" stroke-width="9" fill="none" stroke-linecap="round"/>
        <circle cx="34" cy="34" r="13" fill="#ff5d5d"/>
        <circle cx="30" cy="30" r="4" fill="rgba(255,255,255,.6)"/>
        <path d="M132 112 L128 140 L172 140 L168 112 Z" fill="#ffd23f" stroke="#fff" stroke-width="3"/>
        <text x="100" y="24" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">DRAW A SLIDE</text>
      </svg>
      <div class="name">Draw a Slide</div>
      <div class="desc">Draw a line to roll the ball into the cup — 10 stages</div>
    </div>
    <div class="card" id="cardXO">
      <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="gx" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8a63d2"/><stop offset="1" stop-color="#ff7a7a"/></linearGradient></defs>
        <rect width="200" height="150" fill="url(#gx)"/>
        <g stroke="rgba(255,255,255,.85)" stroke-width="5" stroke-linecap="round">
          <line x1="78" y1="34" x2="78" y2="116"/><line x1="122" y1="34" x2="122" y2="116"/>
          <line x1="55" y1="61" x2="145" y2="61"/><line x1="55" y1="89" x2="145" y2="89"/>
        </g>
        <g stroke="#4dd0ff" stroke-width="7" stroke-linecap="round">
          <line x1="60" y1="40" x2="72" y2="55"/><line x1="72" y1="40" x2="60" y2="55"/></g>
        <circle cx="100" cy="75" r="9" fill="none" stroke="#ffe08a" stroke-width="6"/>
        <g stroke="#4dd0ff" stroke-width="7" stroke-linecap="round">
          <line x1="128" y1="95" x2="140" y2="110"/><line x1="140" y1="95" x2="128" y2="110"/></g>
      </svg>
      <div class="name">X and O</div>
      <div class="desc">Beat the computer — 20 levels, gets harder!</div>
    </div>
  </div>
</div>

<!-- ================= PHYSICS ================= -->
<div id="physics" class="screen">
  <div class="ghead">
    <button class="homeBtn" data-home>🏠</button>
    <div class="titleMid"><div class="t1" id="pTitle">Stage 1</div><div class="t2" id="pTries">Tries: 0</div></div>
    <button class="muteBtn" data-mute>🔊</button>
  </div>
  <div id="pDots"></div>
  <div id="pStageWrap"><canvas id="pcanvas" width="800" height="600"></canvas></div>
  <div id="pHint"></div>
  <div id="pCtrl"><button id="pClear">Clear ✏️</button><button id="pGo">GO! ▶</button></div>
</div>

<!-- ================= XO ================= -->
<div id="xo" class="screen">
  <div class="ghead">
    <button class="homeBtn" data-home>🏠</button>
    <div class="titleMid"><div class="t1" id="xLvl">Level 1 / 20</div><div class="t2" id="xDiff">Medium</div></div>
    <button class="muteBtn" data-mute>🔊</button>
  </div>
  <div style="font-size:clamp(12px,3.2vw,16px);background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;margin-top:4px" id="xTries">Tries: 0</div>
  <div id="xDots"></div>
  <div id="xTurn">Your turn — you are X</div>
  <div id="xboard"></div>
  <div id="xCtrl"><button id="xNew">New Game 🔄</button></div>
  <div id="xTip"></div>
</div>

<!-- ================= OVERLAY ================= -->
<div id="overlay"><div id="card2">
  <div id="oEmoji" class="float">🎉</div>
  <h1 id="oTitle"></h1>
  <p id="oMsg"></p>
  <div id="oBtns"></div>
</div></div>

<script>
(function(){
"use strict";

/* ================= PERSISTENCE ================= */
const store = { last:'menu', pStage:0, pMax:0, xoLevel:1, xoUnlocked:1 };
function loadStore(){ try{ Object.assign(store, JSON.parse(localStorage.getItem('yuvaanArcade')||'{}')); }catch(e){} }
function saveStore(){ try{ localStorage.setItem('yuvaanArcade', JSON.stringify(store)); }catch(e){} }

/* ================= SOUND + VOICE (shared) ================= */
let muted=false, actx=null;
function primeAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(freq,dur,vol){
  if(muted) return;
  try{ primeAudio();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.22,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function slide(f1,f2,dur){
  if(muted) return;
  try{ primeAudio();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function chord(notes){ notes.forEach((f,i)=>setTimeout(()=>beep(f,0.28,0.2), i*110)); }
function say(text){
  if(muted || !('speechSynthesis' in window)) return;
  try{ window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=0.95; u.pitch=1.2; u.volume=1; u.lang='en-US';
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function setMuteIcons(){ document.querySelectorAll('[data-mute]').forEach(b=>b.textContent=muted?'🔇':'🔊'); }
document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=function(){
  muted=!muted; setMuteIcons();
  if(muted && 'speechSynthesis' in window){ try{window.speechSynthesis.cancel();}catch(e){} }
  else { primeAudio(); beep(660,0.1); }
});

/* ================= SHARED OVERLAY ================= */
function showOverlay(emoji,title,msg,btns){
  document.getElementById('oEmoji').textContent=emoji;
  document.getElementById('oTitle').textContent=title;
  document.getElementById('oMsg').textContent=msg;
  const box=document.getElementById('oBtns'); box.innerHTML='';
  for(const b of btns){ const el=document.createElement('button'); el.textContent=b.t; el.onclick=b.fn; box.appendChild(el); }
  document.getElementById('overlay').style.display='flex';
}
function hideOverlay(){ document.getElementById('overlay').style.display='none'; }

/* ================= SCREEN MANAGER ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  Physics.active = (id==='physics');
  hideOverlay();
}
function goMenu(){ store.last='menu'; saveStore(); primeAudio(); beep(520,0.1); showScreen('menu'); }
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=goMenu);

document.getElementById('cardPhysics').onclick=()=>{ primeAudio(); beep(600,0.1); Physics.open(store.pStage||0); };
document.getElementById('cardXO').onclick=()=>{ primeAudio(); beep(700,0.1); XO.open(store.xoLevel||1); };

/* ================================================================
   PHYSICS GAME
================================================================ */
const Physics = (function(){
  const W=800,H=600,FLOOR=520,WALLX0=30,WALLX1=770,CUP_HALF=60,CUP_H=70;
  const G=1500,REST=0.22,FRICT=0.995;
  const canvas=document.getElementById('pcanvas'), ctx=canvas.getContext('2d');
  const LEVELS=[
    {spout:400,color:'#ff5d5d',cup:400,walls:[],pegs:[],hint:"Just press GO — watch the ball drop into the cup!"},
    {spout:180,color:'#4dd0ff',cup:560,walls:[],pegs:[],hint:"Draw a slide from the ball down to the cup."},
    {spout:620,color:'#ffd23f',cup:170,walls:[],pegs:[],hint:"Draw a slide going the other way this time."},
    {spout:200,color:'#ff5d5d',cup:600,walls:[{x:400,top:360}],pegs:[],hint:"A wall! Slide the ball OVER the top of it."},
    {spout:610,color:'#4ade80',cup:150,walls:[{x:360,top:330}],pegs:[],hint:"Slide over the wall and down to the cup."},
    {spout:150,color:'#4dd0ff',cup:650,walls:[{x:300,top:340},{x:520,top:300}],pegs:[],hint:"Two walls! Make a zig-zag slide over both."},
    {spout:400,color:'#c77dff',cup:130,walls:[{x:250,top:300}],pegs:[{x:520,y:300,r:26}],hint:"Dodge the ball around the round peg."},
    {spout:660,color:'#ffd23f',cup:150,walls:[{x:470,top:280}],pegs:[{x:300,y:360,r:26}],hint:"Over the wall, past the peg, into the cup."},
    {spout:180,color:'#ff5d5d',cup:660,walls:[{x:340,top:300},{x:540,top:360}],pegs:[{x:440,y:250,r:24}],hint:"Careful and slow — plan your slide!"},
    {spout:400,color:'#4ade80',cup:400,walls:[{x:230,top:300},{x:570,top:300}],pegs:[{x:400,y:250,r:28}],hint:"The big finish! Guide it right down the middle."}
  ];
  let levelIndex=0, strokes=[], curStroke=null, ball=null, running=false, tries=0, restFrames=0;
  let lastBounce=0;

  function levelSegments(L){
    const s=[], cx=L.cup;
    s.push({x1:WALLX0,y1:0,x2:WALLX0,y2:FLOOR});
    s.push({x1:WALLX1,y1:0,x2:WALLX1,y2:FLOOR});
    s.push({x1:WALLX0,y1:FLOOR,x2:cx-CUP_HALF,y2:FLOOR});
    s.push({x1:cx+CUP_HALF,y1:FLOOR,x2:WALLX1,y2:FLOOR});
    s.push({x1:cx-CUP_HALF,y1:FLOOR,x2:cx-CUP_HALF,y2:FLOOR+CUP_H});
    s.push({x1:cx-CUP_HALF,y1:FLOOR+CUP_H,x2:cx+CUP_HALF,y2:FLOOR+CUP_H});
    s.push({x1:cx+CUP_HALF,y1:FLOOR+CUP_H,x2:cx+CUP_HALF,y2:FLOOR});
    for(const w of L.walls){ s.push({x1:w.x,y1:w.top,x2:w.x,y2:FLOOR}); s.push({x1:w.x-6,y1:w.top,x2:w.x+6,y2:w.top}); }
    return s;
  }
  function allSegments(){
    const s=levelSegments(LEVELS[levelIndex]).slice();
    for(const st of strokes) for(let i=0;i<st.length-1;i++) s.push({x1:st[i].x,y1:st[i].y,x2:st[i+1].x,y2:st[i+1].y});
    return s;
  }
  function resetBall(){ const L=LEVELS[levelIndex]; ball={x:L.spout,y:70,vx:0,vy:0,r:16}; running=false; restFrames=0; }

  function closestOnSeg(px,py,s){ const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy||1e-6;
    let t=((px-s.x1)*dx+(py-s.y1)*dy)/l2; t=Math.max(0,Math.min(1,t)); return{x:s.x1+t*dx,y:s.y1+t*dy}; }
  function collideSeg(b,s){ const c=closestOnSeg(b.x,b.y,s); let nx=b.x-c.x,ny=b.y-c.y,d=Math.hypot(nx,ny);
    if(d<b.r){ if(d<1e-4){nx=0;ny=-1;d=1;} nx/=d;ny/=d; b.x=c.x+nx*b.r; b.y=c.y+ny*b.r;
      const vn=b.vx*nx+b.vy*ny; if(vn<0){ if(-vn>140){ const now=performance.now(); if(now-lastBounce>90){lastBounce=now; beep(300+Math.min(400,-vn),0.05,0.12);} }
        b.vx-=(1+REST)*vn*nx; b.vy-=(1+REST)*vn*ny; b.vx*=FRICT; b.vy*=FRICT; } } }
  function collidePeg(b,p){ let nx=b.x-p.x,ny=b.y-p.y,d=Math.hypot(nx,ny),m=b.r+p.r;
    if(d<m){ if(d<1e-4){nx=0;ny=-1;d=1;} nx/=d;ny/=d; b.x=p.x+nx*m; b.y=p.y+ny*m;
      const vn=b.vx*nx+b.vy*ny; if(vn<0){ b.vx-=(1+REST)*vn*nx; b.vy-=(1+REST)*vn*ny; b.vx*=FRICT; b.vy*=FRICT; } } }
  function step(dt){
    const segs=allSegments(), pegs=LEVELS[levelIndex].pegs, cx=LEVELS[levelIndex].cup;
    const SUB=8, h=dt/SUB;
    for(let k=0;k<SUB;k++){ ball.vy+=G*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h;
      for(const s of segs) collideSeg(ball,s); for(const p of pegs) collidePeg(ball,p);
      if(ball.x>cx-CUP_HALF && ball.x<cx+CUP_HALF && ball.y>FLOOR-55) ball.vx*=0.75; }
  }

  function draw(){
    const L=LEVELS[levelIndex]; ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#26356b'; ctx.fillRect(WALLX0,FLOOR,WALLX1-WALLX0,8);
    ctx.fillStyle='#33437d'; ctx.fillRect(WALLX0-8,0,8,FLOOR+8); ctx.fillRect(WALLX1,0,8,FLOOR+8);
    ctx.fillStyle='#8a63d2';
    for(const w of L.walls){ ctx.fillRect(w.x-6,w.top,12,FLOOR-w.top); ctx.beginPath(); ctx.arc(w.x,w.top,7,0,7); ctx.fill(); }
    for(const p of L.pegs){ ctx.fillStyle='#ff9f1c'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(p.x-p.r*.3,p.y-p.r*.3,p.r*.4,0,7); ctx.fill(); }
    const cx=L.cup;
    ctx.fillStyle=L.color; ctx.globalAlpha=0.9; ctx.beginPath();
    ctx.moveTo(cx-CUP_HALF,FLOOR); ctx.lineTo(cx-CUP_HALF+6,FLOOR+CUP_H); ctx.lineTo(cx+CUP_HALF-6,FLOOR+CUP_H);
    ctx.lineTo(cx+CUP_HALF,FLOOR); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle='#fff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(cx-CUP_HALF-3,FLOOR); ctx.lineTo(cx-CUP_HALF+2,FLOOR); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+CUP_HALF-2,FLOOR); ctx.lineTo(cx+CUP_HALF+3,FLOOR); ctx.stroke();
    ctx.fillStyle='#94a3b8'; ctx.fillRect(L.spout-24,30,48,16);
    ctx.strokeStyle='#ffe08a'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
    for(const s of strokes){ if(s.length<2){ if(s.length===1){ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(s[0].x,s[0].y,4,0,7);ctx.fill();} continue; }
      ctx.beginPath(); ctx.moveTo(s[0].x,s[0].y); for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y); ctx.stroke(); }
    ctx.fillStyle=L.color; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(ball.x-5,ball.y-5,5,0,7); ctx.fill();
  }

  function pWin(){
    if(levelIndex>store.pMax) store.pMax=levelIndex;
    saveStore();
    chord([523,659,784]); say(levelIndex>=LEVELS.length-1?'You finished all ten stages! Amazing, Yuvaan!':'You did it! Great job!');
    const last=levelIndex>=LEVELS.length-1;
    renderDots();
    showOverlay(last?'🏆':'🎉', last?'ALL 10 STAGES DONE!':'Stage Cleared!',
      last?'You never gave up, Yuvaan — every single stage! So proud of you.':'Clever slide! On to the next one.',
      last?[{t:'Play Again 🔄',fn:()=>loadStage(0)},{t:'🏠 Menu',fn:goMenu}]
          :[{t:'Next Stage ▶',fn:()=>loadStage(levelIndex+1)},{t:'Replay',fn:()=>{strokes=[];resetBall();hideOverlay();}}]);
  }
  function pMiss(){
    beep(180,0.35,0.22); say('So close! Never quit. Try again!');
    showOverlay('🙂','Try Again!','Never quit — fix your slide a little and go again. 💪',
      [{t:'Keep My Slide ✏️',fn:()=>{resetBall();hideOverlay();}},{t:'Start Fresh 🧽',fn:()=>{strokes=[];resetBall();hideOverlay();}}]);
  }

  function renderDots(){
    const box=document.getElementById('pDots'); box.innerHTML='';
    for(let i=0;i<LEVELS.length;i++){ const d=document.createElement('div');
      d.className='pdot'+(i===levelIndex?' cur':(i<=store.pMax?' done':'')); d.textContent=i+1;
      d.onclick=()=>loadStage(i); box.appendChild(d); }
  }
  function loadStage(i){
    levelIndex=i; strokes=[]; curStroke=null; resetBall();
    store.pStage=i; store.last='physics'; saveStore();
    document.getElementById('pTitle').textContent='Stage '+(i+1);
    document.getElementById('pTries').textContent='Tries: '+tries;
    document.getElementById('pHint').textContent=LEVELS[i].hint;
    renderDots(); hideOverlay();
  }

  // input
  function toCanvas(e){ const r=canvas.getBoundingClientRect();
    const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left, py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return {x:px*(W/r.width), y:py*(H/r.height)}; }
  canvas.addEventListener('mousedown',startDraw); canvas.addEventListener('mousemove',moveDraw); window.addEventListener('mouseup',endDraw);
  canvas.addEventListener('touchstart',startDraw,{passive:false}); canvas.addEventListener('touchmove',moveDraw,{passive:false}); window.addEventListener('touchend',endDraw);
  function startDraw(e){ if(running||!api.active) return; e.preventDefault(); primeAudio(); beep(880,0.05,0.1); curStroke=[toCanvas(e)]; strokes.push(curStroke); }
  function moveDraw(e){ if(!curStroke||running) return; e.preventDefault(); const p=toCanvas(e), l=curStroke[curStroke.length-1];
    if(Math.hypot(p.x-l.x,p.y-l.y)>5) curStroke.push(p); }
  function endDraw(){ curStroke=null; }

  document.getElementById('pGo').onclick=function(){ if(running||!api.active) return; tries++;
    document.getElementById('pTries').textContent='Tries: '+tries; resetBall(); running=true; slide(300,700,0.25); };
  document.getElementById('pClear').onclick=function(){ if(running) return; strokes=[]; curStroke=null; resetBall(); };

  let lastTs=0;
  function frame(ts){
    const dt=Math.min(0.032,(ts-lastTs)/1000||0.016); lastTs=ts;
    if(api.active){
      if(running){
        step(dt);
        const spd=Math.hypot(ball.vx,ball.vy), cx=LEVELS[levelIndex].cup;
        const overCup=ball.x>cx-CUP_HALF+2 && ball.x<cx+CUP_HALF-2;
        if(spd<12) restFrames++; else restFrames=0;
        if(overCup && ball.y>FLOOR+8 && spd<120){ running=false; pWin(); }
        else if(restFrames>40){ if(overCup && ball.y>FLOOR-90){ running=false; pWin(); } else { running=false; pMiss(); } }
        else if(ball.y>H+120){ running=false; pMiss(); }
      }
      draw();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const api={ active:false,
    open(i){ tries=0; loadStage(i); showScreen('physics'); lastTs=performance.now(); },
  };
  return api;
})();

/* ================================================================
   X AND O GAME
================================================================ */
const XO = (function(){
  const HUMAN='X', AI='O';
  const WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, turn, over, level=1, attempts={}, busy=false;
  const boardEl=document.getElementById('xboard');

  function epsilon(L){ return Math.max(0.05, 0.55 - 0.50*(L-1)/19); }
  function diffName(L){ return L<=5?'Medium':L<=10?'Tricky':L<=15?'Hard':L<=19?'Very Hard':'SUPER HARD 🔥'; }
  function winnerOf(b){ for(const w of WINS){ const[a,c,d]=w; if(b[a]&&b[a]===b[c]&&b[a]===b[d]) return{who:b[a],line:w}; }
    if(b.every(v=>v)) return{who:'draw',line:null}; return null; }
  function empties(b){ const r=[]; for(let i=0;i<9;i++) if(!b[i]) r.push(i); return r; }
  function minimax(b,p){ const res=winnerOf(b);
    if(res){ if(res.who===AI) return{score:10}; if(res.who===HUMAN) return{score:-10}; return{score:0}; }
    const ms=empties(b); let best=p===AI?{score:-Infinity}:{score:Infinity};
    for(const m of ms){ b[m]=p; const s=minimax(b,p===AI?HUMAN:AI).score; b[m]='';
      if(p===AI){ if(s>best.score) best={score:s,move:m}; } else { if(s<best.score) best={score:s,move:m}; } }
    return best; }
  function aiMove(){ const ms=empties(board); if(!ms.length) return;
    if(Math.random()<epsilon(level)) return ms[Math.floor(Math.random()*ms.length)];
    return minimax(board.slice(),AI).move; }

  function buildBoard(){ boardEl.innerHTML=''; for(let i=0;i<9;i++){ const c=document.createElement('div');
    c.className='cell'; c.onclick=()=>tap(i); boardEl.appendChild(c); } }
  function render(winLine){ const cells=boardEl.children;
    for(let i=0;i<9;i++){ const c=cells[i]; c.textContent=board[i]||'';
      c.className='cell'+(board[i]==='X'?' x':board[i]==='O'?' o':''); if(winLine&&winLine.includes(i)) c.classList.add('win'); } }
  function renderDots(){ const box=document.getElementById('xDots'); box.innerHTML='';
    for(let i=1;i<=20;i++){ const d=document.createElement('div');
      d.className='xdot '+(i===level?'cur':i<=store.xoUnlocked?'unlocked':'locked'); d.textContent=i;
      if(i<=store.xoUnlocked) d.onclick=()=>{ level=i; start(); }; box.appendChild(d); } }
  function updateHead(){ document.getElementById('xLvl').textContent='Level '+level+' / 20';
    document.getElementById('xDiff').textContent=diffName(level);
    document.getElementById('xTries').textContent='Tries: '+(attempts[level]||0);
    const tips=['Play fair and think before you tap. 🧠',
      'Tip: make TWO ways to win at once — the computer can only block one!',
      'Take the middle square when you can. It is the strongest spot.',
      'Watch the computer — block it if it has two in a row!',
      'Never quit. Every try makes you smarter. 💪'];
    document.getElementById('xTip').textContent=tips[Math.min(4,Math.floor((level-1)/4))]; }

  function start(announce){ board=Array(9).fill(''); turn=HUMAN; over=false; busy=false;
    buildBoard(); render(); renderDots(); updateHead();
    document.getElementById('xTurn').textContent='Your turn — you are X';
    store.xoLevel=level; store.last='xo'; saveStore(); hideOverlay();
    if(announce===true) say('Level '+level+'! You can do it.'); }

  function tap(i){ if(over||busy||board[i]||turn!==HUMAN) return;
    primeAudio(); beep(660,0.12); board[i]=HUMAN; render();
    let r=winnerOf(board); if(r) return finish(r);
    turn=AI; busy=true; document.getElementById('xTurn').textContent='Computer is thinking… 🤔';
    setTimeout(()=>{ const m=aiMove(); if(m!=null){ board[m]=AI; render(); beep(392,0.14); }
      let r2=winnerOf(board); if(r2) return finish(r2);
      turn=HUMAN; busy=false; document.getElementById('xTurn').textContent='Your turn — you are X'; },380); }

  const WINM=['Clever thinking! You made a winning plan. 🌟','You beat the computer — awesome! 🏆','Smart double-attack! Well done. 🎯','You did it! Sharp mind, Yuvaan. 💡'];
  const LOSEM=['The computer got you this time. Never quit — try again! 💪','Good fight! Look for two-in-a-rows next time. 🔍','Almost! Keep trying — champions never give up. 🌟'];
  const DRAWM=['A tie! Great defense. Now try a double-attack to WIN. 🤔','Nobody won — so close! Try setting two traps at once. 🎯','Good tie! One clever move and it is a win next time. 💡'];

  function finish(r){ over=true; busy=false; attempts[level]=(attempts[level]||0)+1; updateHead(); render(r.line);
    if(r.who===HUMAN) win(); else if(r.who===AI) lose(); else draw(); }
  function win(){ const last=level>=20; if(level>=store.xoUnlocked && level<20) store.xoUnlocked=level+1; saveStore();
    chord(last?[523,659,784,1047]:[523,659,784]); say(last?'You beat all twenty levels! Amazing, Yuvaan!':'You win! Great job, Yuvaan!');
    showOverlay(last?'🏆':'🎉', last?'YOU BEAT ALL 20!':'You Win!',
      last?'You cleared every level — even SUPER HARD! So proud of you, Yuvaan!':WINM[Math.floor(Math.random()*WINM.length)],
      last?[{t:'Play Again 🔄',fn:()=>{level=1;start();}},{t:'🏠 Menu',fn:goMenu}]
          :[{t:'Next Level ▶',fn:()=>{level++;start(true);}},{t:'Replay',fn:()=>start()}]); }
  function lose(){ beep(180,0.4,0.25); say('Oh no! Never give up. Try again!');
    showOverlay('🙂','Try Again!',LOSEM[Math.floor(Math.random()*LOSEM.length)],[{t:'Try Again 💪',fn:()=>start()}]); }
  function draw(){ beep(300,0.3,0.2); say("It's a tie! So close. Try again!");
    showOverlay('🤝','So Close!',DRAWM[Math.floor(Math.random()*DRAWM.length)],[{t:'Try Again 🎯',fn:()=>start()}]); }

  document.getElementById('xNew').onclick=()=>start();

  return { open(i){ level=Math.min(store.xoUnlocked, i||1); attempts={}; showScreen('xo'); start(); } };
})();

/* ================= BOOT ================= */
loadStore();
setMuteIcons();
if(store.last==='physics') Physics.open(store.pStage||0);
else if(store.last==='xo') XO.open(store.xoLevel||1);
else showScreen('menu');

})();
</script>
