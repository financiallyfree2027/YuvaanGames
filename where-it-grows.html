<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Where Does It Grow? — for Yuvaan</title>
<style>
  :root{
    --cream:#f6f2ea; --card:#fff; --line:#e4dfd3; --ink:#1c2420; --muted:#7b8580;
    --green:#2a9a68; --green-deep:#1f7d54; --green-pale:#e6f4ec; --green-border:#bfe3cf;
    --coral:#e56b62; --coral-pale:#fbe9e7;
    --gold:#f2b134; --gold-deep:#d4901c; --gold-pale:#fdf1d8;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--cream);
    font-family:var(--sans);color:var(--ink);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}

  #board{position:absolute;left:50%;top:50%;width:1000px;height:640px;
    transform:translate(-50%,-50%);transform-origin:50% 50%;
    background:var(--cream);border-radius:26px;overflow:hidden;}

  /* ---------------- header ---------------- */
  #head{position:absolute;left:0;top:0;width:1000px;height:58px;display:flex;
    align-items:center;gap:14px;padding:0 18px;}
  #ttl{font-family:var(--serif);font-size:25px;font-weight:600;white-space:nowrap;}
  #prog{flex:1;display:flex;align-items:center;gap:10px;}
  #bar{flex:1;height:13px;background:#e8e2d6;border-radius:99px;overflow:hidden;max-width:330px;}
  #barIn{height:100%;width:0;background:linear-gradient(90deg,var(--green),#48bd86);
    border-radius:99px;transition:width .45s cubic-bezier(.2,.9,.3,1);}
  #cnt{font-size:15px;font-weight:800;color:var(--muted);white-space:nowrap;}
  #stars{font-size:19px;font-weight:800;color:var(--gold-deep);white-space:nowrap;}
  .hbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;
    font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .hbtn:active{transform:translateY(2px);}
  .hbtn.off{opacity:.42;}

  /* ---------------- basket ---------------- */
  #top{position:absolute;left:0;top:58px;width:1000px;height:140px;}
  #basket{position:absolute;left:50%;top:72px;transform:translateX(-50%);width:100px;height:79px;}
  #item{position:absolute;left:50%;top:0;width:96px;height:96px;margin-left:-48px;
    cursor:pointer;transition:none;z-index:3;}
  #item svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 6px 10px rgba(60,45,20,.22));}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #item.bob{animation:float 2.4s ease-in-out infinite;}
  @keyframes rise{0%{transform:translateY(58px) scale(.35);opacity:0}
    60%{transform:translateY(-10px) scale(1.1);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
  #item.rise{animation:rise .55s cubic-bezier(.3,1.2,.4,1);}
  @keyframes nope{0%,100%{transform:translateX(0) rotate(0)}
    18%{transform:translateX(-13px) rotate(-7deg)}38%{transform:translateX(12px) rotate(6deg)}
    58%{transform:translateX(-8px) rotate(-4deg)}78%{transform:translateX(6px) rotate(3deg)}}
  #item.nope{animation:nope .5s;}

  /* ---------------- message ---------------- */
  #msg{position:absolute;left:0;top:212px;width:1000px;height:34px;text-align:center;
    font-family:var(--serif);font-size:25px;font-weight:600;line-height:34px;
    opacity:0;transition:opacity .18s;}
  #msg.on{opacity:1;}
  #msg.nm{color:var(--ink);} #msg.ok{color:var(--green-deep);} #msg.no{color:var(--coral);}

  /* ---------------- scene ---------------- */
  #scene{position:absolute;left:30px;top:246px;width:940px;height:390px;
    border-radius:20px;overflow:hidden;border:3px solid #dcd5c6;}
  .band{position:absolute;left:0;width:940px;cursor:pointer;}
  .band .bg{position:absolute;left:0;top:0;width:940px;height:100%;pointer-events:none;}
  #bTree  {top:0;    height:178px;background:linear-gradient(#d9eefb,#eef7fd);}
  #bGround{top:178px; height:68px; background:linear-gradient(#8fcf7e,#63b25a);}
  #bUnder {top:246px; height:144px;background:linear-gradient(#b98756,#8d6340);}
  .tab{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.82);border-radius:999px;padding:5px 14px 5px 7px;
    font-size:14px;font-weight:800;color:#3d4a42;pointer-events:none;
    box-shadow:0 2px 6px rgba(0,0,0,.09);}
  #bGround .tab{top:8px;} #bUnder .tab{top:10px;}
  .tab svg{width:26px;height:26px;display:block;}
  .band .hit{position:absolute;inset:0;}
  .band.win  {box-shadow:inset 0 0 0 6px var(--green);}
  .band.lose {box-shadow:inset 0 0 0 6px var(--coral);}
  @keyframes hint{0%,100%{box-shadow:inset 0 0 0 0 rgba(242,177,52,0)}
    50%{box-shadow:inset 0 0 0 7px rgba(242,177,52,.95)}}
  .band.hint{animation:hint 1.15s ease-in-out infinite;}
  .grown{position:absolute;width:52px;height:52px;pointer-events:none;}
  .grown svg{width:100%;height:100%;display:block;}
  @keyframes land{0%{transform:scale(1.25)}55%{transform:scale(.86)}100%{transform:scale(1)}}
  .grown.land{animation:land .4s;}

  /* flying copy */
  #fly{position:absolute;width:96px;height:96px;pointer-events:none;display:none;z-index:6;}
  #fly svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 6px 10px rgba(60,45,20,.25));}

  /* star burst */
  .spark{position:absolute;font-size:26px;pointer-events:none;z-index:7;}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

  /* ---------------- panels ---------------- */
  #veil{position:absolute;inset:0;background:rgba(28,36,32,.42);display:none;z-index:20;}
  #veil.on{display:block;}
  .panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:600px;
    background:#fff;border-radius:26px;padding:34px 40px;text-align:center;
    box-shadow:0 24px 60px rgba(30,24,12,.28);}
  .panel h2{font-family:var(--serif);font-size:38px;font-weight:600;margin:0 0 8px;}
  .panel p{font-size:18px;color:var(--muted);margin:0 0 22px;line-height:1.55;}
  .panel .big{font-size:30px;color:var(--gold-deep);font-weight:800;margin:0 0 18px;}
  .btn{border:0;border-radius:16px;padding:15px 34px;font-size:20px;font-weight:800;
    font-family:var(--sans);cursor:pointer;background:var(--green);color:#fff;
    box-shadow:0 5px 0 var(--green-deep);margin:0 6px;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-deep);}
  .btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 #ece6da;}
  .basketRow{display:flex;justify-content:center;gap:10px;margin:0 0 20px;flex-wrap:wrap;}
  .bchip{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:#fbf8f2;
    display:flex;align-items:center;justify-content:center;}
  .bchip svg{width:44px;height:44px;display:block;}
</style>
</head>
<body>
<div id="board">
  <div id="head">
    <div id="ttl">Where Does It Grow?</div>
    <div id="prog"><div id="bar"><div id="barIn"></div></div><div id="cnt"></div></div>
    <div id="stars"></div>
    <button class="hbtn" id="voiceBtn" title="Sound on or off"><svg viewBox="0 0 24 24" width="21" height="21">
      <path d="M4 9h4l5-4v14l-5-4H4Z" fill="#1c2420"/>
      <g id="waves" fill="none" stroke="#1c2420" stroke-width="2" stroke-linecap="round">
        <path d="M16.5 9.2a4 4 0 0 1 0 5.6"/><path d="M19 6.8a7.5 7.5 0 0 1 0 10.4"/></g>
      <path id="mute" d="M16 9l6 6M22 9l-6 6" stroke="#e56b62" stroke-width="2.4"
        stroke-linecap="round" fill="none" style="display:none"/></svg></button>
    <button class="hbtn" id="resetBtn" title="Start again"><svg viewBox="0 0 24 24" width="21" height="21">
      <path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="#1c2420" stroke-width="2.4"
        stroke-linecap="round"/><path d="M20 3v5h-5" fill="none" stroke="#1c2420" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div id="top">
    <svg id="basket" viewBox="0 0 132 104" aria-hidden="true">
      <ellipse cx="66" cy="98" rx="50" ry="6" fill="#3a2a14" opacity=".16"/>

      <path d="M14 38h104l-2 12H16Z" fill="#e0a862"/>

        <path d="M27 54h78M30 68h72M33 82h66"/>
        <path d="M36 50l4 48M56 50l2 48M76 50l-2 48M96 50l-4 48"/>
      </g>
      <path d="M10 34h112a5 5 0 0 1 0 10H10a5 5 0 0 1 0-10Z" fill="#e0a862" stroke="#a9713a" stroke-width="2"/>
      <path d="M30 34C34 12 98 12 102 34" fill="none" stroke="#c98f4e" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div id="item"></div>
  </div>

  <div id="msg"></div>

  <div id="scene">
    <div class="band" id="bTree" data-z="tree"></div>
    <div class="band" id="bGround" data-z="ground"></div>
    <div class="band" id="bUnder" data-z="under"></div>
  </div>

  <div id="fly"></div>

  <div id="veil">
    <div class="panel" id="panel"></div>
  </div>
</div>

/* ------------------------------------------------------------ audio */
var AC = null, BUF = {}, decodeTried = false, voiceNode = null;
function b64ToBytes(d){
  var b = atob(d.split(',')[1]), n = b.length, a = new Uint8Array(n);
  for(var i = 0; i < n; i++) a[i] = b.charCodeAt(i);
  return a.buffer;
}
function initAudio(){
  if(AC || decodeTried) return;
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C){ decodeTried = true; return; }
  try{ AC = new C(); }catch(e){ decodeTried = true; return; }
  decodeTried = true;
  Object.keys(SND).forEach(function(k){
    try{ AC.decodeAudioData(b64ToBytes(SND[k]), function(b){ BUF[k] = b; }, function(){}); }
    catch(e){}
  });
}
function unlockAudio(){
  initAudio();
  if(AC && AC.state !== 'running' && AC.resume){ try{ AC.resume(); }catch(e){} }
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('touchstart', unlockAudio, true);

function play(key, gain, isVoice){
  if(!S.voice) return null;
  initAudio();
  if(!AC || !BUF[key]) return null;
  if(AC.state !== 'running' && AC.resume){ try{ AC.resume(); }catch(e){} }
  var src = AC.createBufferSource(); src.buffer = BUF[key];
  var g = AC.createGain(); g.gain.value = (gain === undefined ? 1 : gain);
  src.connect(g); g.connect(AC.destination);
  try{ src.start(0); }catch(e){ return null; }
  if(isVoice){
    if(voiceNode){ try{ voiceNode.stop(); }catch(e){} }
    voiceNode = src;
    src.onended = function(){ if(voiceNode === src) voiceNode = null; };
  }
  return src;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
var CHEER = ['cheer1','cheer2','cheer4'], TRYAG = ['try3','try2'];

var S = { order:[], i:0, tries:0, stars:0, best:{}, voice:true, lock:true, round:0, turn:0 };

function load(){
  try{
    var d = JSON.parse(localStorage.getItem(SAVE) || 'null');
    if(d && d.v === 1){

      S.voice = (d.voice === false) ? false : true;
    }
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(SAVE, JSON.stringify(
      { v:1, best:S.best, stars:S.stars, voice:S.voice }));
  }catch(e){}
}

/* Deal the 38 foods so the three places keep taking turns. Without this a
   run can hand him six tree fruits together and tapping the same band wins
   every time, which teaches him nothing. */
function deal(){
  var by = { tree:[], ground:[], under:[] };
  FOODS.forEach(function(f){ by[f.z].push(f); });
  Object.keys(by).forEach(function(z){
    var a = by[z];
    for(var i = a.length-1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
  });
  var left = { tree:by.tree.length, ground:by.ground.length, under:by.under.length };
  var total = FOODS.length, out = [], last = '', run = 0;
  while(out.length < total){
    var zones = ['tree','ground','under'].filter(function(z){
      if(!left[z]) return false;
      if(z === last && run >= 2) return false;         /* never three in a row */
      return true;
    });
    if(!zones.length) zones = ['tree','ground','under'].filter(function(z){ return left[z]; });
    /* whichever place has the most still waiting goes next */
    zones.sort(function(a, b){ return left[b] - left[a]; });
    var z = zones[0];
    if(zones.length > 1 && left[zones[1]] === left[z] && Math.random() < 0.5) z = zones[1];
    out.push(by[z][left[z]-1]); left[z]--;
    run = (z === last) ? run+1 : 1; last = z;
  }
  return out;
}

/* where a food lands once it has been placed correctly */
var SLOTS = { tree:0, ground:0, under:0 };
/* The left of every band carries its label, so nothing is ever planted before
   x=250 - otherwise the first few foods land behind the words. */
function slotFor(z){
  var n = SLOTS[z]++;
  if(z === 'tree'){                       /* 18 of them, two rows in the canopy */
    var col = n % 9;
    return [258 + col*(652/8), (n < 9 ? 62 : 126) + ((col % 2) ? 6 : -4)];
  }
  if(z === 'ground'){                     /* 10, sitting on the grass */
    return [258 + (n % 10)*(652/9), 34 + ((n % 2) ? 3 : 0)];
  }
  return [258 + (n % 10)*(652/9), 72 + ((n % 2) ? 8 : 0)];   /* 10, down in the soil */
}

/* ------------------------------------------------------------ dom */
var board = document.getElementById('board'),
    itemEl = document.getElementById('item'),
    msgEl  = document.getElementById('msg'),
    flyEl  = document.getElementById('fly'),
    scene  = document.getElementById('scene'),
    veil   = document.getElementById('veil'),
    panel  = document.getElementById('panel'),
    barIn  = document.getElementById('barIn'),
    cntEl  = document.getElementById('cnt'),
    starEl = document.getElementById('stars'),
    bands  = { tree:document.getElementById('bTree'),
               ground:document.getElementById('bGround'),
               under:document.getElementById('bUnder') };

function svgOf(k){ return '<svg viewBox="0 0 100 100">' + ART[k] + '</svg>'; }
function cur(){ return S.order[S.i]; }

function paintHud(){
  var done = S.i, total = S.order.length;
  barIn.style.width = (done/total*100) + '%';
  cntEl.textContent = done + ' / ' + total;
  starEl.textContent = '⭐ ' + S.stars;
}

/* ------------------------------------------------------------ turns */
function nextItem(){
  if(S.i >= S.order.length){ finish(); return; }
  var roundEnd = 0, r = 0;
  for(r = 0; r < ROUNDS.length; r++){
    roundEnd += ROUNDS[r];
    if(S.i < roundEnd) break;
  }
  if(r !== S.round && S.i > 0){ basketDone(r); return; }
  S.round = r;

  var f = cur();
  S.tries = 0;
  S.turn++;
  itemEl.className = '';
  itemEl.innerHTML = svgOf(f.k);
  void itemEl.offsetWidth;
  itemEl.className = 'rise';
  setTimeout(function(){ if(itemEl.className === 'rise') itemEl.className = 'bob'; }, 560);
  msgEl.textContent = f.n;
  msgEl.className = 'on nm';
  Object.keys(bands).forEach(function(z){ bands[z].className = 'band'; });
  paintHud();
  S.lock = false;
  setTimeout(function(){ play('n_' + f.k, 1, true); }, 260);
}

function say(t, cls){ msgEl.textContent = t; msgEl.className = 'on ' + cls; }
/* put the food's name back once a "try again" has had its moment, so the line
   under the basket always tells you what he is looking at */
function sayNameAgain(turn){
  if(S.turn !== turn || S.lock) return;
  var f = cur(); if(!f) return;
  msgEl.textContent = f.n; msgEl.className = 'on nm';
}

function answer(z){
  if(S.lock) return;
  var f = cur();
  if(z === f.z){ right(z, f); } else { wrong(z, f); }
}

function wrong(z, f){
  S.tries++;
  S.lock = true;
  var b = bands[z];
  b.classList.add('lose');
  itemEl.className = 'nope';
  play('uhoh', .85);
  setTimeout(function(){ play(pick(TRYAG), 1, true); }, 420);
  say('Oh oh! Not there, Yuvaan. Try again.', 'no');
  var turn = S.turn;
  setTimeout(function(){
    b.classList.remove('lose');
    itemEl.className = 'bob';
    S.lock = false;
    /* he never gets stuck: after two misses the right place starts glowing */
    if(S.tries >= 2) bands[f.z].classList.add('hint');
  }, 900);
  setTimeout(function(){ sayNameAgain(turn); }, 1900);
}

function right(z, f){
  S.lock = true;
  var b = bands[z];
  Object.keys(bands).forEach(function(k){ bands[k].classList.remove('hint'); });
  b.classList.add('win');
  var gained = (S.tries === 0) ? 2 : 1;
  S.stars += gained;
  S.best[f.k] = Math.max(S.best[f.k] || 0, gained);
  play('clap', .95);
  setTimeout(function(){ play(pick(CHEER), 1, true); }, 340);
  say('Yes! ' + f.n + ' grows ' + ZONE[f.z].toLowerCase() + '.', 'ok');
  burst(gained);

  /* the food itself flies out of the basket and into the ground */
  var from = itemEl.getBoundingClientRect(), bd = board.getBoundingClientRect(),
      sc = bd.width / 1000;
  var slot = slotFor(f.z);
  var bandTop = { tree:0, ground:178, under:246 }[f.z];
  var toX = 30 + slot[0], toY = 246 + bandTop + slot[1];
  var fromX = (from.left - bd.left)/sc, fromY = (from.top - bd.top)/sc;

  itemEl.style.visibility = 'hidden';
  flyEl.innerHTML = svgOf(f.k);
  flyEl.style.display = 'block';
  flyEl.style.left = fromX + 'px'; flyEl.style.top = fromY + 'px';
  flyEl.style.transform = 'scale(1)';
  flyEl.style.transition = 'none';
  void flyEl.offsetWidth;
  flyEl.style.transition = 'left .78s cubic-bezier(.45,.05,.3,1), top .78s cubic-bezier(.45,.05,.3,1),'
                         + ' transform .78s cubic-bezier(.45,.05,.3,1)';
  flyEl.style.left = (toX - 48) + 'px';
  flyEl.style.top  = (toY - 48) + 'px';
  flyEl.style.transform = 'scale(.54)';

  setTimeout(function(){
    flyEl.style.display = 'none';
    itemEl.style.visibility = '';
    plant(f, slot);
    b.classList.remove('win');
    S.i++;
    save();
    paintHud();
    setTimeout(nextItem, 520);
  }, 800);
}

function plant(f, slot){
  var host = bands[f.z];
  var d = document.createElement('div');
  d.className = 'grown land';
  d.style.left = (slot[0] - 26) + 'px';
  d.style.top  = (slot[1] - 26) + 'px';
  if(f.z === 'ground'){ d.style.top = (slot[1] - 34) + 'px'; }
  var extra = '';
  if(f.z === 'tree'){
    extra = '<svg style="position:absolute;left:20px;top:-16px;width:12px;height:18px" '
      + 'viewBox="0 0 12 18"><path d="M6 18V4" stroke="#7a5a32" stroke-width="2.6" '
      + 'stroke-linecap="round"/><path d="M6 7q5-4 6 1-4 3-6-1Z" fill="#4ea03a"/></svg>';
  }
  if(f.z === 'under'){
    /* a little shoot poking up, so the soil row still looks like a garden */
    extra = '<svg style="position:absolute;left:18px;top:-' + Math.min(slot[1], 30)
      + 'px;width:16px;height:' + Math.min(slot[1], 30) + 'px" viewBox="0 0 16 30" '
      + 'preserveAspectRatio="none"><path d="M8 30V4" stroke="#3f9c52" stroke-width="3" '
      + 'stroke-linecap="round"/><path d="M8 12L1 6M8 16l7-6" stroke="#5cb043" stroke-width="3" '
      + 'stroke-linecap="round" fill="none"/></svg>';
  }
  d.innerHTML = svgOf(f.k) + extra;
  host.appendChild(d);
  setTimeout(function(){ d.classList.remove('land'); }, 420);
}

function burst(n){
  var r = itemEl.getBoundingClientRect(), bd = board.getBoundingClientRect(),
      sc = bd.width/1000;
  for(var i = 0; i < 6 + n*2; i++){
    var s = document.createElement('div');
    s.className = 'spark';
    s.textContent = (i % 3 === 0) ? '⭐' : (i % 3 === 1 ? '✨' : '🌟');
    s.style.left = ((r.left - bd.left)/sc + 40) + 'px';
    s.style.top  = ((r.top - bd.top)/sc + 40) + 'px';
    var a = Math.random()*Math.PI*2, d = 70 + Math.random()*90;
    s.style.setProperty('--dx', (Math.cos(a)*d).toFixed(0) + 'px');
    s.style.setProperty('--dy', (Math.sin(a)*d - 30).toFixed(0) + 'px');
    s.style.animation = 'fly ' + (0.7 + Math.random()*0.5).toFixed(2) + 's ease-out forwards';
    board.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 1400); })(s);
  }
}

/* ------------------------------------------------------------ panels */
function showPanel(html){ panel.innerHTML = html; veil.classList.add('on'); S.lock = true; }
function hidePanel(){ veil.classList.remove('on'); }

function basketDone(nextRound){
  play('levelup', 1, true);
  var n = ROUNDS[S.round];
  var chips = S.order.slice(S.i - n, S.i).map(function(f){
    return '<div class="bchip">' + svgOf(f.k) + '</div>';
  }).join('');
  showPanel(
     '<h2>Basket ' + (S.round+1) + ' done!</h2>'
    +'<p class="big">⭐ ' + S.stars + ' stars</p>'
    +'<div class="basketRow">' + chips + '</div>'
    +'<p>You planted all of these in the right place, Yuvaan.</p>'
    +'<button class="btn" id="goOn">Next basket</button>');
  document.getElementById('goOn').onclick = function(){
    hidePanel(); S.round = nextRound; S.lock = false; nextItem();
  };
}

function finish(){
  play('trophy', 1, true);
  var max = FOODS.length*2;
  showPanel(
     '<h2>🏆 The whole garden!</h2>'
    +'<p class="big">⭐ ' + S.stars + ' out of ' + max + '</p>'
    +'<p>You put all ' + FOODS.length + ' fruits and vegetables where they really grow.<br>'
    +'That is the whole basket, Yuvaan.</p>'
    +'<button class="btn" id="again">Play again</button>');
  document.getElementById('again').onclick = function(){ hidePanel(); restart(); };
}

function welcome(){
  showPanel(
     '<h2>Where Does It Grow?</h2>'
    +'<p>A fruit or vegetable comes out of the basket.<br>'
    +'Tap the place where it grows: up on a tree or plant, on the ground, or under the ground.</p>'
    +'<button class="btn" id="start">Start</button>');
  document.getElementById('start').onclick = function(){
    unlockAudio(); hidePanel(); S.lock = false; nextItem();
  };
}

function restart(){
  S.order = deal(); S.i = 0; S.tries = 0; S.stars = 0; S.best = {}; S.round = 0;
  SLOTS = { tree:0, ground:0, under:0 };
  Array.prototype.slice.call(document.querySelectorAll('.grown')).forEach(function(e){ e.remove(); });
  Object.keys(bands).forEach(function(z){ bands[z].className = 'band'; });
  save(); paintHud(); nextItem();
}

/* ------------------------------------------------------------ wiring */
Object.keys(bands).forEach(function(z){
  bands[z].addEventListener('click', function(){ unlockAudio(); answer(z); });
});
itemEl.addEventListener('click', function(){
  unlockAudio();
  var f = cur(); if(f) play('n_' + f.k, 1, true);
});
function paintVoiceBtn(){
  var b = document.getElementById('voiceBtn');
  b.classList.toggle('off', !S.voice);
  b.querySelector('#waves').style.display = S.voice ? '' : 'none';
  b.querySelector('#mute').style.display  = S.voice ? 'none' : '';
}
document.getElementById('voiceBtn').onclick = function(){
  S.voice = !S.voice;
  paintVoiceBtn();
  save();
  if(S.voice){ unlockAudio(); setTimeout(function(){ play(pick(CHEER), 1, true); }, 120); }
};
document.getElementById('resetBtn').onclick = function(){ unlockAudio(); restart(); };

/* ------------------------------------------------------------ fit
   innerHeight on an Android tablet includes the strip behind the address
   bar, so the bottom of the board ends up under it. visualViewport is the
   part actually on screen. */
var scale = 1;
function fit(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth,
      h = vv ? vv.height : window.innerHeight;
  var ox = (vv && vv.offsetLeft) ? vv.offsetLeft : 0,
      oy = (vv && vv.offsetTop)  ? vv.offsetTop  : 0;
  scale = Math.min(w/1000, h/640) * 0.98;
  board.style.left = (ox + w/2) + 'px';
  board.style.top  = (oy + h/2) + 'px';
  board.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){
  fit(); setTimeout(fit, 250); setTimeout(fit, 600);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fit);
  window.visualViewport.addEventListener('scroll', fit);
}

/* ------------------------------------------------------------ go */
load();
paintVoiceBtn();
sceneArt();
S.order = deal();
paintHud();
fit();
welcome();
</script>
