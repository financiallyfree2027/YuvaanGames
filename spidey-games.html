<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🕸️ Yuvaan's Spidey Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Comic Sans MS','Chalkboard SE','Marker Felt',sans-serif;
    background:linear-gradient(180deg,#87CEEB 0%,#FFE9A8 100%);
    height:100%; overflow:hidden; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .35s, transform .35s; }
  .hidden { opacity:0; pointer-events:none; transform:scale(.94); }

  /* ---------- SCREEN 1 : one big icon ---------- */
  #homeIcon {
    width:min(46vmin,300px); height:min(46vmin,300px); border-radius:22%;
    background:linear-gradient(160deg,#E53935,#b71c1c);
    border:6px solid #fff; box-shadow:0 14px 40px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    animation:pulse 1.6s ease-in-out infinite; position:relative; overflow:hidden;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  #homeIcon:active { transform:scale(.95); }
  #homeIcon svg { width:82%; height:82%; }
  .home-title { margin-top:26px; font-size:clamp(26px,4.5vw,42px); color:#1E5AE8; text-shadow:2px 2px 0 #fff; }
  .home-hint { margin-top:10px; font-size:clamp(18px,2.5vw,24px); color:#7a5c00; animation:blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ---------- SCREEN 2 : game drawer ---------- */
  #drawer { justify-content:flex-start; padding:20px 16px; overflow-y:auto; }
  .drawer-head { display:flex; align-items:center; gap:14px; margin:8px 0 18px; }
  .mini-badge {
    width:64px; height:64px; border-radius:22%; background:linear-gradient(160deg,#E53935,#b71c1c);
    border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-size:34px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .drawer-head h1 { font-size:clamp(24px,4vw,36px); color:#1E5AE8; text-shadow:2px 2px 0 #fff; }
  .icon-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:26px; width:100%; max-width:1050px; padding-bottom:30px;
  }
  .app {
    display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer;
    transition:transform .15s;
  }
  .app:active { transform:scale(.93); }
  .app-icon {
    width:min(38vmin,220px); height:min(38vmin,220px); border-radius:22%;
    border:6px solid #fff; box-shadow:0 10px 26px rgba(0,0,0,.22); overflow:hidden;
    position:relative;
  }
  .app-icon svg { width:100%; height:100%; display:block; }
  .app-name { font-size:clamp(18px,2.6vw,24px); color:#333; font-weight:bold; text-align:center; text-shadow:1px 1px 0 #fff; }
  .app-progress {
    font-size:16px; color:#7a5c00; background:rgba(255,255,255,.85); border-radius:999px;
    padding:4px 14px; min-height:28px;
  }

  /* ---------- game overlay ---------- */
  #overlay { position:fixed; inset:0; z-index:50; background:#000; display:none; }
  #overlay.open { display:block; }
  #overlay iframe { width:100%; height:100%; border:0; }
  #closeBtn {
    position:fixed; top:10px; right:10px; z-index:60; width:80px; height:80px;
    border-radius:50%; border:4px solid #fff; background:#E53935; color:#fff;
    font-size:32px; font-weight:bold; display:none; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.4); font-family:inherit;
  }
  #overlay.open ~ #closeBtn { display:block; }
</style>
</head>
<body>

<!-- ============ SCREEN 1 : the one icon ============ -->
<div class="screen" id="home">
  <div id="homeIcon" aria-label="Open games">
    <!-- Web Buddy face + web -->

<div id="overlay"><iframe id="gameFrame" src="about:blank" allow="autoplay"></iframe></div>
<button id="closeBtn" aria-label="Close game">✕</button>

<script>
  var home = document.getElementById('home');
  var drawer = document.getElementById('drawer');
  var overlay = document.getElementById('overlay');
  var frame = document.getElementById('gameFrame');
  var closeBtn = document.getElementById('closeBtn');

  document.getElementById('homeIcon').addEventListener('click', function(){
    home.classList.add('hidden'); drawer.classList.remove('hidden'); refreshProgress();
  });
  document.getElementById('backHome').addEventListener('click', function(){
    drawer.classList.add('hidden'); home.classList.remove('hidden');
  });

  // Progress badges: read each game's saved {unlocked, stars[]} if available
  function refreshProgress(){
    document.querySelectorAll('.app').forEach(function(app){
      var el = app.querySelector('[data-prog]');
      try {
        var raw = localStorage.getItem(app.getAttribute('data-key'));
        if (!raw) { el.textContent = 'Ready to play!'; return; }
        var d = JSON.parse(raw);
        var done = 0, stars = 0;
        (d.stars || []).forEach(function(s){ if (s > 0) { done++; stars += s; } });
        el.textContent = done >= 20 ? '🏆 All 20 done! ⭐' + stars
                        : done > 0 ? '📍 Level ' + Math.min((d.unlocked || 1), 20) + '/20 · ⭐' + stars
                        : 'Ready to play!';
      } catch(e) { el.textContent = 'Ready to play!'; }
    });
  }

  // Launch game fullscreen
  document.querySelectorAll('.app').forEach(function(app){
    app.addEventListener('click', function(){
      frame.src = app.getAttribute('data-src');
      overlay.classList.add('open');
    });
  });
  closeBtn.addEventListener('click', function(){
    overlay.classList.remove('open');
    frame.src = 'about:blank'; // stops game + audio
    refreshProgress();
  });

  // Block double-tap zoom & context menu
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
</script>
</body>
</html>
