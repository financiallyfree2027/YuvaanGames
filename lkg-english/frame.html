<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;position:fixed;width:100%}
body{font-family:'Comic Sans MS','Chalkboard SE','Marker Felt',sans-serif;
  background:linear-gradient(180deg,#FDFAF4 0%,#eaf3fb 55%,#dcebf7 100%);
  color:#241D15;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  overflow-y:auto;overflow-x:hidden;padding:clamp(8px,2vh,20px) 14px clamp(14px,3vh,24px);
  gap:clamp(6px,1.5vh,14px)}
.screen.on{display:flex}

/* ---------- menu ---------- */
#menu{justify-content:flex-start}
#gameTitle{margin-top:auto;font-size:clamp(26px,7vw,50px);text-align:center;line-height:1.2;color:#3D8DDB}
#menuSub{font-size:clamp(14px,3.4vw,20px);color:#8B5E3C;text-align:center}
#menuStars{font-size:clamp(18px,4.4vw,26px);color:#F4A340;font-weight:bold}
.howRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.howCard{background:#fff;border:4px solid #dfe7ef;border-radius:18px;padding:10px 14px;
  font-size:clamp(17px,2.6vh,25px);text-align:center;min-width:96px;box-shadow:0 4px 0 rgba(36,29,21,.1)}
.howCard small{display:block;font-size:12px;color:#8B5E3C;margin-top:2px}
.bigBtn{font:inherit;font-weight:bold;font-size:clamp(24px,3.6vh,40px);background:#2FAE7C;
  color:#fff;border:5px solid #fff;border-radius:26px;padding:clamp(12px,2vh,20px) clamp(30px,6vw,56px);
  min-height:clamp(58px,9vh,92px);box-shadow:0 7px 0 rgba(36,29,21,.25);cursor:pointer;
  animation:btnPulse 2.4s ease-in-out infinite}
.bigBtn:active{transform:scale(.95);box-shadow:0 3px 0 rgba(36,29,21,.25)}
@keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.altBtn{font:inherit;font-weight:bold;font-size:clamp(17px,2.6vh,24px);background:#7B47C9;color:#fff;
  border:5px solid #fff;border-radius:20px;padding:11px 26px;box-shadow:0 5px 0 rgba(36,29,21,.22);cursor:pointer}
.altBtn:active{transform:scale(.95)}
#menuFoot{margin-bottom:auto;font-size:13px;color:#8B5E3C;text-align:center}

/* ---------- play ---------- */
#play{justify-content:flex-start;padding-top:8px}
#topBar{display:flex;align-items:center;gap:9px;width:100%;max-width:680px;flex:0 0 auto}
.tbtn{border:4px solid #fff;border-radius:16px;width:54px;height:54px;font-size:24px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(36,29,21,.2)}
#backBtn{background:#7B47C9}#sayBtn{background:#3D8DDB}
#lvlTag{background:#E85D4A;color:#fff;border:4px solid #fff;border-radius:16px;padding:7px 14px;
  font-size:20px;font-weight:bold;flex:0 0 auto;box-shadow:0 4px 0 rgba(36,29,21,.18)}
#missTag{background:#FFC93C;color:#241D15;border:4px solid #fff;border-radius:16px;padding:7px 12px;
  font-size:18px;font-weight:bold;flex:0 0 auto;box-shadow:0 4px 0 rgba(36,29,21,.18)}
#prog{flex:1;height:18px;background:#e4ecf4;border:3px solid #fff;border-radius:10px;overflow:hidden;
  box-shadow:0 3px 0 rgba(36,29,21,.12)}
#progFill{display:block;height:100%;width:0;background:#2FAE7C;transition:width .35s}
#dots{font-size:19px;letter-spacing:3px;color:#2FAE7C;flex:0 0 auto}
#qArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vh,18px);width:100%;min-height:0;padding:4px 0 10px}

.picBox{background:#fff;border:5px solid #241D15;border-radius:24px;padding:7px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(36,29,21,.18);
  max-width:min(60vw,300px);max-height:34vh}
.picBox svg{display:block}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.slot{font-size:clamp(32px,8vw,48px);font-weight:bold;width:clamp(52px,13vw,70px);
  height:clamp(64px,16vw,84px);border-radius:14px;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;background:#fff;border:5px solid #241D15;border-bottom-width:10px}
.slot.filled{background:#FFC93C;border-bottom-width:5px}
.slot.hole{border-style:dashed;background:#fff}
.lbtn{font:inherit;font-weight:bold;font-size:clamp(26px,6.5vw,38px);
  width:clamp(58px,15vw,76px);height:clamp(58px,15vw,76px);border-radius:18px;border:5px solid #fff;
  background:#3D8DDB;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(36,29,21,.25);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lbtn.big{font-size:clamp(36px,10vw,56px);width:clamp(84px,22vw,110px);height:clamp(84px,22vw,110px)}
.lbtn:active{transform:scale(.94);box-shadow:0 3px 0 rgba(36,29,21,.25)}
.lbtn.gone{visibility:hidden}

/* ---------- map ---------- */
#map{justify-content:flex-start}
#mapHead{display:flex;align-items:center;gap:10px;width:100%;max-width:680px}
#mapTotal{font-size:20px;font-weight:bold;color:#F4A340;flex:1;text-align:center}
#mapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;
  width:100%;max-width:680px;padding-bottom:20px}
.node{font:inherit;border-radius:18px;border:4px solid #fff;padding:8px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 rgba(36,29,21,.18)}
.node .nNum{font-size:24px;font-weight:bold}
.node .nStars{font-size:13px;letter-spacing:1px}
.node .nBand{font-size:11px;opacity:.9}
.node .nLock{font-size:22px}
.node.now{background:#2FAE7C;color:#fff;animation:btnPulse 1.8s ease-in-out infinite}
.node.done{background:#3D8DDB;color:#fff}
.node.locked{background:#dfe7ef;color:#9aa9b8;box-shadow:0 5px 0 rgba(36,29,21,.08)}

/* ---------- win ---------- */
#winScreen{justify-content:flex-start}
#winStars{margin-top:auto;font-size:clamp(44px,12vw,86px);letter-spacing:6px}
#winNote{font-size:clamp(18px,4.4vw,26px);color:#2FAE7C;font-weight:bold}
#winWords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.ww{background:#fff;border:4px solid #3D8DDB;border-radius:14px;padding:6px 12px;
  font-size:clamp(15px,3.6vw,21px);font-weight:bold;letter-spacing:2px}
#winBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:auto}

/* ---------- "listen again" (shown instead of any kind of cross) ---------- */
.again{display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:againIn .35s ease-out}
@keyframes againIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
.againEar{font-size:clamp(52px,13vw,84px);animation:earWiggle .9s ease-in-out infinite}
@keyframes earWiggle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.1)}}
.againWord{font-size:clamp(28px,7vw,44px);font-weight:bold;letter-spacing:6px;color:#3D8DDB}

/* a button that is still waking up — stops a tap landing before he has looked */
.lbtn.warm{opacity:.45;pointer-events:none}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:absolute;font-size:46px;animation:popUp 1.1s ease-out forwards}
@keyframes popUp{0%{opacity:0;transform:translateY(0) scale(.5)}
  25%{opacity:1;transform:translateY(-18px) scale(1.15)}
  100%{opacity:0;transform:translateY(-95px) scale(1)}}
.conf{position:absolute;width:12px;height:18px;border-radius:3px;animation:fall 2s linear forwards}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}
  100%{transform:translateY(108vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>

<div class="screen on" id="menu">
  <div id="gameTitle"></div>
  <div id="menuSub">__SUB__</div>
  <div id="menuStars"></div>
  <div class="howRow">__HOW__</div>
  <button class="bigBtn" id="startBtn">▶️</button>
  <button class="altBtn" id="mapBtn">🗺️</button>
  <div id="menuFoot">1 · 2 · 3 … 24 &nbsp; ⭐</div>
</div>

<div class="screen" id="play">
  <div id="topBar">
    <div class="tbtn" id="backBtn">🗺️</div>
    <div class="tbtn" id="sayBtn">🔊</div>
    <div id="lvlTag">📗 1</div>
    <div id="prog"><i id="progFill"></i></div>
    <div id="missTag">🔁 0</div>
  </div>
  <div id="dots"></div>
  <div id="qArea"></div>
</div>

<div class="screen" id="map">
  <div id="mapHead">
    <button class="tbtn" id="mapBack" style="background:#E85D4A">⬅️</button>
    <div id="mapTotal"></div>
  </div>
  <div id="mapGrid"></div>
</div>

<div class="screen" id="winScreen">
  <div id="winStars">⭐⭐⭐</div>
  <div id="winNote"></div>
  <div id="winWords"></div>
  <div id="winBtns">
    <button class="bigBtn" id="nextBtn">▶️</button>
    <button class="altBtn" id="againBtn">🔁</button>
    <button class="altBtn" id="winMapBtn">🗺️</button>
  </div>
</div>

<div id="fx"></div>
</body>
</html>
