<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🔤 Missing Letter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;position:fixed;width:100%}
body{font-family:'Comic Sans MS','Chalkboard SE','Marker Felt',sans-serif;
  background:linear-gradient(180deg,#FDFAF4 0%,#eaf3fb 55%,#dcebf7 100%);
  color:#241D15;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  overflow-y:auto;overflow-x:hidden;padding:clamp(8px,2vh,20px) 14px clamp(14px,3vh,24px);
  gap:clamp(6px,1.5vh,14px)}
.screen.on{display:flex}

/* ---------- menu ---------- */
#menu{justify-content:flex-start}
#gameTitle{margin-top:auto;font-size:clamp(26px,7vw,50px);text-align:center;line-height:1.2;color:#3D8DDB}
#menuSub{font-size:clamp(14px,3.4vw,20px);color:#8B5E3C;text-align:center}
#menuStars{font-size:clamp(18px,4.4vw,26px);color:#F4A340;font-weight:bold}
.howRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.howCard{background:#fff;border:4px solid #dfe7ef;border-radius:18px;padding:10px 14px;
  font-size:clamp(17px,2.6vh,25px);text-align:center;min-width:96px;box-shadow:0 4px 0 rgba(36,29,21,.1)}
.howCard small{display:block;font-size:12px;color:#8B5E3C;margin-top:2px}
.bigBtn{font:inherit;font-weight:bold;font-size:clamp(24px,3.6vh,40px);background:#2FAE7C;
  color:#fff;border:5px solid #fff;border-radius:26px;padding:clamp(12px,2vh,20px) clamp(30px,6vw,56px);
  min-height:clamp(58px,9vh,92px);box-shadow:0 7px 0 rgba(36,29,21,.25);cursor:pointer;
  animation:btnPulse 2.4s ease-in-out infinite}
.bigBtn:active{transform:scale(.95);box-shadow:0 3px 0 rgba(36,29,21,.25)}
@keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.altBtn{font:inherit;font-weight:bold;font-size:clamp(17px,2.6vh,24px);background:#7B47C9;color:#fff;
  border:5px solid #fff;border-radius:20px;padding:11px 26px;box-shadow:0 5px 0 rgba(36,29,21,.22);cursor:pointer}
.altBtn:active{transform:scale(.95)}
#menuFoot{margin-bottom:auto;font-size:13px;color:#8B5E3C;text-align:center}

/* ---------- play ---------- */
#play{justify-content:flex-start;padding-top:8px}
#topBar{display:flex;align-items:center;gap:9px;width:100%;max-width:680px;flex:0 0 auto}
.tbtn{border:4px solid #fff;border-radius:16px;width:54px;height:54px;font-size:24px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(36,29,21,.2)}
#backBtn{background:#7B47C9}#sayBtn{background:#3D8DDB}
#lvlTag{background:#E85D4A;color:#fff;border:4px solid #fff;border-radius:16px;padding:7px 14px;
  font-size:20px;font-weight:bold;flex:0 0 auto;box-shadow:0 4px 0 rgba(36,29,21,.18)}
#missTag{background:#FFC93C;color:#241D15;border:4px solid #fff;border-radius:16px;padding:7px 12px;
  font-size:18px;font-weight:bold;flex:0 0 auto;box-shadow:0 4px 0 rgba(36,29,21,.18)}
#prog{flex:1;height:18px;background:#e4ecf4;border:3px solid #fff;border-radius:10px;overflow:hidden;
  box-shadow:0 3px 0 rgba(36,29,21,.12)}
#progFill{display:block;height:100%;width:0;background:#2FAE7C;transition:width .35s}
#dots{font-size:19px;letter-spacing:3px;color:#2FAE7C;flex:0 0 auto}
#qArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vh,18px);width:100%;min-height:0;padding:4px 0 10px}

.picBox{background:#fff;border:5px solid #241D15;border-radius:24px;padding:7px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(36,29,21,.18);
  max-width:min(60vw,300px);max-height:34vh}
.picBox svg{display:block}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.slot{font-size:clamp(32px,8vw,48px);font-weight:bold;width:clamp(52px,13vw,70px);
  height:clamp(64px,16vw,84px);border-radius:14px;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;background:#fff;border:5px solid #241D15;border-bottom-width:10px}
.slot.filled{background:#FFC93C;border-bottom-width:5px}
.slot.hole{border-style:dashed;background:#fff}
.lbtn{font:inherit;font-weight:bold;font-size:clamp(26px,6.5vw,38px);
  width:clamp(58px,15vw,76px);height:clamp(58px,15vw,76px);border-radius:18px;border:5px solid #fff;
  background:#3D8DDB;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(36,29,21,.25);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lbtn.big{font-size:clamp(36px,10vw,56px);width:clamp(84px,22vw,110px);height:clamp(84px,22vw,110px)}
.lbtn:active{transform:scale(.94);box-shadow:0 3px 0 rgba(36,29,21,.25)}
.lbtn.gone{visibility:hidden}

/* ---------- map ---------- */
#map{justify-content:flex-start}
#mapHead{display:flex;align-items:center;gap:10px;width:100%;max-width:680px}
#mapTotal{font-size:20px;font-weight:bold;color:#F4A340;flex:1;text-align:center}
#mapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;
  width:100%;max-width:680px;padding-bottom:20px}
.node{font:inherit;border-radius:18px;border:4px solid #fff;padding:8px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 rgba(36,29,21,.18)}
.node .nNum{font-size:24px;font-weight:bold}
.node .nStars{font-size:13px;letter-spacing:1px}
.node .nBand{font-size:11px;opacity:.9}
.node .nLock{font-size:22px}
.node.now{background:#2FAE7C;color:#fff;animation:btnPulse 1.8s ease-in-out infinite}
.node.done{background:#3D8DDB;color:#fff}
.node.locked{background:#dfe7ef;color:#9aa9b8;box-shadow:0 5px 0 rgba(36,29,21,.08)}

/* ---------- win ---------- */
#winScreen{justify-content:flex-start}
#winStars{margin-top:auto;font-size:clamp(44px,12vw,86px);letter-spacing:6px}
#winNote{font-size:clamp(18px,4.4vw,26px);color:#2FAE7C;font-weight:bold}
#winWords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.ww{background:#fff;border:4px solid #3D8DDB;border-radius:14px;padding:6px 12px;
  font-size:clamp(15px,3.6vw,21px);font-weight:bold;letter-spacing:2px}
#winBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:auto}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:absolute;font-size:46px;animation:popUp 1.1s ease-out forwards}
@keyframes popUp{0%{opacity:0;transform:translateY(0) scale(.5)}
  25%{opacity:1;transform:translateY(-18px) scale(1.15)}
  100%{opacity:0;transform:translateY(-95px) scale(1)}}
.conf{position:absolute;width:12px;height:18px;border-radius:3px;animation:fall 2s linear forwards}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}
  100%{transform:translateY(108vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>

<div class="screen on" id="menu">
  <div id="gameTitle"></div>
  <div id="menuSub">Find the letter that is missing</div>
  <div id="menuStars"></div>
  <div class="howRow"><div class="howCard">🖼️<small>look</small></div><div class="howCard">🔊<small>listen</small></div><div class="howCard">🔤<small>tap</small></div></div>
  <button class="bigBtn" id="startBtn">▶️</button>
  <button class="altBtn" id="mapBtn">🗺️</button>
  <div id="menuFoot">1 · 2 · 3 … 24 &nbsp; ⭐</div>
</div>

<div class="screen" id="play">
  <div id="topBar">
    <div class="tbtn" id="backBtn">🗺️</div>
    <div class="tbtn" id="sayBtn">🔊</div>
    <div id="lvlTag">📗 1</div>
    <div id="prog"><i id="progFill"></i></div>
    <div id="missTag">🔁 0</div>
  </div>
  <div id="dots"></div>
  <div id="qArea"></div>
</div>

<div class="screen" id="map">
  <div id="mapHead">
    <button class="tbtn" id="mapBack" style="background:#E85D4A">⬅️</button>
    <div id="mapTotal"></div>
  </div>
  <div id="mapGrid"></div>
</div>

<div class="screen" id="winScreen">
  <div id="winStars">⭐⭐⭐</div>
  <div id="winNote"></div>
  <div id="winWords"></div>
  <div id="winBtns">
    <button class="bigBtn" id="nextBtn">▶️</button>
    <button class="altBtn" id="againBtn">🔁</button>
    <button class="altBtn" id="winMapBtn">🗺️</button>
  </div>
</div>

<div id="fx"></div>

/* =====================================================================
   THE WORD BANK, grouped by vowel.  Everything here has a picture.
   ===================================================================== */
const BANK={
  a:['cat','cap','van','map','bag','hat','fan','jam','can','pan','mat','tag','pad','sad','jar'],
  e:['bed','hen','pen','net','jet','ten','web','leg','peg','men','gem','den'],
  i:['pig','pin','six','lid','zip','bin','fig'],
  o:['dog','box','top','pot','log','mop','fox'],
  u:['bus','sun','cup','bug','mug','nut','rug','jug','tub']
};
/* the nine words straight off this week's worksheet — level 1 uses these */
const WORKSHEET_A_E=['men','map','jet','pad','gem','tag','den','sad','pen'];
const WORKSHEET_Q2 =['bed','cat','cap','van','net','jar','pad','hen'];

<script>
/* =====================================================================
   SHARED ENGINE for Yuvaan's two English practice games.
   Both games are the same shape:  24 levels · 6 words each · a level map
   with stars · localStorage save · no fail state · everything spoken.
   The only thing that differs is how one question is drawn and marked,
   which each game supplies as a small object.
   ===================================================================== */
"use strict";
const $=id=>document.getElementById(id);
const shuffle=a=>a.slice().sort(()=>Math.random()-0.5);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- voice ---------------- */
let BV=null, VOICE_READY=false;
function loadV(){
  if(!window.speechSynthesis) return;
  const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
  if(!v.length) return;
  const sc=x=>(/premium|enhanced|neural|natural/i.test(x.name)?10:0)
    +(/google (uk|us) english/i.test(x.name)?5:0)
    +(/ava|zoe|samantha|allison|karen|moira/i.test(x.name)?4:0)
    -(/albert|bad news|bells|boing|bubbles|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|ralph|junior/i.test(x.name)?20:0);
  BV=v.slice().sort((a,b)=>sc(b)-sc(a))[0]; VOICE_READY=true;
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=loadV; loadV(); }
function say(text,rate){
  if(!window.speechSynthesis) return;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.rate=rate||0.85; u.pitch=1.05;
    if(BV){u.voice=BV;u.lang=BV.lang;}
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
/* the word sounded out the way it is taught: letters, then blended */
function sound(word){ say(word.split('').join(', ')+' ... '+word, 0.7); }

/* ---------------- little noises ---------------- */
const AU={ctx:null,muted:false};
function audioOn(){
  try{ if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext; if(C) AU.ctx=new C();}
       else AU.ctx.resume&&AU.ctx.resume(); }catch(e){}
}
function beep(f,type,dur,vol){
  if(!AU.ctx||AU.muted) return;
  try{
    const t=AU.ctx.currentTime,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.12,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.18));
    o.connect(g); g.connect(AU.ctx.destination); o.start(t); o.stop(t+(dur||0.18)+0.02);
  }catch(e){}
}
const sYes  =()=>[660,880,1180].forEach((f,i)=>setTimeout(()=>beep(f,'square',0.13,0.09),i*80));
const sNo   =()=>{beep(260,'sine',0.16,0.08); setTimeout(()=>beep(205,'sine',0.2,0.07),110);};
const sTap  =()=>beep(560,'square',0.06,0.06);
const sStar =()=>[880,1180,1560].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.16,0.09),i*90));
const sWin  =()=>[523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,'square',0.19,0.1),i*105));
const sLock =()=>{beep(200,'square',0.12,0.07); setTimeout(()=>beep(150,'square',0.16,0.06),100);};

/* =====================================================================
   LEVEL LADDER — 24 levels.
   Each game supplies its own PLAN describing what changes as they climb.
   ===================================================================== */
const WORDS_PER_LEVEL=6;
const NLV=24;

/* =====================================================================
   SAVE
   ===================================================================== */
let SAVE_KEY='lkg_generic';
let save={unlocked:1,stars:new Array(NLV).fill(0),best:new Array(NLV).fill(0),played:0};
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d=JSON.parse(raw); if(!d||typeof d!=='object') return;
    save.unlocked=clamp((d.unlocked|0)||1,1,NLV);
    if(Array.isArray(d.stars)) save.stars=d.stars.slice(0,NLV).map(x=>clamp(x|0,0,3));
    if(Array.isArray(d.best))  save.best =d.best.slice(0,NLV).map(x=>Math.max(0,x|0));
    while(save.stars.length<NLV) save.stars.push(0);
    while(save.best.length<NLV)  save.best.push(0);
    save.played=Math.max(0,d.played|0);
  }catch(e){}
}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

/* =====================================================================
   EFFECTS
   ===================================================================== */
function popAt(el,txt){
  if(!el||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect();
  const d=document.createElement('div'); d.className='pop'; d.textContent=txt;
  d.style.left=(r.left+r.width/2-26)+'px'; d.style.top=r.top+'px';
  $('fx').appendChild(d); setTimeout(()=>d.remove(),1200);
}
function confetti(n){
  const box=$('fx'), cols=['#E85D4A','#3D8DDB','#FFC93C','#2FAE7C','#FF8AC5','#7B47C9'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.left=(Math.random()*100)+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.3+Math.random()*1.2)+'s';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    box.appendChild(c); setTimeout(()=>c.remove(),3400);
  }
}
function wobble(el){ if(el&&el.animate) el.animate(
  [{transform:'translateX(0)'},{transform:'translateX(-10px)'},
   {transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:330}); }
function bounce(el){ if(el&&el.animate) el.animate(
  [{transform:'scale(1)'},{transform:'scale(1.24)'},{transform:'scale(1)'}],{duration:350}); }

/* =====================================================================
   BUILDING BLOCKS the games draw with
   ===================================================================== */
function picBox(name,size){
  const d=document.createElement('div');
  d.className='picBox';
  d.style.width=size+'px'; d.style.height=size+'px';
  d.innerHTML=PICS[name]||'';
  const s=d.querySelector('svg'); if(s){s.style.width='100%';s.style.height='100%';}
  return d;
}
function slotBox(ch,filled,dashed){
  const d=document.createElement('div');
  d.className='slot'+(filled?' filled':'')+(dashed?' hole':'');
  d.textContent=ch||'';
  return d;
}
function letterBtn(ch,big){
  const b=document.createElement('button');
  b.className='lbtn'+(big?' big':'');
  b.textContent=ch.toUpperCase();
  b.addEventListener('pointerdown',()=>sTap());
  return b;
}
function row(gap,cls){
  const d=document.createElement('div');
  d.className='row '+(cls||''); d.style.gap=(gap||10)+'px';
  return d;
}

/* =====================================================================
   THE GAME LOOP
   ===================================================================== */
const S={level:1,i:0,list:[],misses:0,levelMisses:0,phase:'menu'};
let GAME=null;                 /* set by the game file */

function startLevel(n){
  S.level=n; S.i=0; S.levelMisses=0;
  S.list=GAME.buildLevel(n);
  S.phase='play';
  $('menu').classList.remove('on');
  $('map').classList.remove('on');
  $('play').classList.add('on');
  $('winScreen').classList.remove('on');
  audioOn();
  render();
}
function render(){
  hud();
  if(S.i>=S.list.length){ levelDone(); return; }
  const body=$('qArea'); body.innerHTML='';
  GAME.render(S.list[S.i], body, {correct,wrong});
}
function hud(){
  $('lvlTag').textContent='📗 '+S.level;
  $('progFill').style.width=Math.round(S.i/S.list.length*100)+'%';
  let dots='';
  for(let k=0;k<S.list.length;k++) dots += k<S.i?'●':'○';
  $('dots').textContent=dots;
  $('missTag').textContent='🔁 '+S.levelMisses;
}
function correct(word,el){
  sYes(); if(el){bounce(el); popAt(el,pick(['⭐','🎉','✨','👏','🌟']));}
  confetti(9); say(word,0.86);
  setTimeout(()=>{ S.i++; render(); },900);
}
function wrong(word,el){
  S.misses++; S.levelMisses++; sNo(); if(el) wobble(el);
  hud();
  /* never a loss — it simply says the word again and waits */
  setTimeout(()=>sound(word),280);
}
/* stars: 3 for a clean run, 2 for a few slips, 1 for finishing at all.
   The floor is 1 — he can never come away with nothing. */
function starsFor(miss,total){
  if(miss===0) return 3;
  if(miss<=Math.ceil(total/3)) return 2;
  return 1;
}
function levelDone(){
  S.phase='done';
  const st=starsFor(S.levelMisses,S.list.length);
  const idx=S.level-1;
  const prevStars=save.stars[idx], prevBest=save.best[idx];
  if(st>save.stars[idx]) save.stars[idx]=st;
  /* honest scorekeeping: the record only moves on a genuinely better run */
  if(prevBest===0||S.levelMisses<prevBest) save.best[idx]=S.levelMisses;
  if(S.level>=save.unlocked && S.level<NLV) save.unlocked=S.level+1;
  save.played++;
  persist();
  sWin(); confetti(60);
  $('play').classList.remove('on');
  $('winScreen').classList.add('on');
  $('winStars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('winWords').innerHTML=S.list.map(q=>
    `<span class="ww">${(q.w||'').toUpperCase()}</span>`).join('');
  $('winNote').textContent = S.levelMisses===0
    ? 'Perfect!' : (S.levelMisses<prevBest||prevBest===0 ? 'Best yet: '+S.levelMisses+' 🔁'
                                                        : 'Your record: '+prevBest+' 🔁');
  $('nextBtn').textContent = S.level<NLV ? '▶️ '+(S.level+1) : '🗺️';
  say(st===3?'Perfect! Well done Yuvaan!':'Well done Yuvaan!',0.88);
}

/* =====================================================================
   LEVEL MAP
   ===================================================================== */
function buildMap(){
  const host=$('mapGrid'); host.innerHTML='';
  for(let n=1;n<=NLV;n++){
    const unlocked = n<=save.unlocked;
    const st=save.stars[n-1];
    const d=document.createElement('button');
    d.className='node'+(unlocked?(st>0?' done':' now'):' locked');
    const band=GAME.bandOf(n);
    d.innerHTML = unlocked
      ? `<div class="nStars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
         <div class="nNum">${n}</div>
         <div class="nBand">${band}</div>`
      : `<div class="nLock">🔒</div><div class="nNum">${n}</div>`;
    d.onclick=()=>{
      audioOn();
      if(!unlocked){ sLock(); wobble(d); return; }
      sTap(); startLevel(n);
    };
    host.appendChild(d);
  }
  const total=save.stars.reduce((a,b)=>a+b,0);
  $('mapTotal').textContent='⭐ '+total+' / '+(NLV*3);
}
function openMap(){
  S.phase='map';
  buildMap();
  $('menu').classList.remove('on');
  $('play').classList.remove('on');
  $('winScreen').classList.remove('on');
  $('map').classList.add('on');
}

/* =====================================================================
   WIRING
   ===================================================================== */
function bootEngine(game,key,title){
  GAME=game; SAVE_KEY=key; loadSave();
  $('gameTitle').innerHTML=title;
  $('startBtn').onclick=()=>{ audioOn(); startLevel(save.unlocked); };
  $('mapBtn').onclick=()=>{ audioOn(); openMap(); };
  $('backBtn').onclick=()=>openMap();
  $('mapBack').onclick=()=>{ $('map').classList.remove('on'); $('menu').classList.add('on'); };
  $('sayBtn').onclick=()=>{ const q=S.list[S.i]; if(q) sound(q.w); };
  $('nextBtn').onclick=()=>{
    audioOn();
    if(S.level<NLV) startLevel(S.level+1); else openMap();
  };
  $('againBtn').onclick=()=>{ audioOn(); startLevel(S.level); };
  $('winMapBtn').onclick=()=>openMap();
  /* first tap anywhere unlocks the voice on iPad */
  document.addEventListener('pointerdown',()=>{audioOn(); if(!VOICE_READY) loadV();},{once:true});
  const done=save.stars.filter(x=>x>0).length;
  $('startBtn').textContent = done? '▶️ '+save.unlocked : '▶️';
  $('menuStars').textContent='⭐ '+save.stars.reduce((a,b)=>a+b,0)+' / '+(NLV*3);
}

</script>
<script>
/* =====================================================================
   GAME 2 — "Which letter is missing?"  (the worksheet's Q2, as 24 levels)

   Picture + the word with ONE letter missing + letter buttons to choose from.
   The climb:
     1-6    the LAST letter is missing        (he can see the start — easiest)
     7-12   the FIRST letter is missing
     13-18  the MIDDLE letter is missing      (this is the vowel again)
     19-24  a random position each time
   The number of wrong letters offered also grows, 2 → 5, so guessing
   stops working and he has to actually read.
   Level 1 uses the eight words straight off the worksheet.
   ===================================================================== */
const LETTER_PLAN=[];
for(let n=1;n<=24;n++){
  let mode, band;
  if(n<=6)       { mode='last';   band='_ _ ?'; }
  else if(n<=12) { mode='first';  band='? _ _'; }
  else if(n<=18) { mode='middle'; band='_ ? _'; }
  else           { mode='any';    band='? ? ?'; }
  /* decoys: 2 at the start, 5 by the end */
  const decoys = n<=4?2 : n<=9?3 : n<=15?4 : 5;
  LETTER_PLAN.push({mode,band,decoys});
}

const LetterGame={
  bandOf:n=>LETTER_PLAN[n-1].band,

  buildLevel(n){
    const p=LETTER_PLAN[n-1];
    let pool;
    if(n===1){
      pool=shuffle(WORKSHEET_Q2);
    }else{
      /* early levels stay on a and e like the homework, then widen out */
      let vs = n<=6?['a','e'] : n<=12?['a','e','i'] : n<=18?['a','e','i','o'] : ['a','e','i','o','u'];
      pool=[];
      vs.forEach(v=>{ pool=pool.concat(shuffle(BANK[v]).slice(0,4)); });
      pool=shuffle(pool);
    }
    const words=pool.slice(0,WORDS_PER_LEVEL);
    return words.map(w=>{
      let miss;
      if(p.mode==='last')        miss=2;
      else if(p.mode==='first')  miss=0;
      else if(p.mode==='middle') miss=1;
      else                       miss=Math.floor(Math.random()*3);
      return {w, pic:w, miss, decoys:p.decoys};
    });
  },

  render(q,root,cb){
    root.appendChild(picBox(q.pic,190));

    const wr=row(8);
    const slots=q.w.split('').map((c,i)=>
      slotBox(i===q.miss?'':c.toUpperCase(), i!==q.miss, i===q.miss));
    slots.forEach(s=>wr.appendChild(s));
    root.appendChild(wr);

    const right=q.w[q.miss];
    /* decoys are drawn from letters that really appear in these words,
       so the wrong answers are plausible rather than random noise */
    const alphabet='bcdfghjlmnprstvwxz'.split('').concat(['a','e','i','o','u']);
    const others=shuffle(alphabet.filter(c=>c!==right)).slice(0,q.decoys);
    const opts=shuffle(others.concat([right]));

    const br=row(10);
    opts.forEach(o=>{
      const b=letterBtn(o);
      b.onclick=()=>{
        if(b.dataset.dead) return;
        if(o===right){
          slots[q.miss].textContent=o.toUpperCase();
          slots[q.miss].className='slot filled';
          br.querySelectorAll('button').forEach(x=>x.dataset.dead='1');
          cb.correct(q.w,b);
        }else{
          /* a wrong letter fades out so the choice narrows — helpful,
             never punishing */
          b.style.opacity='.35';
          cb.wrong(q.w,b);
        }
      };
      br.appendChild(b);
    });
    root.appendChild(br);
    setTimeout(()=>sound(q.w),320);
  }
};

bootEngine(LetterGame,'yuvaan_letters','🔤 Missing Letter');

</script>
